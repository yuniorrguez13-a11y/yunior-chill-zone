<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Room</title>

  <style>
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background-image: url("https://raw.githubusercontent.com/yuniorrguez13-a11y/videox/refs/heads/main/stranger_things_3-wallpaper-3840x2160.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      backdrop-filter: blur(4px);
      background: linear-gradient(120deg, rgba(3, 6, 18, 0.8), rgba(10, 12, 28, 0.6));
      padding: 40px 20px 60px;
      box-sizing: border-box;
    }

    header {
      width: min(1200px, 92%);
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    h1 {
      text-align: left;
      color: white;
      font-size: clamp(32px, 5vw, 52px);
      margin: 0;
      font-weight: 800;
      text-shadow: 0px 0px 12px black;
    }

    .subtitle {
      margin: 10px 0 0;
      color: #cbd3ff;
      font-size: 16px;
    }

    .playlist-grid {
      width: min(1400px, 92%);
      margin: 40px auto 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 25px;
    }

    .playlist-item {
      backdrop-filter: blur(6px);
      background: rgba(10, 12, 24, 0.7);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 12px;
      box-shadow: 0 16px 35px rgba(0,0,0,0.4);
      text-align: center;
      transition: 0.3s;
    }

    .playlist-item:hover {
      transform: translateY(-6px);
      border-color: white;
    }

    iframe {
      width: 100%;
      height: 250px;
      border-radius: 12px;
      border: none;
    }

    .coming-soon {
      color: white;
      font-size: 26px;
      font-weight: bold;
      text-shadow: 0px 0px 8px black;
      padding: 80px 0;
    }

    .home-link {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.35);
    }

    .home-link:hover {
      background: #fff;
      color: #111;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Music Room</h1>
        <p class="subtitle">Press play and let the playlists roll.</p>
      </div>
      <a class="home-link" href="index.html">Back to Chat</a>
    </header>

    <div class="playlist-grid">
      <!-- PLAYLIST 1 -->
      <div class="playlist-item">
        <iframe src="https://www.youtube.com/embed/videoseries?list=PLJNeO1p-8YtULYmt-jkFg2BmNltcnYu-N"
        allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>

      <!-- PLAYLIST 2 -->
      <div class="playlist-item">
        <iframe 
          src="https://www.youtube.com/embed/videoseries?list=PLJNeO1p-8YtUEpfB6aO6DS2F4eR_oTJUh" 
          allow="autoplay; encrypted-media"
          allowfullscreen>
        </iframe>
      </div>

      <!-- PLAYLIST 3 -->
      <div class="playlist-item">
        <iframe
          src="https://www.youtube.com/embed/videoseries?si=xG9_sOEP8OMLdwZM&amp;list=PLJNeO1p-8YtXaSgm56BCwSDuFHtEumilJ"
          title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>

      <!-- PLAYLIST 4 -->
      <div class="playlist-item">
        <iframe
          src="https://www.youtube.com/embed/videoseries?si=s7BC8rZIuKTu5elb&amp;list=PLJNeO1p-8YtU5zOHH3tSAP7VKmDzsbTH8"
          title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      </div>

      <!-- PLAYLIST 5 -->
      <div class="playlist-item">
        <div class="coming-soon">COMING SOON...</div>
      </div>

      <!-- PLAYLIST 6 -->
      <div class="playlist-item">
        <div class="coming-soon">COMING SOON...</div>
      </div>

      <!-- PLAYLIST 7 -->
      <div class="playlist-item">
        <div class="coming-soon">COMING SOON...</div>
      </div>
    </div>
  </div>
</body>
</html>
