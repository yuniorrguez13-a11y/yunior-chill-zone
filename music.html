<!DOCTYPE html>
<html lang="en">
<head>
  <script>
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    window.location.href = 'https://yuniorschillzone.xyz/nosaving.html';
  }
});
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Room — Yuniors Chill Zone</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --crimson: #e8162a;
      --crimson-glow: rgba(232, 22, 42, 0.35);
      --bg-deep: #06060a;
      --text-muted: #7a7a8e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--crimson); }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-deep);
      color: #f0f0f5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      background-image: url("https://raw.githubusercontent.com/yuniorrguez13-a11y/videox/refs/heads/main/stranger_things_3-wallpaper-3840x2160.jpg");
      background-size: cover;
      background-position: center;
      filter: brightness(0.2) saturate(0.5);
      z-index: 0;
    }

    .bg-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -45deg, transparent, transparent 24px,
        rgba(232, 22, 42, 0.04) 24px, rgba(232, 22, 42, 0.04) 48px
      );
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      background: linear-gradient(160deg, rgba(6,4,8,0.55) 0%, rgba(10,4,6,0.35) 100%);
      padding: 44px 20px 80px;
    }

    header {
      width: min(1340px, 92%);
      margin: 0 auto 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(232, 22, 42, 0.22);
    }

    .header-left h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(28px, 5vw, 50px);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff 40%, #ff6070);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-left .tag {
      display: inline-block;
      margin-top: 10px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--crimson);
      border: 1px solid rgba(232, 22, 42, 0.5);
      padding: 3px 10px;
      border-radius: 2px;
    }

    .home-link {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #b0b0c8;
      text-decoration: none;
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 3px;
      background: rgba(255,255,255,0.04);
      transition: all 0.2s;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }

    .home-link:hover {
      background: rgba(255,255,255,0.1);
      color: white;
      border-color: rgba(255,255,255,0.35);
    }

    .section-label {
      width: min(1340px, 92%);
      margin: 0 auto 18px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(232,22,42,0.3), transparent);
    }

    .playlist-grid {
      width: min(1340px, 92%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 18px;
    }

    .playlist-item {
      background: rgba(10, 8, 14, 0.82);
      border: 1px solid rgba(255,255,255,0.06);
      border-top: 2px solid var(--crimson);
      border-radius: 2px 12px 12px 12px;
      padding: 14px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .playlist-item::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50px;
      background: linear-gradient(180deg, rgba(232,22,42,0.05), transparent);
      pointer-events: none;
    }

    .playlist-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 42px rgba(0,0,0,0.6), 0 0 28px rgba(232,22,42,0.1);
    }

    .playlist-num {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      font-weight: 700;
      color: var(--crimson);
      letter-spacing: 2px;
      margin-bottom: 10px;
      opacity: 0.75;
    }

    iframe {
      width: 100%;
      height: 215px;
      border-radius: 6px;
      border: none;
      display: block;
    }

    .coming-soon-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 215px;
      gap: 12px;
    }

    .cs-line { width: 36px; height: 2px; background: var(--crimson); opacity: 0.35; }
    .cs-icon { font-size: 34px; opacity: 0.3; }
    .cs-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="page">
    <header>

        <div class="coming-soon-card">
          <div class="cs-line"></div>
          <div class="cs-icon">🎵</div>
          <div class="cs-text">Coming Soon</div>

        </div>
      </div>
      <div class="playlist-item">
        <div class="playlist-num">// 07</div>
        <div class="coming-soon-card">
          <div class="cs-line"></div>
          <div class="cs-icon">🎵</div>
          <div class="cs-text">Coming Soon</div>

    </div>
  </div>
</body>
</html>
