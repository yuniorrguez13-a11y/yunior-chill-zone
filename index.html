<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuniors Chill Zone Chat</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
  <canvas id="matrix"></canvas>

  <!-- CHAT CONTROLS -->
  <div class="chat-controls">
    <label class="toggle">
      <input type="checkbox" id="safe-mode-toggle">
      <span>Safe mode (messages with profanity will not be shown)</span>
    </label>
  </div>

  <div id="chat-container">
    <div class="chat-header">
      <div>
        <h1>Yuniors Chill Zone</h1>
        <p class="subtitle">Hang out, drop a message, and jump into the vibes.</p>
      </div>
      <div class="nav-links">
        <a href="music.html" target="_blank" class="nav-link">Music Room</a>
        <a href="gaming.html" target="_blank" class="nav-link">Gaming Zone</a>
        <a href="https://zoom.us/j/4498564941" target="_blank" class="nav-link">Zoom Voice Chat</a>
      </div>
    </div>

    <!-- AUTH BOX -->
    <div id="auth-box" style="margin: 10px 0;">
      <input type="email" id="email-input" placeholder="Email">
      <input type="password" id="password-input" placeholder="Password">
      <button id="signup-btn">Sign up</button>
      <button id="login-btn">Login</button>
      <button id="logout-btn" style="display:none;">Logout</button>
    </div>

    <!-- USER PROFILE -->
    <div class="profile-fields">
      <input type="text" id="username-input" placeholder="Username">
      <input type="text" id="pfp-input" placeholder="PFP URL (optional)">
    </div>

    <div id="chat-box"></div>

    <div class="message-actions">
      <input type="text" id="msg-input" placeholder="Login to chat" disabled>
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>

  <script src="matrix.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="chat.js"></script>
</body>
</html>
