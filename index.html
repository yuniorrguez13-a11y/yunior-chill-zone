<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yunior Studios</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: #ecf0f1;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
        }

        .message {
            background: rgba(0, 0, 0, 0.6);
            padding: 50px;
            border-radius: 15px;
            text-align: center;
            max-width: 600px;
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-size: 3em;
            color: #e74c3c;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #ecf0f1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="message">
        <h1>Yunior Studios</h1>
        <p>It breaks our hearts to say goodbye, but we have decided to take the website down. It hasn't been the same, and with so few visitors, continuing just feels empty. We will always cherish the memories we made here, and this goodbye is as heavy as it is final.</p>
    </div>
</body>
</html>
