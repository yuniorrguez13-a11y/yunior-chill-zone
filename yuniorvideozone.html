<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YuniorVideoZone</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f0f;
      --surface: #181818;
      --surface-2: #272727;
      --text: #f2f2f2;
      --muted: #a9a9a9;
      --line: #303030;
      --chip: #2b2b2b;
      --brand: #ff2d2d;
      --accent: #3ea6ff;
      font-family: Arial, Helvetica, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr minmax(280px, 620px) 1fr;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(15, 15, 15, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(5px);
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--brand); }
    .brand-title { margin: 0; font-size: 1.05rem; letter-spacing: 0.02em; }

    .search-wrap {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      background: #121212;
      height: 40px;
    }

    .search-wrap input {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      outline: none;
    }

    .search-wrap button {
      width: 54px;
      border: 0;
      background: #222;
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, select, input {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      padding: 8px 10px;
      font: inherit;
    }

    button {
      cursor: pointer;
      border-color: transparent;
      background: var(--brand);
      font-weight: 700;
    }

    .secondary { background: #303030; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .shell {
      display: grid;
      grid-template-columns: 76px minmax(280px, 360px) minmax(0, 1fr);
      min-height: calc(100vh - 61px);
    }

    .rail {
      border-right: 1px solid var(--line);
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #101010;
    }

    .rail button {
      width: 100%;
      padding: 8px 6px;
      border-radius: 12px;
      font-size: 0.72rem;
      line-height: 1.25;
      background: transparent;
      color: var(--text);
      border: 1px solid transparent;
    }

    .rail button.active {
      border-color: var(--line);
      background: #1f1f1f;
    }

    .panel {
      border-right: 1px solid var(--line);
      padding: 14px;
      overflow: auto;
    }

    .card-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .card-panel h2 {
      margin: 0 0 10px;
      font-size: 0.96rem;
    }

    .field { margin-bottom: 9px; }
    .field label { display: block; color: var(--muted); font-size: 0.8rem; margin-bottom: 5px; }
    .field input, .field select { width: 100%; }
    .status { min-height: 1.2rem; color: var(--muted); font-size: 0.82rem; margin-top: 8px; }

    .content {
      padding: 14px;
      overflow: auto;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip {
      border: 1px solid var(--line);
      background: var(--chip);
      border-radius: 999px;
      color: var(--text);
      font-size: 0.82rem;
      padding: 7px 12px;
      cursor: pointer;
    }

    .chip.active { background: #fff; color: #000; border-color: #fff; }

    .channel-header {
      display: none;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #3b3b3b;
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .channel-header h3 { margin: 0; font-size: 1rem; }
    .channel-header p { margin: 2px 0 0; color: var(--muted); font-size: 0.82rem; }

    .feed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }

    .doomscroll-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 250px));
      justify-content: center;
      gap: 14px;
    }

    .video-card {
      border-radius: 12px;
      overflow: hidden;
      background: #131313;
      border: 1px solid var(--line);
    }

    .video-card video {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #000;
      display: block;
    }

    .video-card.doomscroll video {
      aspect-ratio: 9 / 16;
      max-height: 460px;
      object-fit: contain;
    }

    .meta { padding: 10px; }
    .title { margin: 0; font-size: 0.92rem; line-height: 1.35; overflow-wrap: anywhere; }
    .channel-link { margin-top: 6px; display: inline-block; color: var(--accent); font-size: 0.8rem; text-decoration: none; }
    .channel-link:hover { text-decoration: underline; }

    .empty { color: var(--muted); padding: 8px 0; }

    @media (max-width: 1180px) {
      .shell { grid-template-columns: 76px 1fr; }
      .panel { display: none; }
    }

    @media (max-width: 720px) {
      .topbar { grid-template-columns: 1fr; }
      .top-actions { justify-content: flex-start; }
      .shell { grid-template-columns: 1fr; }
      .rail { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1 class="brand-title">YuniorVideoZone</h1>
    </div>

    <form id="search-form" class="search-wrap">
      <input id="search-input" type="search" placeholder="Search videos">
      <button type="submit" aria-label="Search">⌕</button>
    </form>

    <div class="top-actions">
      <span id="auth-indicator">Not logged in</span>
      <button id="logout-btn" class="secondary" type="button" style="display:none;">Logout</button>
      <a href="index.html"><button class="secondary" type="button">Back</button></a>
    </div>
  </header>

  <main class="shell">
    <aside class="rail">
      <button class="rail-btn active" data-feed="feed" type="button">Feed</button>
      <button class="rail-btn" data-feed="videos" type="button">Videos</button>
      <button class="rail-btn" data-feed="doomscroll" type="button">Doomscroll</button>
    </aside>

    <aside class="panel">
      <section class="card-panel">
        <h2>Account verification</h2>
        <div class="field">
          <label for="email-input">Email</label>
          <input id="email-input" type="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="password-input">Password</label>
          <input id="password-input" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="signup-btn" type="button">Create account</button>
          <button id="login-btn" class="secondary" type="button">Sign in</button>
        </div>
        <p id="auth-status" class="status"></p>
      </section>

      <section class="card-panel">
        <h2>Upload video</h2>
        <div class="field">
          <label for="upload-type">Category</label>
          <select id="upload-type">
            <option value="videos">Video</option>
            <option value="doomscroll">Doomscroll</option>
          </select>
        </div>
        <div class="field">
          <label for="upload-file">File</label>
          <input id="upload-file" type="file" accept="video/*">
        </div>
        <button id="upload-btn" type="button" disabled>Upload</button>
        <p id="upload-status" class="status">Sign in with a verified account to upload.</p>
      </section>
    </aside>

    <section class="content">
      <div class="chip-row">
        <button class="chip active tab-btn" data-feed="feed" type="button">Feed</button>
        <button class="chip tab-btn" data-feed="videos" type="button">Videos</button>
        <button class="chip tab-btn" data-feed="doomscroll" type="button">Doomscroll</button>
        <button id="refresh-btn" class="chip" type="button">Refresh</button>
      </div>

      <section id="channel-header" class="channel-header">
        <div class="avatar" id="channel-avatar"></div>
        <div>
          <h3 id="channel-title"></h3>
          <p id="channel-subtitle"></p>
        </div>
        <button id="clear-channel-btn" class="secondary" type="button" style="margin-left:auto;">Show all</button>
      </section>

      <div id="feed" class="feed-grid"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="yuniorvideozone.js"></script>
</body>
</html>
