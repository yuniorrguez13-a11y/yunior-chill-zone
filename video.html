<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Yunior Video Zone</title>
<link rel="stylesheet" href="video.css">
</head>
<body>

<header>
  <h1>Yunior Video Zone</h1>
  <div id="auth-section">
    <input id="email-input" type="email" placeholder="Email">
    <input id="password-input" type="password" placeholder="Password">
    <button id="signup-btn">Sign Up</button>
    <button id="login-btn">Login</button>
    <span id="user-label"></span>
    <button id="logout-btn" style="display:none;">Logout</button>
  </div>
</header>

<nav>
  <button class="nav-item active" data-view="home">Home</button>
  <button class="nav-item" data-view="feed">Feed</button>
  <button class="nav-item" data-view="history">History</button>
  <button class="nav-item" data-view="channels">Channels</button>
  <button class="nav-item" data-view="upload">Upload</button>
</nav>

<section id="upload-section">
  <h2>Upload Video</h2>
  <input id="title" type="text" placeholder="Video Title">
  <input id="description" type="text" placeholder="Description">
  <select id="type">
    <option value="normal">Normal</option>
    <option value="doomscroller">Doomscroll</option>
  </select>
  <input id="file" type="file" accept="video/*">
  <button id="upload-btn" disabled>Upload</button>
</section>

<section id="video-feed">
  <h2 id="feed-title">Home</h2>
  <h4 id="feed-subtitle">Newest videos</h4>
  <div id="video-grid"></div>
  <div id="loading-sentinel">Loading...</div>
</section>

<aside>
  <h3>Channels</h3>
  <div id="channels-list"></div>
  <h3>Recently Watched</h3>
  <div id="mini-history"></div>
</aside>

<!-- Modal Player -->
<div id="video-modal" aria-hidden="true">
  <div id="video-modal-backdrop"></div>
  <div id="video-modal-content">
    <button id="close-modal">Close</button>
    <video id="player" controls></video>
    <h3 id="player-title"></h3>
    <p id="player-uploader"></p>
    <p id="player-views"></p>
    <button id="subscribe-btn">Subscribe</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="video.js"></script>
</body>
</html>
