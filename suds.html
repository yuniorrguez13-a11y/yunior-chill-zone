];
function unlockedCount(){ return ACHIEVEMENTS.filter(a => META.achv && META.achv[a.id]).length; }
function checkAchievements(){
  const s = META.stats || {};
  const view = {
    kills: s.kills||0, bestWave: ST.best.wave||0, bosses: s.bosses||0,
    bossKinds: Object.keys(s.bossKinds||{}).length, bestCombo: s.bestCombo||0,
    shardsEver: s.shardsEver||0, roomsThisRun: Object.keys(ST.roomsSeen||{}).length,
    cleanWaves: s.cleanWaves||0, noodleKills: s.noodleKills||0, petShards: s.petShards||0,
  };
  META.achv = META.achv || {};
  for (const a of ACHIEVEMENTS){
    if (META.achv[a.id]) continue;

      META.achv[a.id] = 1;

// ---- 11. TOASTS. Small corner notifications that stack and slide off. ----
let toasts = [];
function pushToast(text, color){ toasts.push({ text, color: color || '#dfe3ea', t: 3.2 }); }
function updateToasts(dt){
  for (let i = toasts.length-1; i >= 0; i--) if ((toasts[i].t -= dt) <= 0) toasts.splice(i,1);
}
function renderToasts(){
  let y = 60;
  for (const t of toasts){
    const a = Math.min(1, t.t / 0.5);
    cx.globalAlpha = a;
    const w = textWidth(t.text, 1) + 12;

let props = [];
function seedProps(map){
  props = [];
  for (const w of map.walls){
    if (w.k !== 'crate') continue;
    props.push({ x: w.x + w.w/2, y: w.y + w.h/2, r: Math.max(w.w, w.h)/2, hp: 26, flash: 0, dead: false });
  }
}
function hitProps(x, y, dmg){
  for (const p of props){
    if (p.dead) continue;
    if (dist2(x, y, p.x, p.y) > p.r*p.r) continue;
    p.hp -= dmg; p.flash = 0.1;
    if (p.hp <= 0){
      p.dead = true;
      spawnParts(p.x, p.y, 16, '#8a6a3c', 80);
      SFX.boom();
      for (let k = 0; k < irand(2,4); k++) dropPickup(p.x + rand(-8,8), p.y + rand(-8,8), 'shard');
      if (Math.random() < 0.25) dropPickup(p.x, p.y, 'heart');
    }
    return true;
  }
  return false;
}
function renderProps(){
  for (const p of props){
    if (!p.dead) continue;
    // the wreckage stays, so you can see what you have already opened
    cx.globalAlpha = 0.5;
    cx.fillStyle = '#3a2a16';
    cx.fillRect(Math.round(p.x - p.r), Math.round(p.y + p.r - 5), Math.round(p.r*2), 5);
    cx.globalAlpha = 1;
  }
}

function chapterDone(i){ return (META.story || 0) > i; }
function chaptersOpen(){ return Math.min(CHAPTERS.length, (META.story || 0) + 1); }

// ---- running a chapter -------------------------------------------
function startChapter(i){
  const c = CHAPTERS[i];
  if (!c) return;
  ST.chapter = i;
  ST.storyBeat = 'before';
  ST.beatLine = 0;
  ST.mode = 'beat';
  SFX.click();
}

// the fight itself, once the talking is done
function beginChapterFight(){
  const c = CHAPTERS[ST.chapter];
  startRun();
  ST.story = true;
  ST.bossBeaten = false;
  ST.wave = 0;
  ST.kills = 0;
  ST.objDone = 0;
  ST.objTimer = 0;
  ST.waveState = 'clear'; ST.waveTimer = 1.2;
  gotoMap(c.map, false);
  // a story chapter always starts you on the gun the chapter says, if any
  if (c.gun){
    player.ladder = [GUNS.find(g => g.id === c.gun) || GUNS[0]];
    player.gunIdx = GUNS.indexOf(player.ladder[0]);
    player.gunName = GUNS[player.gunIdx].name;
  }
  // objectives that need something in the room get it here
  ST.marker = null; ST.trolley = null;
  if (c.obj === 'reach' || c.obj === 'hold'){
    const far = farSpot();
    ST.marker = { x: far.x, y: far.y, on: false };
  }
  if (c.obj === 'escort'){
    ST.trolley = { x: player.x + 30, y: player.y + 20, hp: 12, maxhp: 12, flash: 0 };
  }
  if (c.obj === 'boss'){
    ST.bossType = c.boss;
    ST.waveState = 'bosswarn'; ST.waveTimer = 2.4;
    ST.banner = 'WARNING! ' + BOSS_NAME[c.boss] + ' APPROACHES'; ST.bannerTimer = 2.4;
    SFX.alarm();
  }
  ST.banner = ST.banner || ('CHAPTER ' + c.id + ' - ' + c.title);
  ST.bannerTimer = ST.bannerTimer || 2.2;
}

// somewhere on the far side of the room from the player, on actual floor
function farSpot(){
  let best = { x: SPAWN.x, y: SPAWN.y }, bd = -1;
  for (let k = 0; k < 400; k++){
    const x = rand(40, WORLD.w-40), y = rand(40, WORLD.h-40);
    if (!clearSpot(x, y, 20)) continue;
    const d = dist2(x, y, player.x, player.y);
    if (d > bd){ bd = d; best = { x, y }; }
  }
  return best;
}

function objectiveText(){
  const c = CHAPTERS[ST.chapter];
  if (!c) return '';
  const o = OBJ[c.obj];
  let t = o.label(c);
  if (c.obj === 'survive') t += '   ' + Math.min(ST.wave, c.n) + '/' + c.n;
  if (c.obj === 'kill')    t += '   ' + Math.min(ST.kills, c.n) + '/' + c.n;
  if (c.obj === 'hold')    t += '   ' + Math.ceil(Math.max(0, c.n - ST.objTimer)) + 'S';
  if (c.obj === 'escort')  t += '   ' + Math.ceil(Math.max(0, c.n - ST.objTimer)) + 'S';
  if (c.obj === 'clear')   t += '   ' + enemies.length + ' LEFT';
  return t;
}

function updateStory(dt){
  const c = CHAPTERS[ST.chapter];
  if (!c || ST.objDone) return;
  let done = false;

  if (c.obj === 'survive') done = ST.wave > c.n;
  else if (c.obj === 'kill') done = ST.kills >= c.n;
  else if (c.obj === 'boss') done = ST.bossBeaten;
  else if (c.obj === 'clear') done = ST.wave >= 1 && enemies.length === 0 && !ST.toSpawn.length;
  else if (c.obj === 'reach'){
    const RP = ST.marker ? nearestPlayer(ST.marker.x, ST.marker.y) : player;
    if (ST.marker && dist2(RP.x, RP.y, ST.marker.x, ST.marker.y) < 20*20) done = true;
  }
  else if (c.obj === 'hold'){
    const HP2 = ST.marker ? nearestPlayer(ST.marker.x, ST.marker.y) : player;
    const on = ST.marker && dist2(HP2.x, HP2.y, ST.marker.x, ST.marker.y) < 34*34;
    if (ST.marker) ST.marker.on = on;
    if (on) ST.objTimer += dt;
    done = ST.objTimer >= c.n;
  }
  else if (c.obj === 'escort'){
    const t = ST.trolley;
    if (t){
      t.flash = Math.max(0, t.flash - dt);
      // it follows him at a walking pace, and the dishwashers go for it
      const dx = player.x - t.x, dy = player.y - t.y, d = Math.hypot(dx,dy) || 1;
      if (d > 34) moveCircle(t, (dx/d)*46*dt, (dy/d)*46*dt, 8);
      for (const e of enemies){
        if (dist2(e.x, e.y, t.x, t.y) < (e.r+10)*(e.r+10)){
          if (t.flash <= 0){
            t.hp--; t.flash = 0.8;
            spawnParts(t.x, t.y, 8, '#c9a06a', 60);
            SFX.hurt();
            if (t.hp <= 0){ ST.objFailed = true; }
          }
        }
      }
      ST.objTimer += dt;
      done = ST.objTimer >= c.n;
    }
  }

  if (ST.objFailed){
    ST.objFailed = false;
    ST.banner = 'THE TROLLEY IS GONE'; ST.bannerTimer = 2;
    endRun();
    return;
  }
  if (done){
    ST.objDone = 1;
    ST.banner = 'OBJECTIVE COMPLETE'; ST.bannerTimer = 1.8;
    SFX.levelup();
    // bank the chapter and go to the outro after a beat
    if ((META.story || 0) <= ST.chapter){ META.story = ST.chapter + 1; saveMeta(); }
    ST.beatDelay = 1.8;
  }
  if (ST.beatDelay > 0){
    ST.beatDelay -= dt;
    if (ST.beatDelay <= 0){
      ST.storyBeat = 'after';
      ST.beatLine = 0;
      ST.mode = 'beat';
    }
  }
}

// ---- the talking screens -----------------------------------------
function beatLines(){
  const c = CHAPTERS[ST.chapter];
  if (!c) return [];
  return ST.storyBeat === 'before' ? c.before : c.after;
}
function beatAdvance(){
  const lines = beatLines();
  if (ST.beatLine < lines.length - 1){ ST.beatLine++; SFX.click(); return; }
  SFX.click();
  if (ST.storyBeat === 'before'){ beginChapterFight(); return; }
  // finished the chapter
  const next = ST.chapter + 1;
  ST.story = false;
  if (next < CHAPTERS.length){ ST.chapter = next; ST.mode = 'chapters'; ST.chapSel = next; }
  else { ST.mode = 'ending'; ST.endT0 = ST.time; }
}

// The ending is a little scene, staged on a clock: night, then the dawn
// creeps up, he floats down and finally lands, and the lines arrive one
// at a time. The gun never lands. That is the joke and the ending.
function renderEnding(){
  cx.fillStyle = '#06060a'; cx.fillRect(0,0,W,H);
  const t = ST.time - (ST.endT0 || 0);
  // dawn, up from the bottom of the screen
  const dawn = clamp((t - 2) / 8, 0, 1);
  const g = cx.createLinearGradient(0, H*0.30, 0, H);
  g.addColorStop(0, 'rgba(6,6,10,0)');
  g.addColorStop(1, 'rgba(244,150,66,' + (0.26*dawn).toFixed(3) + ')');
  cx.fillStyle = g; cx.fillRect(0,0,W,H);
  // a floor line to land on
  cx.fillStyle = 'rgba(223,227,234,0.10)'; cx.fillRect(0, 168, W, 1);
  // he comes down slowly, and for once he stands on the ground
  const drop = clamp(t / 4, 0, 1);
  const hy = 96 + drop*56 + (1 - drop) * Math.sin(t*3) * 2;
  drawHeroStatic(drop >= 1 ? 'idle0' : 'float1', W/2 - 26, hy, 1,
                 drop >= 1 ? 0 : Math.sin(t*3)*2);
  // the gun does not come down. It bobs there, refusing.
  const gunSp = SP[GUNS[0].sp];
  cx.drawImage(gunSp, Math.round(W/2 + 6), Math.round(98 + Math.sin(t*2.2)*3));
  if (t > 5) drawText('THE SHIFT IS OVER', W/2, 34, 3, '#f4c542', 'center');
  const lines = [
    'HE FINISHED THE NIGHT.',
    'NOBODY WILL BELIEVE HIM AND HE IS NOT GOING TO TRY.',
    'THE ROTA ON THE WALL STILL SAYS NEW GUY.',
    'HE HAS DECIDED HE IS FINE WITH THAT.',
  ];
  let y = 186;
  for (let i=0;i<lines.length;i++){
    const a = clamp((t - 6 - i*1.6) / 0.8, 0, 1);
    if (a > 0){
      cx.globalAlpha = a;
      drawText(lines[i], W/2, y, 1, '#dfe3ea', 'center');
      cx.globalAlpha = 1;
    }
    y += 12;
  }
  if (t > 13){
    drawText('SUDS OF DOOM', W/2, 244, 2, CRIMSON, 'center');
    if (Math.floor(t*2) % 2 === 0)
      drawText('ESC TO GO BACK', W/2, 260, 1, '#7a7a8e', 'center');
  }
}

// the marker and the trolley are objective props, drawn in the world
function renderObjectiveProps(){
  if (ST.marker){
    const m = ST.marker, p = (ST.time*1.4) % 1;
    cx.globalAlpha = (1-p) * 0.8;
    cx.strokeStyle = m.on ? '#6ad07a' : '#f4c542'; cx.lineWidth = 2;

    cx.globalAlpha = 0.9;
    cx.strokeStyle = m.on ? '#6ad07a' : '#f4c542'; cx.lineWidth = 1;
    cx.beginPath(); cx.arc(m.x, m.y, 9, 0, TAU); cx.stroke();
    cx.globalAlpha = 1;

    const t = ST.trolley;
    cx.fillStyle = t.flash > 0 ? '#ffffff' : '#8a6a3c';

      cx.fillRect(Math.round(t.x-9+i*1.6), Math.round(t.y-12), 1, 3);

  }
}

// ================================================================
// THE STORE
// Everything you own is bought here with plate shards. Three tabs,
// one list, and the same three verbs everywhere: BUY when you can
// afford it, EQUIP when you own it, and the cost when you cannot.
// ================================================================
const TABS = ['GUNS', 'BOOSTS', 'START', 'EXTRAS'];
const STORE_Y = 56, STORE_ROW = 22, STORE_ROWS = 8;

// One uniform row shape for all three tabs, so the drawing and the
// clicking never have to know which tab they are looking at.
function storeItems(){
  const out = [];
  if (ST.storeTab === 0){
    for (const g of GUNS){
      const own = !!META.owned[g.id];
      // a fusion stays locked until you own both of its parents
      if (g.fuse && !own && !(META.owned[g.fuse[0]] && META.owned[g.fuse[1]])){
        const pa = GUNS.find(x => x.id === g.fuse[0]), pb = GUNS.find(x => x.id === g.fuse[1]);
        out.push({
          name: g.name,
          desc: 'FUSION - NEEDS ' + pa.name.split(' ')[0] + ' + ' + pb.name.split(' ')[0],
          cost: -2, owned: false, on: false, act(){ return false; },
        });
        continue;
      }
      out.push({
        name: g.name, desc: g.blurb, cost: g.cost, owned: own,
        on: META.startGun === g.id,
        act(){
          if (own){ META.startGun = g.id; SFX.click(); return true; }
          if (META.shards < g.cost) return false;
          META.shards -= g.cost; META.owned[g.id] = true; META.startGun = g.id;
          SFX.evolve(); return true;
        },
      });
    }
  } else if (ST.storeTab === 1){
    for (const b of BOOSTS){
      const lv = boostLv(b.id), maxed = lv >= b.max;
      const cost = b.cost(lv);
      out.push({
        name: b.name + '  ' + lv + '/' + b.max,
        desc: b.desc, cost: maxed ? -1 : cost, owned: maxed, on: false,
        act(){
          if (maxed || META.shards < cost) return false;
          META.shards -= cost; META.boosts[b.id] = lv + 1;
          SFX.levelup(); return true;
        },
      });
    }
  } else if (ST.storeTab === 3){
    for (const petDef of PETS){
      const own = !!META.pets[petDef.id];
      out.push({
        name: petDef.name, desc: petDef.blurb, cost: petDef.cost, owned: own,
        on: META.pet === petDef.id,
        act(){
          if (own){
            // clicking again sends him home / calls him back in
            META.pet = META.pet === petDef.id ? '' : petDef.id;
            SFX.click(); return true;
          }
          if (META.shards < petDef.cost) return false;
          META.shards -= petDef.cost; META.pets[petDef.id] = true; META.pet = petDef.id;
          SFX.evolve(); return true;
        },
      });
    }
  } else {
    for (const w of WAVE_TIERS){
      const bought = !!META.waves[w];
      const cost = waveCost(w);
      // you can only buy your way into a wave you have actually survived to
      const reachable = w <= Math.max(1, ST.best.wave);
      out.push({
        name: 'START AT WAVE ' + w,
        desc: bought ? (w > 1 ? 'BEGIN WITH ' + (w-1) + ' UPGRADES' : 'THE HONEST WAY')
                     : (reachable ? 'BEGIN WITH ' + (w-1) + ' UPGRADES' : 'REACH WAVE ' + w + ' FIRST'),
        cost: bought ? -1 : (reachable ? cost : -2), owned: bought,
        on: META.startWave === w,
        act(){
          if (bought){ META.startWave = w; SFX.click(); return true; }
          if (!reachable || META.shards < cost) return false;
          META.shards -= cost; META.waves[w] = true; META.startWave = w;
          SFX.levelup(); return true;
        },
      });
    }
  }
  return out;
}

function storeTabHit(x, y){
  if (y < 26 || y > 40) return -1;
  for (let i=0;i<TABS.length;i++){
    const tx = 34 + i*108;
    if (x >= tx-8 && x <= tx+90) return i;
  }
  return -1;
}
function storeRowHit(x, y){
  if (x < 22 || x > W-22) return -1;
  const i = Math.floor((y - STORE_Y) / STORE_ROW);
  const n = storeItems().length;
  if (i < 0 || i >= Math.min(n, STORE_ROWS)) return -1;
  return i + (ST.storeTop || 0);
}
function storeBuy(i){
  const items = storeItems();
  const it = items[i];
  if (!it) return;
  if (!it.act()){ SFX.hurt(); return; }
  saveMeta();
}
function openStore(){
  ST.mode = 'store'; ST.storeTab = ST.storeTab || 0;
  ST.storeSel = 0; ST.storeTop = 0;
  document.body.classList.remove('playing');
  SFX.click();
}

// ================================================================
// MAIN LOOP — fixed 60hz update, render per frame
// ================================================================
let last = performance.now(), acc = 0;
const STEP = 1/60;

function frame(now){
  requestAnimationFrame(frame);
  pollPad();
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  while (acc >= STEP){
    tick(STEP);
    acc -= STEP;
  }
  MUSIC.tick();
  render();
}

function tick(dt){
  ST.time += dt;
  ST.shake = Math.max(0, ST.shake - dt*14);
  ST.flashRed = Math.max(0, ST.flashRed - dt);
  ST.bannerTimer = Math.max(0, ST.bannerTimer - dt);
  ST.zoneTimer = Math.max(0, ST.zoneTimer - dt);
  if (ST.mode !== 'play') return;
  // hitstop: a couple of frames of nothing at all, which is what sells a kill
  if (ST.stop > 0){ ST.stop -= dt; return; }
  ST.playTime += dt;
  if (ST.tut) updateTutorial(dt);
  else if (ST.story){ if (!ST.objDone) updateWaves(dt); updateStory(dt); }
  else updateWaves(dt);
  updateWhistle(dt);
  // cleared once per tick, not per player — both beams get to paint
  beamFx = null;
  updatePlayer(player, dt);
  if (player2){
    // the ladder is shared: player two always carries what player one does
    player2.gunIdx = player.gunIdx; player2.gunName = player.gunName;
    updatePlayer(player2, dt);
  }
  updatePet(dt);
  updateOrbs(dt);
  updateEnemies(dt);
  updatePBullets(dt);
  updateEBullets(dt);
  collidePlayerBullets();
  updateBlasts(dt);
  updateSlicks(dt);
  updateDash(player, dt);
  if (player2) updateDash(player2, dt);
  updateGhosts(dt);
  updateCombo(dt);
  updateHitMarks(dt);
  updateVents(dt);
  updateStation(dt);
  updateMut(dt);
  updateToasts(dt);
  ST.achvT = (ST.achvT || 0) + dt;
  if (ST.achvT > 1){ ST.achvT = 0; checkAchievements(); }
  if (arcFx && (arcFx.t -= dt) <= 0) arcFx = null;
  updatePickups(dt);
  updateParts(dt);
  updateFloaters(dt);
  updateCam(dt);
  // announce the room when you cross into a new one
  const z = zoneAt(player.x, player.y);
  if (z.name !== ST.zone){ ST.zone = z.name; ST.zoneTimer = 2.4; }
}

// ================================================================
// DEBUG / TEST HOOKS (used by automated tests, harmless in prod)
// ================================================================
window.SUDS = {
  get state(){ return ST.mode; },
  get stats(){ return { wave: ST.wave, kills: ST.kills, hp: player.hp, level: player.level,
    enemies: enemies.length, ebullets: ebullets.length, pbullets: pbullets.length, time: ST.playTime }; },
  start(){ if (ST.mode !== 'play') startRun(); },
  forceWave(n){ enemies = []; ebullets = []; boss = null; ST.toSpawn = []; ST.waveState = 'clear'; ST.waveTimer = 0.01; ST.wave = n-1; },
  grantXP(n){ gainXP(n); },
  hurt(n){ player.iframe = 0; hurtPlayer(player, n||1); },
  spawn(type, x, y){
    if (x === undefined){ const p = spawnEdgePos(); x = p.x; y = p.y; }
    return spawnEnemy(type, x, y);
  },
  get pos(){ return { x: Math.round(player.x), y: Math.round(player.y),
                      zone: zoneAt(player.x, player.y).name }; },
  warp(x, y){ player.x = clamp(x, 16, WORLD.w-16); player.y = clamp(y, 16, WORLD.h-16); updateCam(0, true); },
  choose(i){ chooseCard(i); },
  gun(i){ player.gunIdx = clamp(i|0, 0, GUNS.length-1); player.gunName = GUNS[player.gunIdx].name; return player.gunName; },
  god(on){ player.iframe = on ? 1e9 : 0; },
  get beam(){ return beamFx; },
  get p2(){ return player2; },
  get p1(){ return player; },
};

loadMeta();
seedProps(MAPS[MAPI]);
ST.shakeOn = (META.shake === undefined) ? true : !!META.shake;
ST.dmgNums = (META.dmgNums === undefined) ? true : !!META.dmgNums;
resize();
requestAnimationFrame(frame);
</script>

<!-- ==================================================================
     CHEAT MENU — development only.
     Self-contained: delete this entire <script> block and the menu is
     gone. Nothing above refers to it.
     There is no button and no key for this. The only way in is to open
     the browser console and run:  sudsCheats()
     ================================================================== -->
<script>
(function cheatMenu(){
  const css = document.createElement('style');
  css.textContent = `
    #sc-box {
      font:11px/1.4 ui-monospace, Menlo, monospace !important; z-index:99999 !important;
      position:fixed !important; right:10px !important; top:10px !important;
      width:214px !important; max-height:calc(100vh - 64px) !important;
      overflow:auto !important; touch-action:auto !important;
      padding:8px !important; display:none !important;
      color:#c9ced9 !important; background:rgba(8,8,12,.94) !important;
      border:1px solid rgba(232,22,42,.4) !important; border-radius:6px !important;
    }
    #sc-box.open { display:block !important; }
    #sc-box h4 {
      margin:8px 0 4px !important; font:11px/1.4 ui-monospace, monospace !important;
      color:#e8162a !important; letter-spacing:1px !important; font-weight:400 !important;
    }
    #sc-box h4:first-child { margin-top:0 !important; }
    #sc-box .g { display:flex !important; flex-wrap:wrap !important; gap:3px !important; }
    #sc-box button {
      flex:1 1 auto !important; padding:4px 5px !important; cursor:pointer !important;
      font:11px/1.2 ui-monospace, monospace !important; white-space:nowrap !important;
      color:#c9ced9 !important; background:#1b1b26 !important;
      border:1px solid #33333f !important; border-radius:3px !important;
    }
    #sc-box button:hover { background:#26263a !important; color:#fff !important; }
    #sc-box button.on { background:#f4c542 !important; color:#14141c !important; border-color:#f4c542 !important; }
    #sc-box pre {
      margin:8px 0 0 !important; padding:5px !important;
      color:#79c7f0 !important; background:#101018 !important; border-radius:3px !important;
      font:10px/1.4 ui-monospace, monospace !important; white-space:pre !important;
    }
  `;
  document.head.appendChild(css);

  const box = document.createElement('div');
  box.id = 'sc-box';
  const readout = document.createElement('pre');
  document.body.appendChild(box);

  // the gun stat block only exists once a run has started
  const ensure = () => { if (!player.gun) player.gun = Object.assign({}, T.gun); };

  function section(title){
    const h = document.createElement('h4'); h.textContent = title;
    const g = document.createElement('div'); g.className = 'g';
    box.appendChild(h); box.appendChild(g);
    return g;
  }
  function btn(row, label, fn){
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = () => { ensure(); fn(); b.blur(); paint(); };
    row.appendChild(b);
    return b;
  }
  function jump(n){
    enemies.length = 0; ebullets.length = 0; boss = null;
    ST.toSpawn = []; ST.waveState = 'clear'; ST.waveTimer = 0.01; ST.wave = n - 1;
  }

  const gunRow = section('GUN');
  const gunBtns = GUNS.map((g, i) => btn(gunRow, g.name.split(' ')[0], () => {
    // testing a gun implies owning it, or the ladder would snap back
    META.owned[g.id] = true;
    player.ladder = gunLadder();
    player.gunIdx = i;
    player.gunName = g.name;
  }));

  const cashRow = section('SHARDS');
  btn(cashRow, '+500', () => { META.shards += 500; saveMeta(); });
  btn(cashRow, 'ALL GUNS', () => { GUNS.forEach(g => META.owned[g.id] = true); saveMeta(); });
  btn(cashRow, 'WIPE', () => {
    META.shards = 0; META.owned = { pea:true }; META.boosts = {};
    META.startGun = 'pea'; META.startWave = 1; META.waves = { 1:true };
    saveMeta();
  });

  const buffRow = section('BUFF');
  for (const c of CARDS) btn(buffRow, c.name.split(' ')[0], () => {
    c.apply(player.gun);
    player.upgrades++;
  });
  btn(buffRow, 'RESET', () => {
    player.gun = Object.assign({}, T.gun);
    player.speedMul = 1; player.upgrades = 0;
    player.gunIdx = 0; player.gunName = GUNS[0].name;
    player.orbs = 0; rebuildOrbs();
  });

  const mapRow = section('GO TO');
  for (const z of ZONES) btn(mapRow, z.name.split(' ').pop(), () => {
    // land somewhere clear in the middle of that area
    for (let i=0;i<200;i++){
      const x = z.x + rand(30, z.w-30), y = z.y + rand(30, z.h-30);
      if (clearSpot(x, y, 14)){ player.x = x; player.y = y; break; }
    }
    updateCam(0, true);
  });

  const meRow = section('PLAYER');
  btn(meRow, 'HEAL', () => { player.hp = player.maxhp; });
  btn(meRow, '+HEART', () => { player.maxhp++; player.hp++; });
  btn(meRow, 'HURT', () => { player.iframe = 0; hurtPlayer(player, 1); });
  const godBtn = btn(meRow, 'GOD', () => { player.iframe = player.iframe > 1e8 ? 0 : 1e9; });

  const waveRow = section('WAVE');
  btn(waveRow, '-1', () => jump(Math.max(1, ST.wave - 1)));
  btn(waveRow, '+1', () => jump(ST.wave + 1));
  btn(waveRow, 'BOSS', () => jump((Math.floor(ST.wave / 5) + 1) * 5));
  btn(waveRow, 'CLEAR', () => { enemies.length = 0; ebullets.length = 0; boss = null; });

  const spawnRow = section('SPAWN');
  for (const t of ['washer','rinser','scrubber','bubbler','steamer','stacker','boss'])
    btn(spawnRow, t.slice(0,5).toUpperCase(), () => { const p = spawnEdgePos(); spawnEnemy(t, p.x, p.y); });

  const orbRow = section('BARRELS');
  btn(orbRow, '+1', () => addOrb());
  btn(orbRow, 'NONE', () => { player.orbs = 0; rebuildOrbs(); });

  box.appendChild(readout);

  function paint(){
    gunBtns.forEach((b, i) => b.classList.toggle('on', player.gunIdx === i));
    godBtn.classList.toggle('on', player.iframe > 1e8);
    const g = player.gun || {};
    readout.textContent =
      'wave ' + ST.wave + '   lv ' + player.level + '   ups ' + player.upgrades + '\n' +
      'hp ' + Math.max(0, Math.round(player.hp)) + '/' + player.maxhp +
      '   enemies ' + enemies.length + '\n' +
      'dmg ' + (g.damage || 0).toFixed(1) + '  rate ' + (g.rate || 0).toFixed(1) +
      '  x' + (g.count || 0) + '  pierce ' + (g.pierce || 0) + '\n' +
      Math.round(player.x) + ',' + Math.round(player.y) + '  ' + zoneAt(player.x, player.y).name;
  }

  // Once the panel is up you can shut it again without going back to the
  // console — but nothing on the page can open it in the first place.
  const closeRow = section('');
  btn(closeRow, 'CLOSE', () => box.classList.remove('open'));

  function toggle(on){
    const want = on === undefined ? !box.classList.contains('open') : !!on;
    box.classList.toggle('open', want);
    if (want) paint();
    return want ? 'cheat menu open' : 'cheat menu closed';
  }

  // The only door. Type sudsCheats() in the browser console.
  window.sudsCheats = toggle;

  setInterval(() => { if (box.classList.contains('open')) paint(); }, 250);
})();
</script>
</body>
</html>
