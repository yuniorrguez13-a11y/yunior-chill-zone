    dmg:1.20, rate:1.00, bspd:1.65, add:0, spread:0.00, pierce:2, shake:1.0, life:0,
    windup:0.85, cmin:0.35, cmax:3.4, cpierce:5 },
  // He goes off the end of the barrel enormous and ploughs through the whole
  // room. Three seconds later the steroids wear off and he is a noodle, so he
  // is devastating in your face and completely useless across the kitchen.
  // `buffT` is how long the gains last, in seconds.
  { id:'gains', cost:1600, name:'GAINS CANNON',     sp:'gunK', shot:'dude',
    blurb:'LAUNCHES A GUY. HE HAS THREE SECONDS.',
    dmg:2.60, rate:0.45, bspd:0.48, add:0, spread:0.03, pierce:99, shake:2.2, life:4.8,
    buffT:3.0, limpDmg:0.09, limpSpd:0.35 },
];

// Guns no longer unlock on their own. You own a set, you choose which one to
// start a run with, and you climb the rest of the ones you own as you take
// upgrades — so buying a gun makes the whole ladder longer, not just better.
const EVOLVE_EVERY = 3;
function ownedGuns(){ return GUNS.filter(g => META.owned[g.id]); }
function gunLadder(){
  const list = ownedGuns();
  const at = list.findIndex(g => g.id === META.startGun);
  return list.slice(at < 0 ? 0 : at);
}
// step up the ladder if the upgrade count has earned it
function evolveGun(quiet){
  const l = player.ladder;
  if (!l || !l.length) return;
  const g = l[Math.min(Math.floor(player.upgrades / EVOLVE_EVERY), l.length - 1)];
  const gi = GUNS.indexOf(g);
  if (gi === player.gunIdx) return;
  player.gunIdx = gi;
  player.gunName = g.name;
  player.charge = 0;      // a half-wound Lance doesn't carry over to the next gun
  if (quiet) return;
  ST.banner = 'GUN EVOLVED: ' + g.name; ST.bannerTimer = 2.0;
  SFX.evolve();
  spawnParts(player.x, player.y, 24, '#f4c542', 90);
}
// How far the gun floats out. It follows the sprite's own width, so the
// Megablaster hangs a lot further from him than the starter pistol does.
function gunRadius(g){ return 12 + SP[g.sp].width * 0.30; }

const CARDS = [
  { id:'rate',  name:'RAPID CYCLE',    desc:'+30% FIRE RATE',        apply: g => g.rate = Math.min(20, g.rate*1.30), max: g => g.rate >= 20 },
  { id:'dmg',   name:'HEAVY LOAD',     desc:'+35% DAMAGE',           apply: g => { g.damage *= 1.35; g.size = Math.min(2.2, g.size*1.12); } },
  { id:'split', name:'SPLIT BARREL',   desc:'+1 BULLET',             apply: g => g.count = Math.min(6, g.count+1), max: g => g.count >= 6 },
  { id:'boots', name:'TURBO SNEAKERS', desc:'+12% MOVE SPEED',       apply: () => player.speedMul *= 1.12 },
  { id:'armor', name:'STEEL APRON',    desc:'+1 MAX HEART, HEAL 2',  apply: () => { player.maxhp++; player.hp = Math.min(player.maxhp, player.hp+2); } },
  { id:'drill', name:'DRILL ROUNDS',   desc:'BULLETS PIERCE +1',     apply: g => g.pierce = Math.min(3, g.pierce+1), max: g => g.pierce >= 3 },
  { id:'rifle', name:'LONG RIFLING',   desc:'+25% BULLET SPEED',     apply: g => { g.bspeedMul *= 1.25; g.damage *= 1.10; } },
  // he whistles a second tune and another barrel comes along for the ride.
  // Spare barrels orbit him and pick their own targets.
  { id:'orb',   name:'SPARE BARREL',   desc:'+1 ORBITING GUN',       apply: () => addOrb(), max: () => player.orbs >= 3 },
];

// ---- spare barrels: little guns that circle him and fire on their own ----
const ORB_RADIUS = 30, ORB_SPIN = 1.25, ORB_RANGE = 200, ORB_DMG = 0.5;
function addOrb(){
  player.orbs = Math.min(3, player.orbs + 1);
  rebuildOrbs();
}
function rebuildOrbs(){
  const keep = orbs.length ? orbs[0].ang : 0;
  orbs = [];
  for (let i=0;i<player.orbs;i++){
    const a = keep + i*TAU/player.orbs;
    orbs.push({ ang: a, cd: rand(0, 0.3), aim: a,
                x: player.x + Math.cos(a)*ORB_RADIUS,
                y: player.y + Math.sin(a)*ORB_RADIUS });
  }
}
function updateOrbs(dt){
  if (!orbs.length) return;
  const g = player.gun, gun = GUNS[player.gunIdx];
  for (const o of orbs){
    o.ang += ORB_SPIN * dt;
    o.x = player.x + Math.cos(o.ang)*ORB_RADIUS;
    o.y = player.y + Math.sin(o.ang)*ORB_RADIUS;
    o.cd -= dt;
    // find something worth shooting — nearest enemy inside its range
    let best = null, bd = ORB_RANGE*ORB_RANGE;
    for (const e of enemies){
      const d = dist2(o.x, o.y, e.x, e.y);
      if (d < bd){ bd = d; best = e; }
    }
    o.aim = best ? Math.atan2(best.y - o.y, best.x - o.x) : o.ang;
    if (!best || o.cd > 0) continue;
    // spare barrels always throw plain slugs, whatever he is carrying —
    // three simultaneous beams would be a different game
    o.cd = 1 / (g.rate * 0.55);
    const spd = g.speed * g.bspeedMul;
    if (pbullets.length >= T.maxPBullets) pbullets.shift();
    pbullets.push({
      x: o.x, y: o.y,
      vx: Math.cos(o.aim)*spd, vy: Math.sin(o.aim)*spd,
      ang: o.aim, dmg: g.damage * gun.dmg * ORB_DMG, size: g.size,
      pierce: g.pierce, hitList: null, shot: 'slug', life: 0,
    });
  }
}

function startRun(){
  ST.mode = 'play';
  ST.time = 0; ST.playTime = 0; ST.kills = 0;
  ST.wave = Math.max(0, META.startWave - 1);   // beginWave() adds one
  gotoMap(mapForWave(Math.max(1, META.startWave)), false);
  ST.runShards = 0;
  ST.waveState = 'clear'; ST.waveTimer = 0.5;
  ST.toSpawn = []; ST.spawnTimer = 0;
  ST.shake = 0; ST.flashRed = 0; ST.banner = ''; ST.bannerTimer = 0;
  ST.levelQueue = 0; ST.cards = [];
  ST.zone = ''; ST.zoneTimer = 0; ST.seen = {};
  player.x = SPAWN.x; player.y = SPAWN.y; player.vx = 0; player.vy = 0;
  player.hp = T.playerHP; player.maxhp = T.playerHP;
  player.iframe = 0; player.fireCd = 0; player.flash = 0;
  player.face = 1; player.moving = false;
  player.speedMul = 1; player.upgrades = 0;
  player.gunIdx = 0; player.gunName = GUNS[0].name;
  player.gun = Object.assign({}, T.gun);
  player.xp = 0; player.level = 1; player.xpNext = 5;
  player.aim = 0; player.aimTrail = [0,0,0]; player.orbs = 0;
  player.charge = 0; player.recoil = 0; player.whistling = 0;
  enemies = []; pbullets = []; ebullets = []; pickups = []; parts = []; floaters = []; orbs = [];
  boss = null; beamFx = null; beamSfxCd = 0; blasts = []; arcFx = null;

  // everything bought at the store lands here, before the first enemy
  player.ladder = gunLadder();
  player.gunIdx = GUNS.indexOf(player.ladder[0] || GUNS[0]);
  player.gunName = GUNS[player.gunIdx].name;
  applyBoosts();
  // starting deeper in the shift comes with the upgrades you would have had
  for (let i = 0; i < META.startWave - 1; i++){
    const pool = CARDS.filter(c => !(c.max && c.max(player.gun)));
    if (!pool.length) break;
    pick(pool).apply(player.gun);
    player.upgrades++;
  }
  evolveGun(true);

  updateCam(0, true);
  document.body.classList.add('playing');
  SFX.click();
}

// Permanent boosts, folded in on top of the base stats.
function applyBoosts(){
  player.maxhp = T.playerHP + boostLv('hp');
  player.hp = player.maxhp;
  player.gun.damage *= 1 + boostLv('dmg')  * 0.08;
  player.gun.rate   *= 1 + boostLv('rate') * 0.06;
  player.speedMul   *= 1 + boostLv('speed')* 0.05;
  player.magnet = T.magnetRadius * (1 + boostLv('magnet') * 0.25);
  player.mercy  = T.iframes      * (1 + boostLv('mercy')  * 0.15);
  player.shardMul = 1 + boostLv('greed') * 0.25;
  player.orbs = boostLv('barrel');
  rebuildOrbs();
}

function endRun(){
  if (ST.tut){
    // there is no losing the tutorial — patch him up and carry on
    player.hp = player.maxhp;
    player.iframe = Math.max(player.iframe, 2);
    ST.flashRed = 0.4;
    addFloater(player.x, player.y - 16, 'PATCHED UP', '#79c7f0', 1.6);
    SFX.heart();
    return;
  }
  ST.mode = 'over';
  document.body.classList.remove('playing');
  saveMeta();                    // bank whatever he picked up this run
  if (ST.wave > ST.best.wave || (ST.wave === ST.best.wave && ST.kills > ST.best.kills)){
    ST.best.wave = ST.wave; ST.best.kills = ST.kills;
    try {
      localStorage.setItem('suds-best-wave', String(ST.best.wave));
      localStorage.setItem('suds-best-kills', String(ST.best.kills));
    } catch(e){}
  }
  SFX.gameover();
}

// ================================================================
// WAVES
// ================================================================
function isBossWave(n){ return n % 5 === 0; }

function beginWave(n){
  ST.wave = n;
  // walked into the next room of the building
  const want = mapForWave(n);
  if (want !== MAPI && !ST.tut) gotoMap(want, true);
  if (isBossWave(n)){
    ST.waveState = 'bosswarn';
    ST.waveTimer = 2.2;
    ST.bossType = bossForWave(n);
    ST.banner = 'WARNING! ' + BOSS_NAME[ST.bossType] + ' APPROACHES';
    ST.bannerTimer = 2.2;
    SFX.alarm();
    return;
  }
  ST.waveState = 'announce';
  ST.waveTimer = 1.4;
  ST.banner = 'WAVE ' + n; ST.bannerTimer = 1.4;
  const budget = 4 + n * 2;
  const list = [];
  for (let i=0;i<budget;i++) list.push(rollEnemy(n));
  ST.toSpawn = list;
  ST.spawnTimer = 0;
}

// Who shows up, and from which wave. `weight` is relative, so raising one
// number is enough to make that dishwasher more common — nothing else to
// keep in step. Costlier types unlock later so wave 1 stays gentle.
const ROSTER = [
  { type:'washer',   from:1,  weight:40, name:'WASHER' },
  { type:'rinser',   from:2,  weight:26, name:'RINSER' },
  { type:'scrubber', from:3,  weight:24, name:'SCRUBBER' },
  { type:'bubbler',  from:4,  weight:18, name:'BUBBLER' },
  { type:'steamer',  from:6,  weight:16, name:'STEAMER' },
  { type:'stacker',  from:8,  weight:13, name:'STACKER' },
  { type:'toaster',  from:3,  weight:22, name:'TOASTER' },
  { type:'chopper',  from:5,  weight:18, name:'CHOPPER' },
  { type:'kettle',   from:7,  weight:15, name:'KETTLE' },
  { type:'fryer',    from:9,  weight:14, name:'FRYER' },
  { type:'micro',    from:11, weight:12, name:'MICROWAVE' },
  { type:'mixer',    from:13, weight:11, name:'MIXER' },
];
function rollEnemy(n){
  let total = 0;
  for (const r of ROSTER) if (n >= r.from) total += r.weight;
  let pickN = Math.random() * total;
  for (const r of ROSTER){
    if (n < r.from) continue;
    pickN -= r.weight;
    if (pickN <= 0) return r.type;
  }
  return 'washer';
}

// Enemies come in from just off the edge of what you can see, not the edge
// of the kitchen — otherwise half a wave would spend the round walking.
// Retries until it finds somewhere that isn't inside a counter.
function spawnEdgePos(){
  for (let tries = 0; tries < 40; tries++){
    const side = irand(0,3), m = 20;
    let x, y;
    if (side === 0){ x = rand(cam.x+m, cam.x+W-m); y = cam.y - 16; }
    else if (side === 1){ x = rand(cam.x+m, cam.x+W-m); y = cam.y + H + 16; }
    else if (side === 2){ x = cam.x - 16; y = rand(cam.y+m, cam.y+H-m); }
    else { x = cam.x + W + 16; y = rand(cam.y+m, cam.y+H-m); }
    x = clamp(x, 18, WORLD.w-18); y = clamp(y, 18, WORLD.h-18);
    if (clearSpot(x, y, 12)) return { x, y };
  }
  // fell through: drop it somewhere clear near the player instead
  for (let tries = 0; tries < 60; tries++){
    const a = rand(0, TAU), d = rand(120, 300);
    const x = clamp(player.x + Math.cos(a)*d, 18, WORLD.w-18);
    const y = clamp(player.y + Math.sin(a)*d, 18, WORLD.h-18);
    if (clearSpot(x, y, 12)) return { x, y };
  }
  return { x: SPAWN.x, y: SPAWN.y };
}

function waveScale(n){ return 1 + (n-1) * 0.15; }

function spawnEnemy(type, x, y){
  const n = ST.wave, sc = waveScale(n);
  const base = T[type];
  const elite = type !== 'boss' && n >= 4 && Math.random() < (0.10 + n*0.012);
  const e = {
    type, x, y,
    hp: base.hp * sc * (elite ? T.eliteHPMul : 1),
    maxhp: base.hp * sc * (elite ? T.eliteHPMul : 1),
    speed: base.speed * (1 + (n-1)*0.03) * (elite ? T.eliteSpeedMul : 1),
    r: base.r * (elite ? 1.2 : 1),
    touch: base.touch + (elite ? 1 : 0),
    elite,
    t1: rand(0.6, base.shootCd || 2.5),   // shoot timer
    t2: rand(0, TAU),                     // wobble phase
    flash: 0,
  };
  if (type === 'scrubber'){
    e.st = 'walk';        // walk -> wind -> dash -> rest
    e.t3 = 0;             // how long is left in the current state
  }
  if (type === 'stacker'){
    e.shield = true;
    e.face = Math.atan2(player.y - y, player.x - x);
  }
  if (type === 'toaster'){ e.hop = rand(0, TAU); e.burst = 0; }
  if (type === 'kettle'){ e.fuse = 0; e.armed = false; }
  if (type === 'micro'){ e.beam = 0; e.wind = 0; e.beamA = 0; }
  if (type === 'chopper'){ e.orbit = Math.random() < 0.5 ? 1 : -1; }
  if (type === 'fryer'){ e.drip = rand(0.4, 1.2); }
  // name-drop each kind the first time you meet it
  const seen = ST.seen || (ST.seen = {});
  if (!seen[type]){
    const row = ROSTER.find(r => r.type === type);
    if (row){ seen[type] = 1; addFloater(x, y - 22, row.name + '!', '#ffc02a', 1.8); }
  }
  if (isBoss(e)){
    const cycle = Math.floor(bossIndexFor(n) / BOSSES.length);   // how many times round
    const bossLvl = Math.floor(n / 5);
    const bt = T[type];
    e.hp = e.maxhp = bt.hp * (1 + cycle * 0.85) * (1 + (bossLvl-1) * 0.10);
    e.speed = bt.speed; e.r = bt.r; e.touch = bt.touch;
    e.bossLvl = bossLvl;
    e.spiralA = 0; e.tSpiral = 1.2; e.tVolley = 2.6; e.tRing = 4.0;
    e.ghost = type !== 'btrap';   // the grease trap is plumbed in and cannot move
    e.phase = 1;
    e.tA = 1.4; e.tB = 2.8; e.tC = 4.2; e.sweep = rand(0, TAU);
    e.dash = 0; e.wind = 0; e.dashA = 0; e.spin = 1;
    boss = e;
  }
  enemies.push(e);
  return e;
}

function updateWaves(dt){
  ST.waveTimer -= dt;
  if (ST.waveState === 'clear'){
    if (ST.waveTimer <= 0) beginWave(ST.wave + 1);
  } else if (ST.waveState === 'announce'){
    if (ST.waveTimer <= 0) ST.waveState = 'active';
  } else if (ST.waveState === 'bosswarn'){
    if (ST.waveTimer <= 0){
      const p = spawnEdgePos();
      spawnEnemy(ST.bossType || 'boss', clamp(p.x, 40, WORLD.w-40), clamp(p.y, 40, WORLD.h-40));
      ST.waveState = 'active';
    }
  } else if (ST.waveState === 'active'){
    if (ST.toSpawn.length){
      ST.spawnTimer -= dt;
      if (ST.spawnTimer <= 0){
        const p = spawnEdgePos();
        spawnEnemy(ST.toSpawn.pop(), p.x, p.y);
        ST.spawnTimer = rand(0.25, 0.7);
      }
    } else if (!enemies.length){
      ST.waveState = 'clear';
      ST.waveTimer = 1.6;
      ST.banner = 'WAVE ' + ST.wave + ' CLEAR!'; ST.bannerTimer = 1.4;
    }
  }
}

// ================================================================
// BULLETS
// ================================================================
function firePlayerGun(dt){
  const g = player.gun;
  player.fireCd -= dt;
  let want = mouse.down || keys[' '];
  let aimX, aimY;
  if (usingTouch && touch.active){
    // touch: auto-aim nearest enemy
    let best = null, bd = 1e9;
    for (const e of enemies){
      const d = dist2(player.x, player.y, e.x, e.y);
      if (d < bd){ bd = d; best = e; }
    }
    if (best){ want = true; aimX = best.x; aimY = best.y; }
  }
  // the mouse is in screen pixels; the player lives in the kitchen
  if (aimX === undefined){ aimX = mouse.x + cam.x; aimY = mouse.y + cam.y; }
  player.aim = Math.atan2(aimY - player.y, aimX - player.x);
  // keep the last few aim angles so the gun can smear when it swings hard
  player.aimTrail[2] = player.aimTrail[1];
  player.aimTrail[1] = player.aimTrail[0];
  player.aimTrail[0] = player.aim;

  const gun = GUNS[player.gunIdx];
  // cleared every frame by everything, not just by the beam gun — otherwise
  // swapping off the Rinse Cannon mid-burn leaves the last beam painted on
  beamFx = null;
  if (gun.beam){
    beamSfxCd -= dt;
    if (want) fireBeam(g, gun, dt);
    return;
  }
  // the Arc Welder never spawns a bullet — it picks its own targets
  if (gun.chain){
    if (want && player.fireCd <= 0){
      player.fireCd = 1 / (g.rate * gun.rate);
      fireChain(g, gun);
    }
    return;
  }

  // The Pressure Lance winds up while the trigger is down and goes off when you
  // let go — or on its own once it is full, so holding it just repeats the big
  // shot and touch play (which never "releases") still works.
  let cmul = 1, cAdd = 0;
  if (gun.charge){
    if (want){
      player.charge = Math.min(gun.windup, (player.charge || 0) + dt);
      if (player.charge < gun.windup) return;
    }
    const held = player.charge || 0;
    player.charge = 0;
    if (held <= 0.02) return;
    const f = clamp(held / gun.windup, 0, 1);
    cmul = gun.cmin + (gun.cmax - gun.cmin) * f;
    cAdd = Math.round(gun.cpierce * f);
  } else {
    if (!want || player.fireCd > 0) return;
  }
  player.fireCd = 1 / (g.rate * gun.rate);
  const n = g.count + gun.add;
  const spd = g.speed * g.bspeedMul * gun.bspd * (gun.charge ? 0.7 + cmul*0.12 : 1);
  const dmg = g.damage * gun.dmg * cmul;
  const pierce = g.pierce + gun.pierce + cAdd;
  const spread = (n > 1 ? (0.09 + n*0.03) : 0) + gun.spread;
  const gr = gunRadius(gun);
  const mx = player.x + Math.cos(player.aim)*gr;
  const my = player.y + Math.sin(player.aim)*gr;
  // across-the-barrels offset, used by banked guns to fire parallel streams
  const nx = -Math.sin(player.aim), ny = Math.cos(player.aim);
  for (let i=0;i<n;i++){
    const t = n > 1 ? (i/(n-1) - 0.5) : 0;     // -0.5 .. +0.5 across the barrels
    let a, bx = mx, by = my;
    if (gun.bank){
      // every barrel points the same way — spread them sideways, not angularly
      bx += nx * t * gun.bank;
      by += ny * t * gun.bank;
      a = player.aim + rand(-0.02, 0.02);
    } else {
      const off = n > 1 ? t * spread * 2 : rand(-spread, spread);
      a = player.aim + off + rand(-0.015, 0.015);
    }
    if (pbullets.length >= T.maxPBullets) pbullets.shift();
    pbullets.push({
      x: bx, y: by,
      vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
      ang: a, dmg, size: g.size, pierce, hitList: null,
      shot: gun.shot, life: gun.life,
      // the gun itself rides along, so the odd shots (homing, lobbed, returning)
      // can read their own tuning without copying six fields onto every bullet
      g: gun, age: 0, tgt: null, back: false, spin: rand(0, TAU),
    });
  }
  // The muzzle floats well ahead of him now, so anything standing between the
  // two would never be hit. Sweep that gap by hand.
  sweepMuzzle(mx, my, dmg * n);
  ST.shake = Math.min(3, ST.shake + gun.shake*0.5);
  if (ST.tut) ST.tut.shots++;
  player.recoil = 0.13;
  SFX.shoot();
}

// The Rinse Cannon is a held beam, not a stream of bullets: it burns straight
// out to the wall, damaging every enemy in the line until it has chewed through
// its target limit. Damage lands every frame, so the hit sound and the damage
// numbers are rationed rather than fired 60 times a second.
const BEAM_FALLOFF = 0.55;   // damage multiplier per extra body burned through
function fireBeam(g, gun, dt){
  const ux = Math.cos(player.aim), uy = Math.sin(player.aim);
  // how far it can reach: out to the edge of the kitchen, or the first
  // counter in the way, whichever comes first
  const tx = ux > 0 ? (WORLD.w-4 - player.x)/ux : ux < 0 ? (4 - player.x)/ux : 1e9;
  const ty = uy > 0 ? (WORLD.h-4 - player.y)/uy : uy < 0 ? (4 - player.y)/uy : 1e9;
  const maxLen = rayWall(player.x, player.y, ux, uy, Math.max(0, Math.min(tx, ty)));

  const half = 2 + g.size;
  const hits = [];
  for (const e of enemies){
    const t = (e.x - player.x)*ux + (e.y - player.y)*uy;
    if (t < 0 || t > maxLen) continue;
    const px = player.x + ux*t, py = player.y + uy*t;
    const rr = e.r + half;
    if (dist2(px, py, e.x, e.y) > rr*rr) continue;
    hits.push({ e, t });
  }
  hits.sort((a,b) => a.t - b.t);

  const maxTargets = 1 + g.pierce + gun.pierce;
  const dps = g.damage * g.rate * gun.dps;
  let len = maxLen, idx = 0;
  for (const h of hits){
    if (idx >= maxTargets) break;
    const e = h.e;
    // the beam spends itself as it burns through: each body behind the first
    // takes less, so a long line never out-damages the Megablaster.
    // Plate stacks turn it away from the front like anything else.
    const dmg = dps * Math.pow(BEAM_FALLOFF, idx) * dt * shieldMul(e, player.x, player.y);
    e.hp -= dmg;
    e.flash = 0.08;
    e.bAcc = (e.bAcc || 0) + dmg;
    e.bTick = (e.bTick || 0) + dt;
    if (e.bTick >= 0.15){
      addFloater(e.x, e.y - 6, String(Math.round(e.bAcc)), '#a8f4ff');
      SFX.hitEnemy();
      e.bAcc = 0; e.bTick = 0;
    }
    idx++;
    if (e.hp <= 0){ killEnemy(e); continue; }
    if (idx >= maxTargets) len = h.t + e.r;
  }

  const gr = gunRadius(gun);
  beamFx = {
    x: player.x + ux*gr, y: player.y + uy*gr,
    ang: player.aim, len: Math.max(0, len - gr),
    capped: len < maxLen,
  };
  spawnParts(beamFx.x + ux*beamFx.len, beamFx.y + uy*beamFx.len, 1, '#a8f4ff', 40);
  ST.shake = Math.min(1.2, ST.shake + gun.shake * dt * 3);
  if (beamSfxCd <= 0){ SFX.shoot(); beamSfxCd = 0.11; }
}

// Anything caught between the player and the floating muzzle takes the shot.
function sweepMuzzle(mx, my, dmg){
  const dx = mx - player.x, dy = my - player.y;
  const len = Math.hypot(dx, dy);
  if (len < 1) return;
  const ux = dx/len, uy = dy/len;
  let best = null, bt = 1e9;
  for (const e of enemies){
    const t = (e.x - player.x)*ux + (e.y - player.y)*uy;
    if (t < 0 || t > len || t >= bt) continue;
    const px = player.x + ux*t, py = player.y + uy*t;
    if (dist2(px, py, e.x, e.y) > e.r*e.r) continue;
    bt = t; best = e;
  }
  if (best){
    // hit it on the side facing the player, so shields are judged fairly
    const hx = player.x + ux*bt, hy = player.y + uy*bt;
    damageEnemy(best, dmg, hx, hy);
    spawnParts(hx, hy, 3, '#f4c542', 50);
  }
}

function eshoot(x, y, angle, speed, kind){
  if (ebullets.length >= T.maxEBullets) ebullets.shift();
  ebullets.push({
    x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
    ang: angle, kind, spin: rand(0, TAU), age: 0,
  });
}

// nearest live dishwasher to a point, inside a radius. `skip` is a list of
// ones already dealt with, which is how the Arc Welder walks down the queue.
function nearestEnemy(x, y, radius, skip){
  let best = null, bd = radius*radius;
  for (const e of enemies){
    if (skip && skip.indexOf(e) >= 0) continue;
    const d = dist2(x, y, e.x, e.y);
    if (d < bd){ bd = d; best = e; }
  }
  return best;
}

// One bang. Everything inside the circle takes it, hardest at the middle.
function boom(x, y, radius, dmg, color){
  // damageEnemy can kill, and killEnemy splices the list out from under us
  for (const e of enemies.slice()){
    const d = Math.sqrt(dist2(x, y, e.x, e.y)) - e.r;
    if (d > radius) continue;
    damageEnemy(e, dmg * clamp(1 - d/radius, 0.35, 1), x, y);
  }
  spawnParts(x, y, 16, color, 130);
  spawnParts(x, y, 8, '#ffffff', 70);
  ST.shake = Math.min(6, ST.shake + 2.2);
  SFX.boom();
  blasts.push({ x, y, r: radius, t: 0.26, max: 0.26, color });
}

// The Arc Welder: grab the nearest one, then let the current walk from body to
// body. Nothing flies — the whole thing lands on the frame it is fired.
function fireChain(g, gun){
  const gr = gunRadius(gun);
  const mx = player.x + Math.cos(player.aim)*gr, my = player.y + Math.sin(player.aim)*gr;
  let from = nearestEnemy(mx, my, gun.reach);
  if (!from) return;
  const done = [], pts = [[mx, my]];
  let dmg = g.damage * gun.dmg, hops = 0;
  while (from && hops <= gun.jumps){
    pts.push([from.x, from.y]);
    done.push(from);
    const px = pts[pts.length-2][0], py = pts[pts.length-2][1];
    damageEnemy(from, dmg, px, py);
    spawnParts(from.x, from.y, 3, '#c89bff', 60);
    dmg *= gun.falloff;
    hops++;
    from = hops > gun.jumps ? null : nearestEnemy(from.x, from.y, gun.jump, done);
  }
  arcFx = { pts, t: 0.13 };
  ST.shake = Math.min(3, ST.shake + gun.shake*0.5);
  SFX.shoot();
}

function updatePBullets(dt){
  for (let i = pbullets.length-1; i >= 0; i--){
    const b = pbullets[i];
    const gn = b.g;
    b.age = (b.age || 0) + dt;

    // ---- the awkward ones steer themselves before they move ----
    if (b.shot === 'missile'){
      // lost its mark (dead, or it wandered off) — go find another
      if (!b.tgt || enemies.indexOf(b.tgt) < 0) b.tgt = nearestEnemy(b.x, b.y, gn.hunt);
      if (b.tgt){
        let d = Math.atan2(b.tgt.y - b.y, b.tgt.x - b.x) - b.ang;
        while (d > Math.PI) d -= TAU;
        while (d < -Math.PI) d += TAU;
        b.ang += clamp(d, -gn.seek*dt, gn.seek*dt);
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(b.ang)*sp; b.vy = Math.sin(b.ang)*sp;
      }
      if (Math.random() < 0.7) spawnParts(b.x, b.y, 1, '#aab2c0', 14);
    }
    else if (b.shot === 'bomb'){
      b.vx *= gn.drag; b.vy *= gn.drag;   // it is lobbed, so it runs out of throw
      b.spin += dt*9;
    }
    else if (b.shot === 'dude'){
      b.ang = Math.atan2(b.vy, b.vx);
      if (!b.limp && b.age >= gn.buffT){
        // the gains run out mid-flight
        b.limp = true;
        b.dmg *= gn.limpDmg;
        b.vx *= gn.limpSpd; b.vy *= gn.limpSpd;
        b.hitList = null;             // the noodle gets to flop into them again
        spawnParts(b.x, b.y, 12, '#e8a86a', 55);
        addFloater(b.x, b.y - 10, 'NO STEROIDS', '#b0b7c4', 1.1);
        SFX.bubble();
      }
      if (b.limp){
        b.vx *= 0.985; b.vy *= 0.985;         // sad drift
        b.wob = Math.sin(b.age*11)*0.30;      // flailing
      }
    }
    else if (b.shot === 'saw'){
      b.spin += dt*26;
      if (!b.back && b.age >= gn.out) b.back = true;
      if (b.back){
        // reel it in — the pull beats the throw, so it turns and comes home
        const a = Math.atan2(player.y - b.y, player.x - b.x);
        b.vx += Math.cos(a)*gn.pull*dt;
        b.vy += Math.sin(a)*gn.pull*dt;
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > 300){ b.vx = b.vx/sp*300; b.vy = b.vy/sp*300; }
        // fair game again on the way back, which is the whole point of it
        if (b.hitList && b.age > gn.out + 0.15) b.hitList = null;
        if (dist2(b.x, b.y, player.x, player.y) < 100){ pbullets.splice(i,1); continue; }
      }
      b.ang = Math.atan2(b.vy, b.vx);
    }

    b.x += b.vx*dt; b.y += b.vy*dt;
    // short-lived shots (the Sud Shredder's foam) fizzle out instead of flying on
    if (b.life > 0){
      b.life -= dt;
      if (b.life <= 0){
        if (b.shot === 'bomb') boom(b.x, b.y, gn.blast, b.dmg * gn.bdmg, '#e8d84a');
        else if (b.shot === 'dude') spawnParts(b.x, b.y, 6, '#e8a86a', 30);
        else spawnParts(b.x, b.y, 2, '#cfe8ff', 24);
        pbullets.splice(i,1);
        continue;
      }
    }
    // splat against the kitchen itself. A blade on its way home ignores the
    // furniture, otherwise it gets wedged behind a counter and never returns.
    const homing = b.shot === 'saw' && b.back;
    const off = b.x < 4 || b.x > WORLD.w-4 || b.y < 4 || b.y > WORLD.h-4;
    if (!homing && (off || wallAt(b.x, b.y, 0))){
      if (b.shot === 'saw'){
        // clanged off a counter — start the trip home from here
        b.back = true;
        b.x -= b.vx*dt; b.y -= b.vy*dt;
        b.vx *= -0.3; b.vy *= -0.3;
        spawnParts(b.x, b.y, 4, '#dfe4ec', 60);
        SFX.plate();
        continue;
      }
      if (b.shot === 'bomb')         boom(b.x, b.y, gn.blast, b.dmg * gn.bdmg, '#e8d84a');
      else if (b.shot === 'missile') boom(b.x, b.y, gn.blast, b.dmg * gn.bdmg, '#ff9420');
      else spawnParts(b.x, b.y, 2, '#f4c542', 30);
      pbullets.splice(i,1);
    } else if (homing && off){
      b.x = clamp(b.x, 4, WORLD.w-4); b.y = clamp(b.y, 4, WORLD.h-4);
    }
  }
}

// expanding rings left behind by anything that goes off
function updateBlasts(dt){
  for (let i = blasts.length-1; i >= 0; i--){
    blasts[i].t -= dt;
    if (blasts[i].t <= 0) blasts.splice(i,1);
  }
}

function updateEBullets(dt){
  for (let i = ebullets.length-1; i >= 0; i--){
    const b = ebullets[i];
    b.age += dt;
    if (b.kind === 'bubble'){
      // gentle homing for the first 3 seconds, then pop at 6
      if (b.age < 3){
        const ta = Math.atan2(player.y - b.y, player.x - b.x);
        let ca = Math.atan2(b.vy, b.vx);
        let d = ta - ca;
        while (d > Math.PI) d -= TAU;
        while (d < -Math.PI) d += TAU;
        ca += clamp(d, -0.9*dt, 0.9*dt);
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(ca)*sp; b.vy = Math.sin(ca)*sp;
      }
      if (b.age > 6){ spawnParts(b.x, b.y, 3, '#6fd8e2', 26); ebullets.splice(i,1); continue; }
    }
    else if (b.kind === 'steam'){
      // it billows out, slows down, and hangs around long enough to matter
      b.vx *= 0.985; b.vy *= 0.985;
      if (b.age > 2.4){ ebullets.splice(i,1); continue; }
    }
    b.x += b.vx*dt; b.y += b.vy*dt;
    b.spin += dt * 6;
    if (b.x < -14 || b.x > WORLD.w+14 || b.y < -14 || b.y > WORLD.h+14){ ebullets.splice(i,1); continue; }
    // counters are cover — enemy fire breaks on them too
    if (wallAt(b.x, b.y, 0)){
      spawnParts(b.x, b.y, 2, b.kind === 'bubble' ? '#6fd8e2' : '#9aa3b2', 26);
      ebullets.splice(i,1);
    }
  }
}

// ================================================================
// ENEMIES
// ================================================================
// --- oil slicks. The fryer leaves them behind; they slow you down and they
//     stay well after the thing that made them is dead. ---
let slicks = [];
function addSlick(x, y){
  if (slicks.length > 44) slicks.shift();
  slicks.push({ x, y, r: rand(12, 19), t: T.slickLife, max: T.slickLife });
}
function updateSlicks(dt){
  for (let i = slicks.length-1; i >= 0; i--)
    if ((slicks[i].t -= dt) <= 0) slicks.splice(i,1);
}
function onSlick(x, y){
  for (const s of slicks) if (dist2(x, y, s.x, s.y) < s.r*s.r) return true;
  return false;
}

// A kettle reaching the boil. Shooting one early still sets it off, which is
// the point of them: they are a threat you have to deal with at a distance.
function kettleBoom(e){
  e.gone = true;
  spawnParts(e.x, e.y, 22, '#e0563a', 130);
  spawnParts(e.x, e.y, 12, '#ffffff', 90);
  blasts.push({ x:e.x, y:e.y, r:T.kettleBlast, t:0.3, max:0.3, color:'#e0563a' });
  ST.shake = Math.min(7, ST.shake + 3);
  SFX.boom();
  // it takes the other dishwashers with it, which is worth setting up
  for (const o of enemies.slice()){
    if (o === e) continue;
    if (dist2(o.x, o.y, e.x, e.y) < (T.kettleBlast + o.r)*(T.kettleBlast + o.r))
      damageEnemy(o, 26, e.x, e.y);
  }
  if (player.iframe <= 0 &&
      dist2(player.x, player.y, e.x, e.y) < (T.kettleBlast+8)*(T.kettleBlast+8))
    hurtPlayer(T.kettleDmg);
}

// The microwave's line. It stops at the first counter, so cover really works.
function microBurn(e, dt){
  const ux = Math.cos(e.beamA), uy = Math.sin(e.beamA);
  const len = rayWall(e.x, e.y, ux, uy, 340);
  e.beamLen = len;
  const t = (player.x - e.x)*ux + (player.y - e.y)*uy;
  if (t > 0 && t < len){
    const px = e.x + ux*t, py = e.y + uy*t;
    if (player.iframe <= 0 && dist2(px, py, player.x, player.y) < 100) hurtPlayer(1);
  }
  if (Math.random() < 0.5){
    const s = rand(10, len);
    spawnParts(e.x + ux*s, e.y + uy*s, 1, '#6ad07a', 20);
  }
}

function updateEnemies(dt){
  const sc = waveScale(ST.wave);
  let blown = false;
  for (const e of enemies){
    if (e.gone) continue;
    e.flash = Math.max(0, e.flash - dt);
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy) || 1;

    if (e.type === 'washer'){
      step(e, (dx/d) * e.speed * dt, (dy/d) * e.speed * dt);
      e.t1 -= dt;
      if (e.t1 <= 0 && d < T.washer.range && onScreen(e)){
        e.t1 = T.washer.shootCd / Math.sqrt(sc);
        const a = Math.atan2(dy, dx);
        for (let k=-1;k<=1;k++) eshoot(e.x, e.y, a + k*0.28, T.plateSpeed * (1 + ST.wave*0.02), 'plate');
        SFX.plate();
      }
    }
    else if (e.type === 'rinser'){
      // keep 105–150px, strafe sideways
      e.t2 += dt;
      const want = d > 150 ? 1 : (d < 105 ? -1 : 0);
      const ax = dx/d, ay = dy/d;
      const px = -ay, py = ax; // perpendicular
      const strafe = Math.sin(e.t2 * 0.9) > 0 ? 1 : -1;
      step(e, (ax*want + px*strafe*0.6) * e.speed * dt,
              (ay*want + py*strafe*0.6) * e.speed * dt);
      e.t1 -= dt;
      if (e.t1 <= 0 && onScreen(e)){
        e.t1 = T.rinser.shootCd / Math.sqrt(sc);
        const a = Math.atan2(dy, dx);
        for (let k=0;k<3;k++){
          const err = rand(-0.06, 0.06);
          eshoot(e.x, e.y, a + err, T.forkSpeed * (1 + ST.wave*0.02), 'fork');
        }
        SFX.fork();
      }
    }
    else if (e.type === 'bubbler'){
      e.t2 += dt;
      step(e, Math.cos(e.t2*0.7) * e.speed * dt + (dx/d) * e.speed * 0.4 * dt,
              Math.sin(e.t2*0.9) * e.speed * dt + (dy/d) * e.speed * 0.4 * dt);
      e.t1 -= dt;
      if (e.t1 <= 0 && onScreen(e)){
        e.t1 = T.bubbler.shootCd / Math.sqrt(sc);
        const n = 8 + Math.min(6, Math.floor(ST.wave/3));
        const a0 = rand(0, TAU);
        for (let k=0;k<n;k++) eshoot(e.x, e.y, a0 + k*TAU/n, T.bubbleSpeed, 'bubble');
        SFX.bubble();
      }
    }
    // --- toaster: hops in fast and pops a burst of toast ---
    else if (e.type === 'toaster'){
      e.hop += dt * 9;
      const bounce = Math.abs(Math.sin(e.hop)) * e.speed * 1.5;
      step(e, (dx/d) * bounce * dt, (dy/d) * bounce * dt);
      e.t1 -= dt;
      if (e.burst > 0){
        // three slices, fast, one after another
        e.t2 -= dt;
        if (e.t2 <= 0){
          e.burst--; e.t2 = 0.11;
          eshoot(e.x, e.y, Math.atan2(dy, dx) + rand(-0.05,0.05), T.toastSpeed, 'toast');
          SFX.fork();
        }
      } else if (e.t1 <= 0 && d < 240 && onScreen(e)){
        e.t1 = T.toaster.shootCd / Math.sqrt(sc);
        e.burst = 3; e.t2 = 0;
      }
    }
    // --- fryer: slow, drips a slick behind it, spits arcs of hot oil ---
    else if (e.type === 'fryer'){
      step(e, (dx/d) * e.speed * dt, (dy/d) * e.speed * dt);
      e.drip -= dt;
      if (e.drip <= 0){ e.drip = rand(0.7, 1.4); addSlick(e.x, e.y); }
      e.t1 -= dt;
      if (e.t1 <= 0 && d < 260 && onScreen(e)){
        e.t1 = T.fryer.shootCd / Math.sqrt(sc);
        const a = Math.atan2(dy, dx);
        for (let k=-2;k<=2;k++) eshoot(e.x, e.y, a + k*0.20, T.globSpeed, 'glob');
        SFX.bubble();
      }
    }
    // --- kettle: runs you down and goes off. Killing it early still costs you. ---
    else if (e.type === 'kettle'){
      const rush = e.armed ? 0.25 : 1;
      step(e, (dx/d) * e.speed * rush * dt, (dy/d) * e.speed * rush * dt);
      if (!e.armed && d < 46){
        e.armed = true; e.fuse = T.kettleFuse;
        SFX.alarm();
      }
      if (e.armed){
        e.fuse -= dt;
        e.flash = 0.1;
        if (e.fuse <= 0){ kettleBoom(e); continue; }
      }
    }
    // --- mixer: parks itself and drags you in ---
    else if (e.type === 'mixer'){
      step(e, (dx/d) * e.speed * dt, (dy/d) * e.speed * dt);
      e.t2 += dt * 5;
      if (d < T.mixerRange && onScreen(e)){
        // the pull is strongest right next to it
        // never quite as fast as he runs, so it is a fight and not a capture
        const g = T.mixerPull * (1 - d / T.mixerRange);
        moveCircle(player, -(dx/d) * g * dt, -(dy/d) * g * dt, 6);
        if (Math.random() < 0.4)
          spawnParts(player.x - (dx/d)*10, player.y - (dy/d)*10, 1, '#b9c2cf', 30);
      }
      e.t1 -= dt;
      if (e.t1 <= 0 && d < 200 && onScreen(e)){
        e.t1 = T.mixer.shootCd / Math.sqrt(sc);
        const a0 = rand(0, TAU);
        for (let k=0;k<6;k++) eshoot(e.x, e.y, a0 + k*TAU/6, T.forkSpeed*0.8, 'fork');
        SFX.fork();
      }
    }
    // --- microwave: winds up, then burns a line. Break the line of sight. ---
    else if (e.type === 'micro'){
      if (e.beam > 0){
        e.beam -= dt;
        // it tracks, but slowly enough that you can walk out of it
        let da = Math.atan2(dy, dx) - e.beamA;
        while (da > Math.PI) da -= TAU;
        while (da < -Math.PI) da += TAU;
        e.beamA += clamp(da, -0.9*dt, 0.9*dt);
        microBurn(e, dt);
        if (e.beam <= 0) e.t1 = T.micro.shootCd / Math.sqrt(sc);
      } else if (e.wind > 0){
        e.wind -= dt;
        e.beamA = Math.atan2(dy, dx);
        e.flash = 0.08;
        if (e.wind <= 0){ e.beam = T.microBurn; SFX.alarm(); }
      } else {
        const want = d > T.micro.range ? 1 : (d < 120 ? -1 : 0);
        step(e, (dx/d) * want * e.speed * dt, (dy/d) * want * e.speed * dt);
        e.t1 -= dt;
        if (e.t1 <= 0 && d < T.micro.range && onScreen(e)) e.wind = T.microWind;
      }
    }
    // --- chopper: orbits you at knife range and throws them ---
    else if (e.type === 'chopper'){
      const ax = dx/d, ay = dy/d, px = -ay, py = ax;
      const want = d > 140 ? 1 : (d < 90 ? -1 : 0);
      step(e, (ax*want + px*e.orbit) * e.speed * dt,
              (ay*want + py*e.orbit) * e.speed * dt);
      e.t1 -= dt;
      if (e.t1 <= 0 && onScreen(e)){
        e.t1 = T.chopper.shootCd / Math.sqrt(sc);
        const a = Math.atan2(dy, dx);
        for (let k=-1;k<=1;k+=2) eshoot(e.x, e.y, a + k*0.10, T.knifeSpeed, 'knife');
        SFX.fork();
      }
    }
    // --- scrubber: walks in, plants itself, winds up, then charges ---
    else if (e.type === 'scrubber'){
      e.t3 -= dt;
      if (e.st === 'walk'){
        step(e, (dx/d) * e.speed * dt, (dy/d) * e.speed * dt);
        if (d < 190 && onScreen(e)){ e.st = 'wind'; e.t3 = 0.55; }
      } else if (e.st === 'wind'){
        // shuffling on the spot, aiming at where you are right now
        e.dashA = Math.atan2(dy, dx);
        step(e, -Math.cos(e.dashA)*14*dt, -Math.sin(e.dashA)*14*dt);
        if (e.t3 <= 0){ e.st = 'dash'; e.t3 = 0.8; SFX.fork(); }
      } else if (e.st === 'dash'){
        const sp = e.speed * T.dashSpeed;
        const bx = e.x, by = e.y;
        step(e, Math.cos(e.dashA)*sp*dt, Math.sin(e.dashA)*sp*dt);
        if (Math.random() < 0.5) spawnParts(e.x, e.y, 1, '#f0c020', 40);
        // ran into a counter? that's the end of the charge
        const moved = Math.abs(e.x-bx) + Math.abs(e.y-by);
        if (e.t3 <= 0 || moved < sp*dt*0.4){
          e.st = 'rest'; e.t3 = 0.85;
          if (moved < sp*dt*0.4){ ST.shake = Math.min(4, ST.shake + 1.5); SFX.boom(); }
        }
      } else {
        step(e, (dx/d) * e.speed * 0.25 * dt, (dy/d) * e.speed * 0.25 * dt);
        if (e.t3 <= 0) e.st = 'walk';
      }
    }
    // --- steamer: hangs back and vents scalding clouds ---
    else if (e.type === 'steamer'){
      e.t2 += dt;
      const want = d > 210 ? 1 : (d < 130 ? -1 : 0);
      const ax = dx/d, ay = dy/d;
      step(e, (ax*want - ay*Math.sin(e.t2*0.8)*0.5) * e.speed * dt,
              (ay*want + ax*Math.sin(e.t2*0.8)*0.5) * e.speed * dt);
      e.t1 -= dt;
      if (e.t1 <= 0 && onScreen(e)){
        e.t1 = T.steamer.shootCd / Math.sqrt(sc);
        const a0 = Math.atan2(dy, dx), n = 7;
        for (let k=0;k<n;k++)
          eshoot(e.x, e.y, a0 + (k/(n-1) - 0.5) * 1.9, T.steamSpeed * rand(0.7, 1.15), 'steam');
        SFX.bubble();
      }
    }
    // --- stacker: walks straight at you behind a stack of plates.
    //     The stack only turns so fast, which is the whole fight: get
    //     around the side before it comes about. ---
    else if (e.type === 'stacker'){
      const ta = Math.atan2(dy, dx);
      let da = ta - e.face;
      while (da > Math.PI) da -= TAU;
      while (da < -Math.PI) da += TAU;
      e.face += clamp(da, -1.5*dt, 1.5*dt);
      step(e, (dx/d) * e.speed * dt, (dy/d) * e.speed * dt);
      e.t1 -= dt;
      if (e.t1 <= 0 && onScreen(e)){
        e.t1 = T.stacker.shootCd / Math.sqrt(sc);
        for (let k=-1;k<=1;k+=2)
          eshoot(e.x + Math.cos(e.face)*14, e.y + Math.sin(e.face)*14,
                 e.face + k*0.12, T.plateSpeed*1.2, 'plate');
        SFX.plate();
      }
    }
    else if (isBoss(e)){
      updateBoss(e, dt, dx, dy, d);
    }

    e.x = clamp(e.x, -20, WORLD.w+20);
    e.y = clamp(e.y, -30, WORLD.h+20);
    if (e.gone) blown = true;
  }
  // kettles take themselves off the board mid-loop, so they are swept up after
  if (blown) enemies = enemies.filter(e => !e.gone);
}

// One enemy step, sliding off the furniture. The Megawasher is flagged
// `ghost` and simply drives through it.
function step(e, dx, dy){
  if (e.ghost){ e.x += dx; e.y += dy; return; }
  moveCircle(e, dx, dy, e.r * 0.8);
}

// "can it see you / is it worth firing" — now measured against the view,
// not the whole kitchen, so off-screen enemies don't spam bullets at you.
function onScreen(e){ return inView(e.x, e.y, -8); }

function updateBoss(e, dt, dx, dy, d){
  // each of the four fights is its own function; they only share the arrival
  // rule, which is that nothing shoots until you can actually see it
  if (e.type !== 'boss'){
    if (!inView(e.x, e.y, 40) && e.speed > 0){
      e.x += (dx/d)*e.speed*dt; e.y += (dy/d)*e.speed*dt;
      return;
    }
    // half health is where each of them changes its mind
    if (e.phase === 1 && e.hp < e.maxhp*0.5){
      e.phase = 2;
      ST.banner = BOSS_NAME[e.type] + ' IS ANGRY'; ST.bannerTimer = 1.6;
      ST.shake = Math.min(8, ST.shake + 5);
      SFX.alarm();
      spawnParts(e.x, e.y, 30, DEATH_COLOR[e.type] || '#fff', 110);
    }
    if (e.type === 'btrap')   return bossGreaseTrap(e, dt, dx, dy, d);
    if (e.type === 'bburner') return bossSixBurner(e, dt, dx, dy, d);
    if (e.type === 'bchef')   return bossHeadChef(e, dt, dx, dy, d);
  }
  const lv = e.bossLvl;
  if (d > 90){ e.x += (dx/d)*e.speed*dt; e.y += (dy/d)*e.speed*dt; }
  else { e.t2 += dt; e.x += Math.cos(e.t2*0.5)*8*dt; }
  // it spawns off-screen like everything else; hold fire until you can see it
  if (!inView(e.x, e.y, 30)) return;

  // spiral of plates — the signature move
  e.tSpiral -= dt;
  if (e.tSpiral <= 0){
    e.tSpiral = Math.max(0.09, 0.16 - lv*0.015);
    e.spiralA += 0.42;
    const arms = 2 + Math.min(2, lv-1);
    for (let k=0;k<arms;k++)
      eshoot(e.x, e.y, e.spiralA + k*TAU/arms, T.plateSpeed*0.9, 'plate');
  }
  // aimed fork volley
  e.tVolley -= dt;
  if (e.tVolley <= 0){
    e.tVolley = Math.max(1.8, 3.2 - lv*0.2);
    const a = Math.atan2(dy, dx);
    const n = 5 + lv;
    for (let k=0;k<n;k++) eshoot(e.x, e.y, a + (k/(n-1)-0.5)*0.7, T.forkSpeed*1.05, 'fork');
    SFX.fork();
  }
  // bubble ring
  e.tRing -= dt;
  if (e.tRing <= 0){
    e.tRing = Math.max(3.2, 5 - lv*0.3);
    const n = 10 + lv*2;
    const a0 = rand(0, TAU);
    for (let k=0;k<n;k++) eshoot(e.x, e.y, a0 + k*TAU/n, T.bubbleSpeed*1.15, 'bubble');
    SFX.bubble();
  }
}

// --- THE GREASE TRAP -------------------------------------------------
// Bolted to the floor, so the whole fight is about the room rather than it.
// It floods the place with slicks and keeps sending things at you.
function bossGreaseTrap(e, dt, dx, dy, d){
  const p2 = e.phase === 2;
  e.t2 += dt;
  // belches oil in a widening ring of slicks
  e.tA -= dt;
  if (e.tA <= 0){
    e.tA = p2 ? 1.5 : 2.4;
    const n = p2 ? 7 : 5, a0 = rand(0, TAU), rad = 46 + Math.sin(e.t2*0.6)*26;
    for (let k=0;k<n;k++)
      addSlick(clamp(e.x + Math.cos(a0+k*TAU/n)*rad, 20, WORLD.w-20),
               clamp(e.y + Math.sin(a0+k*TAU/n)*rad, 20, WORLD.h-20));
    SFX.bubble();
  }
  // spits fat, in a spinning fan
  e.tB -= dt;
  if (e.tB <= 0){
    e.tB = p2 ? 0.55 : 0.9;
    e.sweep += 0.5;
    const arms = p2 ? 5 : 3;
    for (let k=0;k<arms;k++) eshoot(e.x, e.y, e.sweep + k*TAU/arms, T.globSpeed*1.15, 'glob');
  }
  // and calls the staff
  e.tC -= dt;
  if (e.tC <= 0){
    e.tC = p2 ? 5.5 : 8;
    const kinds = p2 ? ['fryer','kettle','toaster'] : ['toaster','washer'];
    for (let k=0;k<(p2?3:2);k++){
      const a = rand(0, TAU), r = 60;
      spawnEnemy(pick(kinds), clamp(e.x+Math.cos(a)*r, 24, WORLD.w-24),
                              clamp(e.y+Math.sin(a)*r, 24, WORLD.h-24));
    }
    ST.banner = 'THE TRAP IS BACKING UP'; ST.bannerTimer = 1.2;
  }
}

// --- THE SIX BURNER --------------------------------------------------
// Four burning lines pinned to it, turning. You read the rotation and walk
// through the gaps; standing still is what kills you.
function bossSixBurner(e, dt, dx, dy, d){
  const p2 = e.phase === 2;
  if (d > 130){ e.x += (dx/d)*e.speed*dt; e.y += (dy/d)*e.speed*dt; }
  e.sweep += dt * (p2 ? 0.95 : 0.62) * (e.spin || 1);
  const arms = p2 ? 5 : 4;
  e.flameArms = arms;
  // the flames are checked, not fired: they are attached to the boss
  for (let k=0;k<arms;k++){
    const a = e.sweep + k*TAU/arms;
    const ux = Math.cos(a), uy = Math.sin(a);
    const len = rayWall(e.x, e.y, ux, uy, 190);
    const t = (player.x - e.x)*ux + (player.y - e.y)*uy;
    if (t > 12 && t < len){
      const px = e.x + ux*t, py = e.y + uy*t;
      if (player.iframe <= 0 && dist2(px, py, player.x, player.y) < 64) hurtPlayer(1);
    }
    if (Math.random() < 0.5)
      spawnParts(e.x + ux*rand(14,len), e.y + uy*rand(14,len), 1,
                 Math.random()<0.5 ? '#e0563a' : '#ffd070', 26);
  }
  // every so often it reverses, which is the whole tell
  e.tA -= dt;
  if (e.tA <= 0){
    e.tA = p2 ? 3.4 : 5;
    e.spin = -(e.spin || 1);
    ST.shake = Math.min(5, ST.shake + 2);
    SFX.alarm();
  }
  // and lobs a pan of hot fat at where you are standing
  e.tB -= dt;
  if (e.tB <= 0){
    e.tB = p2 ? 1.8 : 2.8;
    const a = Math.atan2(dy, dx);
    for (let k=-1;k<=1;k++) eshoot(e.x, e.y, a + k*0.24, T.globSpeed*1.3, 'glob');
    SFX.bubble();
  }
}

// --- THE HEAD CHEF ---------------------------------------------------
// The last thing in the building, and the only one that hunts you properly:
// it closes the distance, fans knives, and calls the brigade.
function bossHeadChef(e, dt, dx, dy, d){
  const p2 = e.phase === 2;
  if (e.dash > 0){
    e.dash -= dt;
    e.x += Math.cos(e.dashA) * e.speed * 7 * dt;
    e.y += Math.sin(e.dashA) * e.speed * 7 * dt;
    if (Math.random() < 0.8) spawnParts(e.x, e.y, 1, '#e6eaf1', 40);
  } else if (e.wind > 0){
    e.wind -= dt;
    e.dashA = Math.atan2(dy, dx);
    e.flash = 0.08;
    if (e.wind <= 0){ e.dash = 0.42; SFX.fork(); }
  } else {
    if (d > 100){ e.x += (dx/d)*e.speed*dt; e.y += (dy/d)*e.speed*dt; }
    e.tA -= dt;
    if (e.tA <= 0){ e.tA = p2 ? 2.6 : 4.0; e.wind = 0.5; }
  }
  // knife fan
  e.tB -= dt;
  if (e.tB <= 0){
    e.tB = p2 ? 1.3 : 2.1;
    const a = Math.atan2(dy, dx), n = p2 ? 9 : 6;
    for (let k=0;k<n;k++) eshoot(e.x, e.y, a + (k/(n-1)-0.5)*1.0, T.knifeSpeed, 'knife');
    SFX.fork();
  }
  // the brigade
  e.tC -= dt;
  if (e.tC <= 0){
    e.tC = p2 ? 6 : 9;
    const kinds = p2 ? ['chopper','micro','mixer'] : ['chopper','rinser'];
    for (let k=0;k<(p2?3:2);k++){
      const a = rand(0, TAU);
      spawnEnemy(pick(kinds), clamp(e.x+Math.cos(a)*70, 24, WORLD.w-24),
                              clamp(e.y+Math.sin(a)*70, 24, WORLD.h-24));
    }
    ST.banner = 'CHEF CALLS THE BRIGADE'; ST.bannerTimer = 1.2;
  }
  // in phase two it throws a ring of plates whenever it lands a dash
  if (p2 && e.dash > 0 && e.dash < dt*2){
    const a0 = rand(0, TAU);
    for (let k=0;k<12;k++) eshoot(e.x, e.y, a0 + k*TAU/12, T.plateSpeed, 'plate');
  }
}

// How much of a shot actually lands. The stacker's plate stack eats almost
// everything that comes at its front, so you have to get around it.
function shieldMul(e, fromX, fromY){
  if (!e.shield) return 1;
  let d = Math.atan2(fromY - e.y, fromX - e.x) - e.face;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return Math.abs(d) < T.shieldArc ? T.shieldMul : 1;
}

function damageEnemy(e, dmg, hitX, hitY){
  const mul = shieldMul(e, hitX, hitY);
  if (mul < 1){
    // clang — sparks off the plates instead of biting
    spawnParts(hitX, hitY, 4, '#e6e9ef', 70);
    addFloater(hitX, hitY - 6, 'CLANG', '#b0b7c4', 0.5);
    e.hp -= dmg * mul;
    e.flash = 0.05;
    SFX.plate();
    if (e.hp <= 0) killEnemy(e);
    return;
  }
  e.hp -= dmg;
  e.flash = 0.08;
  SFX.hitEnemy();
  addFloater(hitX, hitY - 6, String(Math.round(dmg)), '#f4c542');
  if (e.hp <= 0) killEnemy(e);
}

// Broken plate pieces. The tougher the dishwasher, the more of it there is
// left on the floor. The Shard Magnet boost tilts the odds.
function dropShards(e){
  const mul = player.shardMul || 1;
  let n;
  if (isBoss(e))           n = irand(14, 20);
  else if (e.elite)        n = irand(2, 4);
  else if (T[e.type] && T[e.type].hp >= 34) n = Math.random() < 0.75*mul ? irand(1,2) : 0;
  else                     n = Math.random() < 0.55*mul ? 1 : 0;
  n = Math.round(n * (isBoss(e) ? mul : 1));
  for (let k=0;k<n;k++)
    dropPickup(e.x + rand(-9,9), e.y + rand(-7,7), 'shard');
}

const BOSSES = ['boss','btrap','bburner','bchef'];
const BOSS_NAME = { boss:'THE MEGAWASHER', btrap:'THE GREASE TRAP',
                    bburner:'THE SIX BURNER', bchef:'THE HEAD CHEF' };
// which one turns up on a given boss wave — they cycle, so a long run meets
// all four and then starts again with more health on each
function bossIndexFor(n){ return Math.max(0, Math.floor(n/5) - 1); }
function bossForWave(n){ return BOSSES[bossIndexFor(n) % BOSSES.length]; }
const isBoss = e => BOSSES.indexOf(e.type) >= 0;

const DEATH_COLOR = {
  washer:'#5b8fc4', rinser:'#d3dae6', bubbler:'#7fd4da',
  scrubber:'#f0c020', steamer:'#c9a227', stacker:'#e6e9ef', boss:'#79c7f0',
  toaster:'#f0c874', fryer:'#e8bb3a', kettle:'#e0563a',
  mixer:'#b9c2cf', micro:'#6ad07a', chopper:'#c9a06a',
  btrap:'#c79a24', bburner:'#e0563a', bchef:'#e6eaf1',
};

function killEnemy(e){
  const idx = enemies.indexOf(e);
  if (idx >= 0) enemies.splice(idx, 1);
  // a kettle at the boil goes off whether you shot it or not
  if (e.type === 'kettle' && !e.gone) kettleBoom(e);
  ST.kills++;
  ST.shake = Math.min(6, ST.shake + 2);
  const isB = isBoss(e);
  spawnParts(e.x, e.y, isB ? 50 : 14, '#dfe3ea', isB ? 120 : 70);
  // each one bursts in its own colour, so you can tell what died at a glance
  spawnParts(e.x, e.y, isB ? 30 : 8, DEATH_COLOR[e.type] || '#79c7f0', isB ? 100 : 55);
  if (e.elite) spawnParts(e.x, e.y, 10, '#ffc02a', 80);
  dropShards(e);
  if (isB){
    boss = null;
    SFX.bossdie();
    for (let k=0;k<10;k++) dropPickup(e.x + rand(-18,18), e.y + rand(-14,14), 'sud');
    dropPickup(e.x, e.y, 'heart');
    addFloater(e.x, e.y - 20, (BOSS_NAME[e.type] || 'THE BOSS') + ' DOWN!', CRIMSON, 2.2);
  } else {
    SFX.boom();
    // the heavier ones are worth going after
    const beefy = T[e.type] && T[e.type].hp >= 34;
    const n = e.elite ? 4 : (beefy ? 3 : irand(1,2));
    for (let k=0;k<n;k++) dropPickup(e.x + rand(-6,6), e.y + rand(-6,6), 'sud');
    const heartChance = e.elite ? 0.35 : 0.03;
    if (Math.random() < heartChance) dropPickup(e.x, e.y, 'heart');
  }
}

// ================================================================
// PICKUPS / XP
// ================================================================
function dropPickup(x, y, kind){
  let px = clamp(x, 14, WORLD.w-14), py = clamp(y, 14, WORLD.h-14);
  // never leave a pickup stranded inside a counter — nudge it out
  if (wallAt(px, py, 6)){
    for (let i=0;i<24;i++){
      const a = (i/24)*TAU;
      const tx = clamp(px + Math.cos(a)*26, 14, WORLD.w-14);
      const ty = clamp(py + Math.sin(a)*26, 14, WORLD.h-14);
      if (!wallAt(tx, ty, 6)){ px = tx; py = ty; break; }
    }
  }
  pickups.push({ x: px, y: py, kind, vx: rand(-20,20), vy: rand(-20,20), age: 0 });
}

function updatePickups(dt){
  for (let i = pickups.length-1; i >= 0; i--){
    const p = pickups[i];
    p.age += dt;
    p.vx *= 0.92; p.vy *= 0.92;
    const d2 = dist2(p.x, p.y, player.x, player.y);
    const mr = player.magnet || T.magnetRadius;
    if (d2 < mr*mr){
      const d = Math.sqrt(d2) || 1;
      const pull = 220 * (1 - d/mr) + 60;
      p.vx += (player.x - p.x)/d * pull * dt * 10;
      p.vy += (player.y - p.y)/d * pull * dt * 10;
    }
    moveCircle(p, p.vx*dt, p.vy*dt, 3);
    if (d2 < 7*7){
      if (p.kind === 'sud'){ gainXP(1); SFX.pickup(); }
      else if (p.kind === 'shard'){
        META.shards++; ST.runShards++;
        SFX.plate();
      }
      else { player.hp = Math.min(player.maxhp, player.hp + 1); SFX.heart(); addFloater(player.x, player.y-12, '+1 HEART', CRIMSON); }
      pickups.splice(i,1);
    } else if (p.age > 25){
      pickups.splice(i,1);
    }
  }
}

function gainXP(n){
  player.xp += n;
  while (player.xp >= player.xpNext){
    player.xp -= player.xpNext;
    player.level++;
    player.xpNext = Math.round(player.xpNext * 1.35 + 2);
    ST.levelQueue++;
  }
  if (ST.levelQueue > 0 && ST.mode === 'play') openLevelUp();
}

function openLevelUp(){
  ST.levelQueue--;
  ST.mode = 'levelup';
  const pool = CARDS.filter(c => !(c.max && c.max(player.gun)));
  const picks = [];
  while (picks.length < 3 && pool.length){
    const c = pool.splice(Math.floor(Math.random()*pool.length), 1)[0];
    picks.push(c);
  }
  ST.cards = picks;
  SFX.levelup();
}

function chooseCard(i){
  const c = ST.cards[i];
  if (!c) return;
  c.apply(player.gun);
  player.upgrades++;
  SFX.click();
  evolveGun();          // climbs the ladder of guns you own
  ST.cards = [];
  if (ST.levelQueue > 0) openLevelUp();
  else ST.mode = 'play';
}

function clickCard(x, y){
  const cw = 108, chh = 84, gap = 16;
  const total = 3*cw + 2*gap;
  const x0 = (W - total)/2, y0 = (H - chh)/2 + 8;
  for (let i=0;i<3;i++){
    const cxr = x0 + i*(cw+gap);
    if (x >= cxr && x <= cxr+cw && y >= y0 && y <= y0+chh){ chooseCard(i); return; }
  }
}

// ================================================================
// PLAYER
// ================================================================
function updatePlayer(dt){
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup']) my--;
  if (keys['s'] || keys['arrowdown']) my++;
  if (keys['a'] || keys['arrowleft']) mx--;
  if (keys['d'] || keys['arrowright']) mx++;
  if (usingTouch && touch.active){
    const mag = Math.hypot(touch.dx, touch.dy);
    if (mag > 6){ mx = touch.dx/mag; my = touch.dy/mag; }
  }
  const mag = Math.hypot(mx, my);
  if (mag > 0){ mx /= mag; my /= mag; }
  // hot oil underfoot: you keep moving, you just stop being quick about it
  const slick = onSlick(player.x, player.y);
  const sp = T.playerSpeed * player.speedMul * (slick ? T.slickSlow : 1);
  if (slick && mag > 0 && Math.random() < 0.25)
    spawnParts(player.x, player.y + 6, 1, '#c79a24', 18);
  // his own collision box is small — he floats, and a big box would snag
  // on every doorway in the kitchen
  moveCircle(player, mx*sp*dt, my*sp*dt, 6);
  player.moving = mag > 0;
  // face the way he's aiming, with a dead zone so he doesn't flicker near vertical
  const ax = Math.cos(player.aim);
  if (ax > 0.12) player.face = 1; else if (ax < -0.12) player.face = -1;
  player.iframe = Math.max(0, player.iframe - dt);
  player.flash = Math.max(0, player.flash - dt);
  player.recoil = Math.max(0, player.recoil - dt);
  player.whistling = Math.max(0, player.whistling - dt);

  firePlayerGun(dt);

  // enemy bullets vs player (tiny core hitbox)
  if (player.iframe <= 0){
    const cr = T.coreRadius;
    for (let i = ebullets.length-1; i >= 0; i--){
      const b = ebullets[i];
      const br = b.kind === 'plate' ? 3 : b.kind === 'bubble' ? 2.5 : b.kind === 'steam' ? 4
               : b.kind === 'glob' ? 2.5 : b.kind === 'toast' ? 2.5 : 2;
      if (dist2(b.x, b.y, player.x, player.y) < (cr+br)*(cr+br)){
        ebullets.splice(i,1);
        hurtPlayer(1);
        break;
      }
    }
  }
  // enemy contact
  if (player.iframe <= 0){
    for (const e of enemies){
      if (dist2(e.x, e.y, player.x, player.y) < (e.r + T.bodyRadius)*(e.r + T.bodyRadius)){
        hurtPlayer(e.touch);
        // knockback away from the enemy
        const a = Math.atan2(player.y - e.y, player.x - e.x);
        moveCircle(player, Math.cos(a)*14, Math.sin(a)*14, 6);
        break;
      }
    }
  }
}

function hurtPlayer(dmg){
  player.hp -= dmg;
  player.iframe = player.mercy || T.iframes;
  player.flash = 0.25;
  ST.shake = Math.min(8, ST.shake + 5);
  ST.flashRed = 0.25;
  SFX.hurt();
  spawnParts(player.x, player.y, 10, CRIMSON, 80);
  if (player.hp <= 0){
    player.hp = 0;
    spawnParts(player.x, player.y, 40, CRIMSON, 120);
    spawnParts(player.x, player.y, 20, '#f0c090', 90);
    endRun();
  }
}

// player bullets vs enemies
function collidePlayerBullets(){
  for (let i = pbullets.length-1; i >= 0; i--){
    const b = pbullets[i];
    const br = (b.shot === 'saw' ? 5 : b.shot === 'dude' ? (b.limp ? 5 : 15) : 2.5) * b.size;
    let hit = false;
    for (const e of enemies){
      if (b.hitList && b.hitList.indexOf(e) >= 0) continue;
      if (dist2(b.x, b.y, e.x, e.y) < (e.r+br)*(e.r+br)){
        // the ones that go off don't bite, they detonate on whatever they touch
        if (b.shot === 'bomb' || b.shot === 'missile'){
          boom(b.x, b.y, b.g.blast, b.dmg * b.g.bdmg,
               b.shot === 'bomb' ? '#e8d84a' : '#ff9420');
          hit = true;
          break;
        }
        damageEnemy(e, b.dmg, b.x, b.y);
        spawnParts(b.x, b.y, 3, '#f4c542', 50);
        if (b.pierce > 0){
          b.pierce--;
          (b.hitList || (b.hitList = [])).push(e);
        } else {
          hit = true;
        }
        break;
      }
    }
    if (hit) pbullets.splice(i,1);
  }
}

// ================================================================
// PARTICLES & FLOATERS
// ================================================================
function spawnParts(x, y, n, color, speed){
  for (let i=0;i<n;i++){
    if (parts.length >= T.maxParticles) parts.shift();
    const a = rand(0, TAU), s = rand(speed*0.3, speed);
    parts.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: rand(0.25, 0.6), color, size: Math.random() < 0.3 ? 2 : 1 });
  }
}
function updateParts(dt){
  for (let i = parts.length-1; i >= 0; i--){
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0){ parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.94; p.vy *= 0.94;
  }
}
function addFloater(x, y, text, color, life){
  floaters.push({ x, y, text, color, life: life || 0.7, max: life || 0.7 });
  if (floaters.length > 24) floaters.shift();
}
function updateFloaters(dt){
  for (let i = floaters.length-1; i >= 0; i--){
    const f = floaters[i];
    f.life -= dt; f.y -= 14*dt;
    if (f.life <= 0) floaters.splice(i,1);
  }
}

// ================================================================
// RENDER
// ================================================================
// ox/oy is world -> screen: the camera, plus screen shake. Setting it once
// means every world-space draw below is written in plain kitchen coordinates.
// sx0/sy0 is the shake on its own, for anything pinned to the screen.
let ox = 0, oy = 0, sx0 = 0, sy0 = 0;
function drawSpriteC(sp, x, y, scale){
  const s = scale || 1;
  cx.drawImage(sp, Math.round(x - sp.width*s/2), Math.round(y - sp.height*s/2), sp.width*s, sp.height*s);
}
// setTransform instead of save/restore: hundreds of rotated bullets per frame
function drawSpriteRot(sp, x, y, angle, scale){
  const s = scale || 1;
  cx.setTransform(1,0,0,1, ox + Math.round(x), oy + Math.round(y));
  cx.rotate(angle);
  cx.drawImage(sp, -sp.width*s/2, -sp.height*s/2, sp.width*s, sp.height*s);
  cx.setTransform(1,0,0,1, ox, oy);
}

// The guns are big enough now that rotating one past vertical would show it
// upside down. Mirror it across the barrel axis instead of letting it roll over.
function drawGunRot(sp, x, y, angle, alpha){
  const flip = Math.abs(angle) > Math.PI/2 ? -1 : 1;
  if (alpha !== undefined) cx.globalAlpha = alpha;
  cx.setTransform(1,0,0,1, ox + Math.round(x), oy + Math.round(y));
  cx.rotate(angle);
  cx.scale(1, flip);
  cx.drawImage(sp, -sp.width/2, -sp.height/2);
  cx.setTransform(1,0,0,1, ox, oy);
  if (alpha !== undefined) cx.globalAlpha = 1;
}

// Shortest signed distance between two angles, so a swing past PI doesn't
// smear the long way round the circle.
function angDelta(a, b){
  let d = a - b;
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  return d;
}

// The gun is floating on its own out there, so a fast turn should drag.
// Two ghost copies at the previous couple of aim angles, faded, only when
// the swing is big enough to be worth it.
function drawGunWithSmear(sp, cxp, cyp, gr, hov){
  const a0 = player.aim;
  const swing = Math.abs(angDelta(a0, player.aimTrail[2]));
  if (swing > 0.22){
    const ghosts = [[player.aimTrail[1], 0.30], [player.aimTrail[2], 0.16]];
    for (const [ga, al] of ghosts)
      drawGunRot(sp, cxp + Math.cos(ga)*gr, cyp + hov + Math.sin(ga)*gr, ga, al);
  }
  drawGunRot(sp, cxp + Math.cos(a0)*gr, cyp + hov + Math.sin(a0)*gr, a0);
}

// The Rinse Cannon's beam: stacked rotated bars — widest and faintest on the
// outside, white hot down the middle, with a flare where it stops.
function drawBeam(){
  if (!beamFx || ST.mode !== 'play') return;
  const f = 0.8 + Math.sin(ST.time*44)*0.2;
  const L = beamFx.len;
  cx.setTransform(1,0,0,1, ox + Math.round(beamFx.x), oy + Math.round(beamFx.y));
  cx.rotate(beamFx.ang);
  cx.fillStyle = 'rgba(47,208,255,0.18)'; cx.fillRect(0, -4.0*f, L, 8.0*f);
  cx.fillStyle = 'rgba(47,208,255,0.55)'; cx.fillRect(0, -2.2*f, L, 4.4*f);
  cx.fillStyle = '#a8f4ff';               cx.fillRect(0, -1.2,   L, 2.4);
  cx.fillStyle = '#ffffff';               cx.fillRect(0, -0.5,   L, 1.0);
  cx.fillStyle = 'rgba(255,255,255,0.85)'; cx.fillRect(L-2, -3.0*f, 4, 6.0*f);
  cx.setTransform(1,0,0,1, ox, oy);
}

// Hero animation: which pose to show, and the hover offset that sells the float.
// Which pose he is in. Ordered by what should win: being hit beats everything,
// then the whistle, then recoil, then walking, then the state of his health.
const HERO_WALK = ['float0','float1','float2','float3'];
function heroFrame(){
  if (player.flash > 0.14) return 'hurt';
  if (player.flash > 0)    return 'hit';
  if (player.whistling > 0) return Math.floor(ST.time*7) % 2 ? 'whis1' : 'whis0';
  // the kick from the gun, for a moment after each shot
  if (player.recoil > 0.06) return 'shoot1';
  if (player.recoil > 0)    return 'shoot0';
  if (player.moving) return HERO_WALK[Math.floor(ST.time*11) % 4];
  if (player.hp <= 2)  return Math.floor(ST.time*8) % 2 ? 'panic1' : 'panic';
  return Math.floor(ST.time*2.2) % 2 ? 'idle1' : 'idle0';
}
function heroHover(key){
  if (key === 'hit' || key === 'hurt') return 0;
  // he rides higher and faster when he is moving, and drifts when he is not
  const base = Math.sin(ST.time * (player.moving ? 5.5 : 3.2)) * (player.moving ? 0.9 : 1.4);
  // a shot pushes him down into his own recoil
  return base + (player.recoil > 0 ? 1.2 * (player.recoil / 0.13) : 0);
}
function drawHero(key, x, y, face, hover, flash){
  const sp = flash ? HERO_FLASH[key] : HERO[key];
  cx.setTransform(face, 0, 0, 1, ox + Math.round(x), oy + Math.round(y + hover));
  cx.drawImage(sp, -sp.width/2, -sp.height/2);
  cx.setTransform(1, 0, 0, 1, ox, oy);
}

function render(){
  sx0 = 0; sy0 = 0;
  if (ST.shake > 0.1){
    sx0 = Math.round(rand(-ST.shake, ST.shake)*0.5);
    sy0 = Math.round(rand(-ST.shake, ST.shake)*0.5);
  }
  cx.setTransform(1,0,0,1,0,0);
  cx.clearRect(0,0,W,H);

  if (ST.mode === 'menu'){ renderMenu(); return; }
  if (ST.mode === 'help'){ renderHelp(); return; }
  if (ST.mode === 'story'){ renderStory(); return; }
  if (ST.mode === 'store'){ renderStore(); return; }

  const camX = Math.round(cam.x), camY = Math.round(cam.y);
  ox = -camX + sx0; oy = -camY + sy0;
  cx.setTransform(1,0,0,1, ox, oy);

  // only blit the slice of the kitchen you can actually see
  const bx = clamp(camX-8, 0, WORLD.w-1), by = clamp(camY-8, 0, WORLD.h-1);
  const bw = Math.min(W+16, WORLD.w-bx), bh = Math.min(H+16, WORLD.h-by);
  cx.drawImage(bg, bx, by, bw, bh, bx, by, bw, bh);

  // pickups
  for (const p of pickups){
    const bob = Math.sin((ST.time + p.x) * 4) * 1.5;
    drawSpriteC(p.kind === 'sud' ? SP.sud : (p.kind === 'shard' ? SP.shard : SP.heart),
                p.x, p.y + bob);
  }

  // enemies
  for (const e of enemies){
    let sp = SP[e.type], scale = 1;
    if (e.elite && SP[e.type+'_elite']){ sp = SP[e.type+'_elite']; scale = 1.15; }
    if (isBoss(e)) scale = 2;
    let wob = Math.sin(ST.time*6 + e.t2) * 1;
    // a kettle at the boil rattles and flashes faster the closer it gets
    if (e.type === 'kettle' && e.armed){
      wob = rand(-2.5, 2.5);
      const f = 1 - e.fuse / T.kettleFuse;
      cx.globalAlpha = 0.25 + f*0.45;
      cx.strokeStyle = '#e0563a'; cx.lineWidth = 1;
      cx.beginPath(); cx.arc(e.x, e.y, T.kettleBlast * (0.4 + f*0.6), 0, TAU); cx.stroke();
      cx.globalAlpha = 1;
    }
    // the microwave shows you the line before it burns it
    if (e.type === 'micro' && (e.wind > 0 || e.beam > 0)){
      const a = e.beamA || 0;
      const len = e.beam > 0 ? (e.beamLen || 0) : rayWall(e.x, e.y, Math.cos(a), Math.sin(a), 340);
      if (e.beam > 0){
        cx.globalAlpha = 0.85;
        cx.strokeStyle = '#6ad07a'; cx.lineWidth = 5;
        cx.beginPath(); cx.moveTo(e.x, e.y); cx.lineTo(e.x+Math.cos(a)*len, e.y+Math.sin(a)*len); cx.stroke();
        cx.strokeStyle = '#dfffe4'; cx.lineWidth = 2;
        cx.beginPath(); cx.moveTo(e.x, e.y); cx.lineTo(e.x+Math.cos(a)*len, e.y+Math.sin(a)*len); cx.stroke();
      } else {
        cx.globalAlpha = 0.30 + Math.sin(ST.time*26)*0.18;
        cx.strokeStyle = '#6ad07a'; cx.lineWidth = 1;
        cx.beginPath(); cx.moveTo(e.x, e.y); cx.lineTo(e.x+Math.cos(a)*len, e.y+Math.sin(a)*len); cx.stroke();
      }
      cx.globalAlpha = 1;
    }
    // the Six Burner's flame arms, drawn from the boss outward
    if (e.type === 'bburner' && e.flameArms){
      for (let k=0;k<e.flameArms;k++){
        const a = e.sweep + k*TAU/e.flameArms;
        const ux = Math.cos(a), uy = Math.sin(a);
        const len = rayWall(e.x, e.y, ux, uy, 190);
        cx.globalAlpha = 0.85;
        cx.strokeStyle = '#b8321f'; cx.lineWidth = 7;
        cx.beginPath(); cx.moveTo(e.x+ux*12, e.y+uy*12);
        cx.lineTo(e.x+ux*len, e.y+uy*len); cx.stroke();
        cx.strokeStyle = '#e0563a'; cx.lineWidth = 4;
        cx.beginPath(); cx.moveTo(e.x+ux*12, e.y+uy*12);
        cx.lineTo(e.x+ux*len, e.y+uy*len); cx.stroke();
        cx.strokeStyle = '#ffd070'; cx.lineWidth = 1.5;
        cx.beginPath(); cx.moveTo(e.x+ux*12, e.y+uy*12);
        cx.lineTo(e.x+ux*len, e.y+uy*len); cx.stroke();
        cx.globalAlpha = 1;
      }
    }
    // the Head Chef winds up before a dash, same read as a scrubber
    if (e.type === 'bchef' && e.wind > 0){
      const a = e.dashA || 0;
      cx.globalAlpha = 0.35 + Math.sin(ST.time*30)*0.2;
      cx.strokeStyle = CRIMSON; cx.lineWidth = 2;
      cx.beginPath();
      cx.moveTo(e.x + Math.cos(a)*20, e.y + Math.sin(a)*20);
      cx.lineTo(e.x + Math.cos(a)*200, e.y + Math.sin(a)*200);
      cx.stroke(); cx.globalAlpha = 1;
    }
    // a mixer pulling shows the drag as rings closing on it
    if (e.type === 'mixer'){
      const ph = (ST.time*0.9) % 1;
      cx.globalAlpha = (1-ph) * 0.30;
      cx.strokeStyle = '#b9c2cf'; cx.lineWidth = 1;
      cx.beginPath(); cx.arc(e.x, e.y, T.mixerRange * ph, 0, TAU); cx.stroke();
      cx.globalAlpha = 1;
    }
    // a scrubber winding up shakes hard, and draws the line it is about to
    // take — you get half a second to not be standing on it
    if (e.type === 'scrubber' && e.st === 'wind'){
      wob = rand(-2, 2);
      const a = e.dashA || 0;
      cx.globalAlpha = 0.35 + Math.sin(ST.time*30)*0.2;
      cx.strokeStyle = CRIMSON; cx.lineWidth = 1;
      cx.beginPath();
      cx.moveTo(e.x + Math.cos(a)*14, e.y + Math.sin(a)*14);
      cx.lineTo(e.x + Math.cos(a)*150, e.y + Math.sin(a)*150);
      cx.stroke();
      cx.globalAlpha = 1;
    }
    drawSpriteC(sp, e.x + (e.type === 'scrubber' && e.st === 'wind' ? wob : 0),
                e.y + wob*0.4, scale);
    if (e.flash > 0){
      cx.globalAlpha = 0.85;
      drawSpriteC(SP[e.type+'_flash'], e.x, e.y + wob*0.4, scale);
      cx.globalAlpha = 1;
    }
    // the plate stack rides in front, turned whichever way it is facing
    if (e.shield)
      drawSpriteRot(SP.shield, e.x + Math.cos(e.face)*12, e.y + Math.sin(e.face)*12, e.face);
    // small hp bar for elites
    if (e.elite && e.hp < e.maxhp){
      const w2 = 14;
      cx.fillStyle = '#101018'; cx.fillRect(e.x-w2/2, e.y-13, w2, 2);
      cx.fillStyle = '#ffc02a'; cx.fillRect(e.x-w2/2, e.y-13, w2 * (e.hp/e.maxhp), 2);
    }
  }

  // player (blink during iframes)
  const blink = player.iframe > 0 && Math.floor(ST.time*14) % 2 === 0;
  if (ST.mode === 'over'){
    drawHero('dead', player.x, player.y + 4, player.face, 0);
  } else if (!blink){
    const key = heroFrame();
    const hov = heroHover(key);
    drawHero(key, player.x, player.y, player.face, hov);
    // the gun isn't held — it floats out at arm's length and bobs on its own
    const gun = GUNS[player.gunIdx];
    const gr = gunRadius(gun) + Math.sin(ST.time*5.5)*0.9;
    drawGunWithSmear(SP[gun.sp], player.x, player.y, gr, hov);
    // the Lance winding up: a ring closing around the muzzle, white when full
    if (gun.charge && player.charge > 0.02){
      const f = clamp(player.charge / gun.windup, 0, 1);
      // gr is where the middle of the gun floats — push out to the barrel tip
      const tip = gr + SP[gun.sp].width*0.42;
      const mx = player.x + Math.cos(player.aim)*tip, my = player.y + hov + Math.sin(player.aim)*tip;
      cx.strokeStyle = f >= 1 ? '#ffffff' : '#f4a020';
      cx.lineWidth = f >= 1 ? 2 : 1.5;
      cx.beginPath();
      cx.arc(mx, my, 11 - f*4, -Math.PI/2, -Math.PI/2 + TAU*f);
      cx.stroke();
      if (f >= 1 && Math.random() < 0.5) spawnParts(mx, my, 1, '#ffe8b0', 40);
    }
    if (player.flash > 0){
      cx.globalAlpha = 0.7;
      drawHero(key, player.x, player.y, player.face, hov, true);
      cx.globalAlpha = 1;
    }
  }

  // spare barrels, circling and aiming for themselves
  for (const o of orbs){
    const b = Math.sin(ST.time*6 + o.ang)*1.1;
    drawGunRot(SP.gunA, o.x, o.y + b, o.aim || 0);
  }

  drawBeam();

  // oil slicks, under everything else because you walk through them
  for (const s of slicks){
    cx.globalAlpha = Math.min(1, s.t / 1.5) * 0.55;
    cx.fillStyle = '#2a2410';
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, TAU); cx.fill();
    cx.fillStyle = '#6b5a18';
    cx.beginPath(); cx.arc(s.x - s.r*0.2, s.y - s.r*0.2, s.r*0.45, 0, TAU); cx.fill();
    cx.globalAlpha = 1;
  }

  // player bullets — each gun throws something different
  for (const b of pbullets){
    if (b.shot === 'disc')         drawSpriteRot(SP.pdisc, b.x, b.y, b.ang + ST.time*14, b.size);
    else if (b.shot === 'foam')    drawSpriteC(SP.foam, b.x, b.y, b.size);
    else if (b.shot === 'mega')    drawSpriteRot(SP.mslug, b.x, b.y, b.ang, b.size);
    else if (b.shot === 'missile') drawSpriteRot(SP.missile, b.x, b.y, b.ang, b.size);
    else if (b.shot === 'bomb')    drawSpriteRot(SP.bomb, b.x, b.y, b.spin, b.size);
    else if (b.shot === 'saw')     drawSpriteRot(SP.saw, b.x, b.y, b.spin, b.size);
    else if (b.shot === 'bolt')    drawSpriteRot(SP.bolt, b.x, b.y, b.ang, b.size);
    else if (b.shot === 'dude')    drawSpriteRot(b.limp ? SP.weak : SP.buff, b.x, b.y, b.ang + (b.wob||0), b.size);
    else                           drawSpriteRot(SP.slug, b.x, b.y, b.ang, b.size);
  }

  // blast rings — one quick expanding circle per bang
  for (const bl of blasts){
    const f = 1 - bl.t/bl.max;
    cx.globalAlpha = (1-f) * 0.9;
    cx.strokeStyle = bl.color;
    cx.lineWidth = 2;
    cx.beginPath();
    cx.arc(bl.x, bl.y, bl.r * (0.35 + f*0.75), 0, TAU);
    cx.stroke();
    cx.globalAlpha = 1;
  }

  // the Arc Welder's bolt: a jagged line through everything it touched
  if (arcFx){
    const f = arcFx.t / 0.13;
    for (const [wide, col] of [[3.4, '#c89bff'], [1.4, '#f2e6ff']]){
      cx.globalAlpha = f;
      cx.strokeStyle = col;
      cx.lineWidth = wide;
      cx.beginPath();
      for (let i=1;i<arcFx.pts.length;i++){
        const [x0,y0] = arcFx.pts[i-1], [x1,y1] = arcFx.pts[i];
        cx.moveTo(x0, y0);
        // three kinked segments per hop, jittered off the straight line
        for (let s=1;s<=3;s++){
          const t = s/3, j = s < 3 ? rand(-4,4) : 0;
          cx.lineTo(x0 + (x1-x0)*t - (y1-y0)*0.02*j, y0 + (y1-y0)*t + (x1-x0)*0.02*j);
        }
      }
      cx.stroke();
    }
    cx.globalAlpha = 1;
  }

  // enemy bullets
  for (const b of ebullets){
    if (b.kind === 'plate') drawSpriteRot(SP.plate, b.x, b.y, b.spin);
    else if (b.kind === 'fork') drawSpriteRot(SP.fork, b.x, b.y, b.ang);
    else if (b.kind === 'toast') drawSpriteRot(SP.toast, b.x, b.y, b.spin);
    else if (b.kind === 'glob')  drawSpriteC(SP.glob, b.x, b.y);
    else if (b.kind === 'knife') drawSpriteRot(SP.knife, b.x, b.y, b.ang);
    else if (b.kind === 'steam'){
      // swells as it drifts and thins out as it dies
      cx.globalAlpha = clamp(Math.min(b.age*3, (2.4 - b.age)*1.6), 0, 1) * 0.8;
      drawSpriteC(SP.steam, b.x, b.y, 0.7 + b.age*0.45);
      cx.globalAlpha = 1;
    }
    else {
      const puls = 1 + Math.sin(b.age*8)*0.15;
      drawSpriteC(SP.bubble, b.x, b.y, puls);
    }
  }

  // particles
  for (const p of parts){
    cx.globalAlpha = clamp(p.life*3, 0, 1);
    cx.fillStyle = p.color;
    cx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
  }
  cx.globalAlpha = 1;

  // floaters
  for (const f of floaters){
    cx.globalAlpha = clamp(f.life / f.max, 0, 1);
    drawText(f.text, Math.round(f.x), Math.round(f.y), 1, f.color, 'center');
  }
  cx.globalAlpha = 1;

  // everything from here on is pinned to the screen, not the kitchen
  cx.setTransform(1,0,0,1,0,0);
  renderOffscreenMarkers();
  renderHUD();
  if (ST.tut) renderTutorial();

  // red hurt vignette
  if (ST.flashRed > 0){
    cx.globalAlpha = ST.flashRed * 1.4;
    cx.fillStyle = CRIMSON;
    cx.fillRect(0,0,W,3); cx.fillRect(0,H-3,W,3);
    cx.fillRect(0,0,3,H); cx.fillRect(W-3,0,3,H);
    cx.globalAlpha = 1;
  }

  if (ST.mode === 'levelup') renderLevelUp();
  if (ST.mode === 'pause') renderPause();
  if (ST.mode === 'over') renderGameOver();
}

function renderHUD(){
  // hearts
  for (let i=0;i<player.maxhp;i++){
    const x = 10 + i*9, y = 8;
    if (i < player.hp) drawSpriteC(SP.heart, x, y);
    else {
      cx.globalAlpha = 0.25;
      drawSpriteC(SP.heart, x, y);
      cx.globalAlpha = 1;
    }
  }
  // wave
  const label = boss ? (BOSS_NAME[boss.type] || 'BOSS')
                     : (ST.wave > 0 ? 'WAVE ' + ST.wave : '');
  if (label) drawText(label, W/2, 6, 1, boss ? CRIMSON : '#dfe3ea', 'center');
  // boss hp bar
  if (boss){
    const bw = 140;
    cx.fillStyle = '#101018'; cx.fillRect(W/2-bw/2, 14, bw, 4);
    cx.fillStyle = CRIMSON; cx.fillRect(W/2-bw/2, 14, bw * clamp(boss.hp/boss.maxhp,0,1), 4);
  }
  // kills + time + level
  const mm = Math.floor(ST.playTime/60), ss = Math.floor(ST.playTime%60);
  drawText(String(ST.kills) + ' KO', W-8, 6, 1, '#dfe3ea', 'right');
  drawText((mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss, W-8, 14, 1, '#7a7a8e', 'right');
  drawText('LV ' + player.level, W-8, 22, 1, '#79c7f0', 'right');
  // shards banked this run
  drawSpriteC(SP.shard, W-72, 33);
  drawText(String(ST.runShards||0), W-8, 30, 1, '#dfe3ea', 'right');
  // xp bar
  cx.fillStyle = '#101018'; cx.fillRect(0, H-4, W, 4);
  cx.fillStyle = '#79c7f0'; cx.fillRect(0, H-4, W * clamp(player.xp/player.xpNext, 0, 1), 4);
  // gun name, and how many spare barrels are out
  drawText(player.gunName, 8, H-13, 1, '#f4c542');
  if (player.orbs) drawText('+' + player.orbs + ' BARREL' + (player.orbs > 1 ? 'S' : ''), 8, H-22, 1, '#7a7a8e');
  renderMinimap();
  // where you are — fades in when you walk into a new part of the kitchen
  if (ST.zoneTimer > 0){
    cx.globalAlpha = clamp(ST.zoneTimer, 0, 1) * 0.9;
    drawText(ST.zone, W/2, 34, 1, '#8d93a4', 'center');

// The kitchen is nine screens big, so you get a map of it. Walls, whatever
// is alive, the pickups you left behind, and a box showing what you can see.
const MM = { w: 78, h: 44 };
function renderMinimap(){
  const x0 = W - MM.w - 6, y0 = H - MM.h - 10;
  const s = MM.w / WORLD.w;
  cx.globalAlpha = 0.72;
  cx.fillStyle = '#0b0b10'; cx.fillRect(x0, y0, MM.w, MM.h);
  cx.fillStyle = '#1c1c26';
  for (const w of WALLS)
    cx.fillRect(x0 + w.x*s, y0 + w.y*s, Math.max(1, w.w*s), Math.max(1, w.h*s));
  cx.globalAlpha = 1;
  for (const p of pickups){
    cx.fillStyle = p.kind === 'sud' ? '#3f6f96' : '#7d2233';
    cx.fillRect(x0 + p.x*s, y0 + p.y*s, 1, 1);
  }
  for (const e of enemies){
    const big = isBoss(e);
    cx.fillStyle = big ? CRIMSON : (e.elite ? '#ffc02a' : '#c4545f');
    cx.fillRect(x0 + e.x*s - (big?1:0), y0 + e.y*s - (big?1:0), big?3:1, big?3:1);
  }
  // what's on screen right now
  cx.strokeStyle = 'rgba(223,227,234,0.35)'; cx.lineWidth = 1;
  cx.strokeRect(Math.round(x0 + cam.x*s)+0.5, Math.round(y0 + cam.y*s)+0.5,
                Math.round(W*s), Math.round(H*s));
  cx.fillStyle = '#ffffff';
  cx.fillRect(Math.round(x0 + player.x*s)-1, Math.round(y0 + player.y*s)-1, 2, 2);
  cx.strokeStyle = '#2a2a36';
  cx.strokeRect(x0+0.5, y0+0.5, MM.w-1, MM.h-1);
}

// Little chevrons at the edge of the screen for things you can't see yet.
function renderOffscreenMarkers(){
  if (ST.mode !== 'play') return;
  let shown = 0;
  for (const e of enemies){
    if (shown >= 8) break;
    if (inView(e.x, e.y, 12)) continue;
    const dx = e.x - (cam.x + W/2), dy = e.y - (cam.y + H/2);
    const a = Math.atan2(dy, dx);
    // push out to the screen edge along the aim, then pull back inside
    const t = Math.min(Math.abs((W/2 - 14) / (Math.cos(a) || 1e-6)),
                       Math.abs((H/2 - 14) / (Math.sin(a) || 1e-6)));
    const mx = W/2 + Math.cos(a)*t, my = H/2 + Math.sin(a)*t;
    const col = isBoss(e) ? CRIMSON : (e.elite ? '#ffc02a' : 'rgba(196,84,95,0.75)');
    cx.setTransform(1,0,0,1, Math.round(mx), Math.round(my));
    cx.rotate(a);
    cx.fillStyle = col;
    cx.fillRect(0,-1,4,2); cx.fillRect(-2,-3,2,6);
    cx.setTransform(1,0,0,1,0,0);
    shown++;
  }
}

// the hero rig draws relative to ox/oy like everything else in the world,
// so the title screen zeroes those out before borrowing him
function drawHeroStatic(key, x, y, face, hover){
  const sp = HERO[key];
  cx.setTransform(face, 0, 0, 1, Math.round(x), Math.round(y + hover));
  cx.drawImage(sp, -sp.width/2, -sp.height/2);
  cx.setTransform(1,0,0,1,0,0);
}

function renderSlides(x, y, w, h){
  const n = SLIDES.length;
  const k = ST.time / SLIDE_TIME;
  const i = Math.floor(k) % n;
  const f = (k - Math.floor(k)) * SLIDE_TIME;
  const alpha = clamp(Math.min(f, SLIDE_TIME - f) / SLIDE_FADE, 0, 1);
  const s = SLIDES[i];

  cx.fillStyle = '#0a0a10'; cx.fillRect(x-2, y-2, w+4, h+4);
  cx.save();
  cx.beginPath(); cx.rect(x, y, w, h); cx.clip();
  cx.fillStyle = '#0e0e16'; cx.fillRect(x, y, w, h);
  cx.globalAlpha = alpha;
  if (s.img && s.img.complete && s.img.naturalWidth){
    const sc = Math.min(w/s.img.naturalWidth, h/s.img.naturalHeight);
    const iw = s.img.naturalWidth*sc, ih = s.img.naturalHeight*sc;
    cx.drawImage(s.img, x + (w-iw)/2, y + (h-ih)/2, iw, ih);
  } else if (s.draw){
    ox = 0; oy = 0;                     // slides borrow the world draw helpers
    s.draw(x, y, w, h, ST.time);
    cx.setTransform(1,0,0,1,0,0);
  }
  cx.globalAlpha = 1;
  cx.restore();

  // caption strip along the bottom of the panel
  cx.fillStyle = 'rgba(8,8,13,0.82)'; cx.fillRect(x, y+h-13, w, 13);
  cx.globalAlpha = alpha;
  drawText(s.cap, x + w/2, y + h - 9, 1, '#dfe3ea', 'center');
  cx.globalAlpha = 1;
  cx.strokeStyle = '#2c2c3a'; cx.lineWidth = 2;
  cx.strokeRect(x-1, y-1, w+2, h+2);
  // which slide you are on
  for (let d=0; d<n; d++){
    cx.fillStyle = d === i ? '#f4c542' : '#33333f';
    cx.fillRect(Math.round(x + w/2 - (n*6)/2 + d*6), y + h + 5, 3, 3);
  }
}

// waits for you to do a thing or waits out a clock, so there is no
// step anybody can get stuck on. Nothing here can kill you.
// Note for anything drawn on screen: the pixel font has no
// apostrophe, so all of this copy is written without one.
