<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YCZ Lite — Yuniors Chill Zone</title>
<link rel="icon" type="image/png" href="favicon.png">
<!-- ═══════════════════════════════════════════════════════════════════
     YCZ LITE — the museum edition, for PS Vita and other ancient browsers.
     Rules of this file: ES5 only (no arrow functions, no let/const, no
     template literals, no fetch, no promises), CSS that 2012 WebKit
     understands, XHR polling instead of realtime, no heavy assets.
     It talks to the same Supabase REST API as the real chat, so messages
     land in the real #global and friends. Keep it dumb forever.
     ═══════════════════════════════════════════════════════════════════ -->
<style>
body{margin:0;padding:0;background:#0d0c11;color:#eeeeee;font-family:Verdana,Arial,sans-serif;font-size:14px;}
#top{background:#1c1a21;padding:8px 10px;border-bottom:2px solid #e10600;}
#top b{color:#ffffff;font-size:16px;}
#top span{color:#999999;font-size:11px;}
.box{margin:10px;padding:10px;background:#16151b;border:1px solid #333333;}
label{display:block;margin:6px 0 2px 0;color:#aaaaaa;font-size:12px;}
input[type=email],input[type=password],input[type=text],select{
  width:95%;padding:6px;background:#0d0c11;color:#eeeeee;border:1px solid #444444;font-size:14px;}
button{padding:7px 14px;background:#e10600;color:#ffffff;border:0;font-weight:bold;font-size:14px;margin-top:8px;}
button.gray{background:#333333;}
#msgs{margin:10px;}
.m{padding:6px 8px;border-bottom:1px solid #26242c;}
.m .u{color:#ff8b7f;font-weight:bold;}
.m .t{color:#777777;font-size:10px;margin-left:6px;}
.m .x{display:block;margin-top:2px;word-wrap:break-word;}
#status{margin:0 10px;color:#888888;font-size:11px;}
#err{margin:0 10px;color:#ff6655;font-size:12px;}
#sendrow{margin:10px;}
#sendrow input{width:70%;}
#sendrow button{margin-top:0;}
a{color:#7fd4ff;}
</style>
</head>
<body>
<div id="top"><b>YUNIORS CHILL ZONE</b> <span>lite edition — for retro browsers</span></div>

<div class="box" id="login-box">
  <label>Email</label><input type="email" id="em">
  <label>Password</label><input type="password" id="pw">
  <button id="b-login">Sign in</button>
  <div id="err"></div>
</div>

<div id="chat" style="display:none;">
  <div class="box">
    <label>Channel</label>
    <select id="room">
      <option value="global">#global</option>
      <option value="gaming">#gaming</option>
      <option value="music">#music</option>
      <option value="random">#random</option>
      <option value="offtopic">#offtopic</option>
    </select>
    <button class="gray" id="b-out" style="float:right;">Sign out</button>
    <div style="clear:both;"></div>
  </div>
  <div id="msgs"></div>
  <div id="sendrow">
    <input type="text" id="txt" maxlength="500">
    <button id="b-send">Send</button>
  </div>
  <div id="status"></div>
</div>

<script>
var SB='https://heohcnhgclcnmssjklom.supabase.co';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhlb2hjbmhnY2xjbm1zc2prbG9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAxNDg2NDAsImV4cCI6MjA4NTcyNDY0MH0.Y73DbstnhKAI2IvPcMrL_mtIObmeOQj-rgY0XtdE200';
var token=null,uid=null,uname='you',timer=null,lastPaint='';

function $(id){return document.getElementById(id);}
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function req(method,path,body,auth,cb){
  var x=new XMLHttpRequest();
  x.open(method,SB+path,true);
  x.setRequestHeader('apikey',KEY);
  x.setRequestHeader('Content-Type','application/json');
  if(auth&&token)x.setRequestHeader('Authorization','Bearer '+token);
  if(method==='POST'&&path.indexOf('/rest/')===0)x.setRequestHeader('Prefer','return=minimal');
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    var data=null;
    try{data=x.responseText?JSON.parse(x.responseText):null;}catch(e){}
    cb(x.status,data);
  };
  x.send(body?JSON.stringify(body):null);
}

function login(){
  $('err').innerHTML='';
  req('POST','/auth/v1/token?grant_type=password',
    {email:$('em').value,password:$('pw').value},false,
    function(st,d){
      if(st!==200||!d||!d.access_token){
        $('err').innerHTML='Sign in failed'+(d&&d.error_description?': '+esc(d.error_description):'');
        return;
      }
      token=d.access_token;uid=d.user.id;
      req('GET','/rest/v1/user_profiles?user_id=eq.'+uid+'&select=username',null,true,
        function(st2,rows){
          if(st2===200&&rows&&rows.length&&rows[0].username)uname=rows[0].username;
          else if(d.user.email)uname=d.user.email.split('@')[0];
          $('login-box').style.display='none';
          $('chat').style.display='block';
          poll();
          timer=setInterval(poll,5000);
        });
    });
}
function logout(){
  token=null;uid=null;
  if(timer){clearInterval(timer);timer=null;}
  $('chat').style.display='none';
  $('login-box').style.display='block';
}
function poll(){
  if(!token)return;
  var room=$('room').value;
  req('GET','/rest/v1/messages?room_id=eq.'+room+
    '&select=username,text,image_url,created_at&order=created_at.desc&limit=40',
    null,true,
    function(st,rows){
      if(st===401){logout();$('err').innerHTML='Session expired — sign in again';return;}
      if(st!==200||!rows){$('status').innerHTML='Could not load messages ('+st+')';return;}
      rows.reverse();
      var h='';
      for(var i=0;i<rows.length;i++){
        var r=rows[i];
        var when=String(r.created_at||'').replace('T',' ').substring(5,16);
        var body=r.text?esc(r.text):(r.image_url?'[image — needs the full site]':'');
        h+='<div class="m"><span class="u">'+esc(r.username||'?')+'</span>'+
           '<span class="t">'+esc(when)+'</span><span class="x">'+body+'</span></div>';
      }
      if(h!==lastPaint){
        lastPaint=h;
        $('msgs').innerHTML=h||'<div class="m">Nothing here yet.</div>';
        window.scrollTo(0,document.body.scrollHeight);
      }
      $('status').innerHTML='Connected as '+esc(uname)+' — refreshes every 5s';
    });
}
function send(){
  var t=$('txt').value;
  if(!t||!token)return;
  $('txt').value='';
  req('POST','/rest/v1/messages',
    {text:t,username:uname,room_id:$('room').value,user_id:uid,is_owner:false,
     created_at:new Date().toISOString()},true,
    function(st){
      if(st>=200&&st<300){poll();}
      else $('status').innerHTML='Send failed ('+st+') — channel may be locked or slowmode';
    });
}

$('b-login').onclick=login;
$('b-out').onclick=logout;
$('b-send').onclick=send;
$('room').onchange=function(){lastPaint='';$('msgs').innerHTML='';poll();};
$('txt').onkeypress=function(e){
  var k=e?e.keyCode:window.event.keyCode;
  if(k===13)send();
};
$('pw').onkeypress=function(e){
  var k=e?e.keyCode:window.event.keyCode;
  if(k===13)login();
};
</script>
</body>
</html>
