<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Da Gaming Zone — Yuniors Chill Zone</title>
  <meta name="description" content="The Yuniors Chill Zone console — every game in one place, no downloads.">
  <link rel="icon" href="favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
  /* ═══════════════════════════════════════════════════════════════
     THE CONSOLE
     A big-picture launcher: one wide hero for whatever is selected,
     portrait capsules for everything else, and games that open right
     here instead of sending you somewhere.

     Every class and id here starts with gz, and so does every custom
     property, so the shared stylesheet — which loads after this block
     and leans on !important — has nothing of ours it can reach.
     ═══════════════════════════════════════════════════════════════ */

  /* These live on :root, not on #gz. The game layer, the guide and the
     settings sheet all sit outside #gz in the markup, and a variable
     defined on #gz would simply not reach them — which is exactly the
     bug that left the guide with no card behind it. Everything is
     prefixed gz- so nothing collides with the shared stylesheet. */
  :root{
    /* dark is the console's home state — see the light block below */
    --gz-ink:#ffffff; --gz-ink2:#a8adbd; --gz-ink3:#6a6f80;
    --gz-panel:rgba(18,20,28,.92); --gz-panel2:rgba(28,31,42,.95);
    --gz-line:rgba(255,255,255,.10); --gz-line2:rgba(255,255,255,.22);
    --gz-deep:#07080c; --gz-deep2:#0d0f15;
    --gz-glow:rgba(255,255,255,.06);
    --gz-accent:#e8162a;              /* replaced per-game at runtime */
    --gz-shadow:0 24px 60px rgba(0,0,0,.6);
  }
  :root[data-theme="light"]{
    --gz-ink:#12141c; --gz-ink2:#4a4f60; --gz-ink3:#868c9e;
    --gz-panel:rgba(255,255,255,.94); --gz-panel2:rgba(244,245,249,.97);
    --gz-line:rgba(0,0,0,.10); --gz-line2:rgba(0,0,0,.22);
    --gz-deep:#eceef4; --gz-deep2:#f6f7fb;
    --gz-glow:rgba(0,0,0,.04);
    --gz-shadow:0 24px 60px rgba(0,0,0,.18);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#07080c; color:#fff;
    overflow:hidden;                     /* the console never scrolls the page */
    -webkit-font-smoothing:antialiased;
  }
  #gz ::-webkit-scrollbar{height:6px;width:6px;}
  #gz ::-webkit-scrollbar-thumb{background:var(--gz-line2);border-radius:6px;}

  #gz{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    background:var(--gz-deep); color:var(--gz-ink);
    overflow:hidden;
  }

  /* ── the art behind everything ─────────────────────────────── */
  #gz-bg{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--gz-deep);}
  .gz-bg-l{
    position:absolute;inset:-4%;width:108%;height:108%;
    background-size:cover;background-position:center 30%;
    opacity:0;transition:opacity .5s ease;
  }
  .gz-bg-l.on{opacity:1;}
  #gz-bg::after{
    content:'';position:absolute;inset:0;
    background:
      linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.15) 26%,
                     rgba(0,0,0,.35) 58%, var(--gz-deep) 96%),
      radial-gradient(ellipse at 20% 20%, transparent 20%, rgba(0,0,0,.45) 90%);
  }
  /* the art is made for a dark room — on a light background it has to be
     pushed much further back or it reads as dirt behind the text */
  :root[data-theme="light"] #gz-bg::after{
    background:
      linear-gradient(180deg, rgba(255,255,255,.80) 0%, rgba(255,255,255,.60) 24%,
                     rgba(255,255,255,.86) 52%, var(--gz-deep) 84%);
  }
  :root[data-theme="light"] #gz-bg .tint{opacity:.10;}
  #gz-bg .tint{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at 12% 55%, var(--gz-accent), transparent 62%);
    opacity:.16;transition:opacity .5s ease, background .5s ease;
  }

  /* ── top bar ───────────────────────────────────────────────── */
  #gz-top{
    position:relative;z-index:5;flex:none;
    height:58px;display:flex;align-items:center;gap:14px;
    padding:0 clamp(16px,3vw,40px);
  }
  #gz-top .spacer{flex:1;}
  .gz-tb{
    display:flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:9px;border:1px solid transparent;
    background:transparent;color:var(--gz-ink2);cursor:pointer;transition:.16s;
  }
  .gz-tb:hover,.gz-tb:focus-visible{background:var(--gz-glow);color:var(--gz-ink);border-color:var(--gz-line);outline:none;}
  .gz-tb.on{color:var(--gz-ink);background:var(--gz-glow);border-color:var(--gz-line);}
  #gz-clock{
    font-family:'Rajdhani',sans-serif;font-weight:600;font-size:17px;
    letter-spacing:.5px;color:var(--gz-ink);min-width:74px;text-align:right;
    font-variant-numeric:tabular-nums;
  }
  #gz-status{display:flex;align-items:center;gap:10px;color:var(--gz-ink3);}
  #gz-lang{
    background:transparent;border:1px solid var(--gz-line);border-radius:9px;
    color:var(--gz-ink2);font-family:'Rajdhani',sans-serif;font-weight:600;
    font-size:12px;letter-spacing:1px;text-transform:uppercase;
    padding:7px 8px;cursor:pointer;
  }
  #gz-lang option{background:#14161e;color:#fff;}
  #gz-search-box{
    display:none;align-items:center;gap:8px;
    background:var(--gz-panel2);border:1px solid var(--gz-line);border-radius:10px;
    padding:6px 12px;
  }
  #gz-search-box.on{display:flex;}
  #gz-search{
    background:transparent;border:0;outline:none;color:var(--gz-ink);
    font-family:'Inter',sans-serif;font-size:14px;width:min(240px,40vw);
  }
  #gz-search::placeholder{color:var(--gz-ink3);}

  /* ── the row: one hero, the rest capsules ──────────────────── */
  #gz-stage{position:relative;z-index:4;flex:1;min-height:0;display:flex;flex-direction:column;}
  #gz-rail-wrap{flex:none;overflow:hidden;padding-left:clamp(16px,3vw,40px);}
  #gz-rail{
    display:flex;align-items:stretch;gap:14px;
    transition:transform .42s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
  }
  .gz-card{
    position:relative;flex:none;
    height:var(--cardh);
    width:var(--capw);
    border-radius:10px;overflow:hidden;cursor:pointer;
    background:var(--gz-panel2) center/cover no-repeat;
    border:2px solid transparent;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    transition:width .42s cubic-bezier(.22,.61,.36,1),
               border-color .2s, box-shadow .3s, filter .3s;
    filter:saturate(.75) brightness(.72);
  }
  .gz-card .art{position:absolute;inset:0;background-size:cover;background-position:center;}
  .gz-card .fade{position:absolute;inset:0;opacity:0;transition:opacity .42s ease;
    background-size:cover;background-position:center;}
  .gz-card.sel{
    width:var(--herow);
    filter:none;
    border-color:var(--gz-accent);
    box-shadow:0 18px 46px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.06),
               0 0 40px -6px var(--gz-accent);
  }
  .gz-card.sel .fade{opacity:1;}
  /* the name, drawn by the console so every game gets real typography */
  .gz-card .nm{
    position:absolute;left:0;right:0;bottom:0;padding:14px 12px 12px;
    font-family:'Rajdhani',sans-serif;font-weight:700;
    font-size:clamp(12px,1.15vw,16px);letter-spacing:.6px;text-transform:uppercase;
    color:#fff;text-align:center;line-height:1.15;
    text-shadow:0 2px 10px rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,1);
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.72));
    transition:opacity .3s;
  }
  .gz-card.sel .nm{opacity:0;}       /* the hero shows its name underneath instead */
  .gz-card .proto{
    position:absolute;top:9px;left:9px;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:9px;
    letter-spacing:1.6px;text-transform:uppercase;
    color:#fff;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.28);
    padding:2px 7px;border-radius:3px;backdrop-filter:blur(4px);
  }
  .gz-card.hide{display:none;}

  /* ── name + playtime under the hero ───────────────────────── */
  #gz-meta{
    flex:none;padding:20px clamp(16px,3vw,40px) 0;
    display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;
  }
  #gz-name{
    font-family:'Orbitron',sans-serif;font-weight:900;
    font-size:clamp(22px,2.9vw,40px);letter-spacing:1px;
    color:var(--gz-ink);line-height:1.05;
  }
  #gz-desc{
    font-size:clamp(12px,1.05vw,14px);color:var(--gz-ink2);
    max-width:56ch;line-height:1.5;margin-top:6px;
  }
  #gz-time{
    display:flex;align-items:center;gap:7px;margin-top:9px;
    font-family:'Rajdhani',sans-serif;font-weight:700;
    font-size:12px;letter-spacing:1.8px;text-transform:uppercase;color:#37d67a;
  }
  :root[data-theme="light"] #gz-time{color:#1a9c52;}
  #gz-meta-r{margin-left:auto;display:flex;gap:10px;align-items:center;}
  .gz-btn{
    display:inline-flex;align-items:center;gap:9px;
    font-family:'Rajdhani',sans-serif;font-weight:700;
    font-size:14px;letter-spacing:1.4px;text-transform:uppercase;
    padding:12px 26px;border-radius:9px;cursor:pointer;
    border:1px solid var(--gz-line2);background:var(--gz-panel2);color:var(--gz-ink);
    transition:.16s;
  }
  .gz-btn:hover,.gz-btn:focus-visible{border-color:var(--gz-ink2);outline:none;}
  .gz-btn.pri{
    background:var(--gz-accent);border-color:var(--gz-accent);color:#fff;
    box-shadow:0 8px 26px -6px var(--gz-accent);
  }
  .gz-btn.pri:hover{filter:brightness(1.12);}

  /* ── records ───────────────────────────────────────────────── */
  /* margin-top:auto drops the records to the foot of the stage, so the
     space left over sits between the hero and them, not in a dead band
     underneath everything */
  #gz-recs-wrap{flex:none;margin-top:auto;padding:22px clamp(16px,3vw,40px) 16px;min-height:0;}
  .gz-label{
    display:flex;align-items:center;gap:11px;margin-bottom:12px;
    font-family:'Rajdhani',sans-serif;font-weight:700;
    font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gz-ink3);
  }
  .gz-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--gz-line),transparent);}
  #gz-recs{display:flex;gap:11px;overflow-x:auto;padding-bottom:6px;}
  .gz-rec{
    flex:none;width:158px;padding:13px 15px;border-radius:10px;
    background:var(--gz-panel);border:1px solid var(--gz-line);
    cursor:pointer;transition:.16s;
  }
  .gz-rec:hover{border-color:var(--gz-line2);}
  .gz-rec.sel{border-color:var(--gz-accent);}
  .gz-rec .g{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:10px;
    letter-spacing:1.7px;text-transform:uppercase;color:var(--gz-ink3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .gz-rec .v{
    font-family:'Orbitron',sans-serif;font-weight:700;
    font-size:23px;color:var(--gz-ink);margin:5px 0 2px;
    font-variant-numeric:tabular-nums;
  }
  .gz-rec .v.none{font-size:14px;color:var(--gz-ink3);font-family:'Inter',sans-serif;font-weight:400;}
  .gz-rec .k{font-size:11px;color:var(--gz-ink2);}

  /* ── bottom button hints ───────────────────────────────────── */
  #gz-hints{
    position:relative;z-index:5;flex:none;
    height:52px;display:flex;align-items:center;gap:26px;
    padding:0 clamp(16px,3vw,40px);
    border-top:1px solid var(--gz-line);
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.28));
  }
  :root[data-theme="light"] #gz-hints{background:linear-gradient(180deg,transparent,rgba(0,0,0,.05));}
  .gz-hint{
    display:flex;align-items:center;gap:9px;
    font-family:'Rajdhani',sans-serif;font-weight:700;
    font-size:11px;letter-spacing:1.9px;text-transform:uppercase;color:var(--gz-ink3);
  }
  .gz-key{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:24px;height:22px;padding:0 7px;border-radius:5px;
    border:1px solid var(--gz-line2);background:var(--gz-panel2);color:var(--gz-ink2);
    font-size:10px;letter-spacing:1px;
  }
  #gz-hints .right{margin-left:auto;}

  /* ── the game, playing right here ──────────────────────────── */
  #gz-play{
    position:fixed;inset:0;z-index:60;background:#000;
    display:none;overflow:hidden;
  }
  #gz-play.on{display:block;}
  #gz-frame{
    position:absolute;top:0;left:0;border:0;background:#000;
    width:100%;height:100%;transform-origin:top left;
  }
  #gz-loading{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:#000;color:#666;font-family:'Rajdhani',sans-serif;font-weight:700;
    font-size:13px;letter-spacing:3px;text-transform:uppercase;
    transition:opacity .3s;pointer-events:none;
  }
  #gz-loading.gone{opacity:0;}

  /* ── the guide (hold Esc) ──────────────────────────────────── */
  #gz-guide{
    position:fixed;inset:0;z-index:70;display:none;
    align-items:center;justify-content:center;
    background:rgba(4,5,8,.72);backdrop-filter:blur(16px);
  }
  #gz-guide.on{display:flex;}
  .gz-sheet{
    width:min(430px,92vw);border-radius:16px;overflow:hidden;
    background:var(--gz-panel);border:1px solid var(--gz-line);box-shadow:var(--gz-shadow);
  }
  .gz-sheet h3{
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px;
    padding:19px 22px;border-bottom:1px solid var(--gz-line);color:var(--gz-ink);
  }
  .gz-item{
    display:flex;align-items:center;gap:13px;width:100%;
    padding:15px 22px;border:0;background:transparent;cursor:pointer;
    font-family:'Rajdhani',sans-serif;font-weight:600;font-size:15px;
    letter-spacing:.5px;color:var(--gz-ink);text-align:left;
    border-bottom:1px solid var(--gz-line);transition:.14s;
  }
  .gz-item:last-child{border-bottom:0;}
  .gz-item:hover,.gz-item.sel{background:var(--gz-glow);}
  .gz-item.sel{box-shadow:inset 3px 0 0 var(--gz-accent);}
  .gz-item.danger{color:#ff5566;}

  /* ── per-game settings ─────────────────────────────────────── */
  #gz-set{
    position:fixed;inset:0;z-index:80;display:none;
    align-items:center;justify-content:center;padding:20px;
    background:rgba(4,5,8,.74);backdrop-filter:blur(16px);
  }
  #gz-set.on{display:flex;}
  #gz-set .gz-sheet{width:min(520px,94vw);max-height:88vh;display:flex;flex-direction:column;}
  #gz-set-body{overflow-y:auto;padding:6px 0;}
  .gz-row{
    display:flex;align-items:center;gap:14px;
    padding:15px 22px;border-bottom:1px solid var(--gz-line);
  }
  .gz-row:last-child{border-bottom:0;}
  .gz-row .lb{flex:1;min-width:0;}
  .gz-row .lb b{
    display:block;font-family:'Rajdhani',sans-serif;font-weight:700;
    font-size:14px;letter-spacing:.5px;color:var(--gz-ink);
  }
  .gz-row .lb span{display:block;font-size:12px;color:var(--gz-ink3);margin-top:3px;line-height:1.4;}
  .gz-seg{display:flex;border:1px solid var(--gz-line);border-radius:8px;overflow:hidden;flex:none;}
  .gz-seg button{
    border:0;background:transparent;color:var(--gz-ink2);cursor:pointer;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;
    letter-spacing:.6px;padding:8px 13px;transition:.14s;
  }
  .gz-seg button.on{background:var(--gz-accent);color:#fff;}
  .gz-sw{
    flex:none;width:44px;height:25px;border-radius:20px;border:1px solid var(--gz-line2);
    background:var(--gz-panel2);cursor:pointer;position:relative;transition:.18s;
  }
  .gz-sw::after{
    content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;
    border-radius:50%;background:var(--gz-ink2);transition:.18s;
  }
  .gz-sw.on{background:var(--gz-accent);border-color:var(--gz-accent);}
  .gz-sw.on::after{left:21px;background:#fff;}
  #gz-keys{padding:4px 22px 16px;}
  .gz-kmap{
    display:flex;align-items:center;gap:10px;padding:8px 0;
    border-bottom:1px dashed var(--gz-line);
  }
  .gz-kmap:last-child{border-bottom:0;}
  .gz-kmap .arrow{color:var(--gz-ink3);font-size:15px;}
  .gz-kmap .rm{
    margin-left:auto;background:transparent;border:0;color:var(--gz-ink3);
    cursor:pointer;padding:4px;display:flex;
  }
  .gz-kmap .rm:hover{color:#ff5566;}
  .gz-cap{
    font-size:12px;color:var(--gz-ink3);padding:0 22px 16px;line-height:1.5;
  }
  .gz-catch{
    margin:0 22px 16px;padding:15px;border-radius:10px;text-align:center;
    border:1px dashed var(--gz-accent);color:var(--gz-ink);
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;letter-spacing:1px;
  }
  #gz-set-foot{
    display:flex;gap:10px;justify-content:flex-end;
    padding:15px 22px;border-top:1px solid var(--gz-line);
  }
  .gz-lite{
    background:transparent;border:1px solid var(--gz-line);color:var(--gz-ink2);
    border-radius:8px;padding:9px 16px;cursor:pointer;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;
  }
  .gz-lite:hover{border-color:var(--gz-line2);color:var(--gz-ink);}
  .gz-lite.danger:hover{border-color:#ff5566;color:#ff5566;}

  /* ── a small toast, for confirmations ──────────────────────── */
  #gz-toast{
    position:fixed;left:50%;bottom:78px;transform:translate(-50%,14px);
    z-index:90;padding:11px 20px;border-radius:9px;
    background:var(--gz-panel2);border:1px solid var(--gz-line2);color:var(--gz-ink);
    font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;letter-spacing:.4px;
    opacity:0;pointer-events:none;transition:.24s;
  }
  #gz-toast.on{opacity:1;transform:translate(-50%,0);}

  /* ── narrow screens ────────────────────────────────────────── */
  @media (max-width:820px){
    /* the wide banner has nothing left to show once it's squeezed into a
       near-square box, so the upright cover stays on for the selected one too */
    .gz-card.sel .fade{opacity:0;}
    .gz-card.sel .nm{opacity:1;}
    #gz-meta{flex-direction:column;align-items:flex-start;gap:14px;}
    #gz-meta-r{margin-left:0;width:100%;}
    #gz-meta-r .gz-btn{flex:1;justify-content:center;}
    #gz-hints{gap:16px;}
    #gz-hints .gz-hint.opt{display:none;}
    #gz-desc{display:none;}
  }
  @media (max-height:620px){
    #gz-recs-wrap{display:none;}
  }
  </style>
  <link rel="stylesheet" href="ycz-theme.css">
  <script src="ycz-icons.js"></script>
  <script src="ycz-i18n.js"></script>
  <script src="ycz-scores.js"></script>
</head>
<body>
<div id="gz">

  <div id="gz-bg">
    <div class="gz-bg-l" id="gz-bg-a"></div>
    <div class="gz-bg-l" id="gz-bg-b"></div>
    <div class="tint" id="gz-tint"></div>
  </div>

  <!-- ══════ TOP BAR ══════ -->
  <div id="gz-top">
    <!-- only when the console was opened on its own; inside the chat app
         there is already a way back, and two would be clutter -->
    <a class="gz-tb" id="gz-home" href="index.html" data-i18n-title="backToChat" title="Chill Zone"><i data-ic="home" data-ic-size="17"></i></a>
    <div id="gz-search-box">
      <i data-ic="search" data-ic-size="15"></i>
      <input id="gz-search" type="text" autocomplete="off" data-i18n-ph="gz_search" placeholder="Search games">
    </div>
    <div class="spacer"></div>
    <button class="gz-tb" id="gz-search-b" data-i18n-title="gz_search" title="Search"><i data-ic="search" data-ic-size="17"></i></button>
    <div id="gz-status">
      <i data-ic="wifi" data-ic-size="16"></i>
      <i data-ic="battery" data-ic-size="17"></i>
    </div>
    <div id="gz-clock">--:--</div>
    <button class="gz-tb" id="gz-fs" data-i18n-title="gz_fullscreen" title="Fullscreen"><i data-ic="expand" data-ic-size="17"></i></button>
    <button class="gz-tb" id="gz-theme" data-i18n-title="gz_theme" title="Theme"><i data-ic="sun" data-ic-size="17"></i></button>
    <select id="gz-lang" data-i18n-title="language" title="Language"></select>
  </div>

  <!-- ══════ THE LIBRARY ══════ -->
  <div id="gz-stage">
    <div id="gz-rail-wrap"><div id="gz-rail"></div></div>

    <div id="gz-meta">
      <div>
        <div id="gz-name">—</div>
        <div id="gz-desc"></div>
        <div id="gz-time"></div>
      </div>
      <div id="gz-meta-r">
        <button class="gz-btn" id="gz-cfg"><i data-ic="settings" data-ic-size="16"></i> <span data-i18n="gz_settings">Settings</span></button>
        <button class="gz-btn pri" id="gz-go"><i data-ic="play" data-ic-size="16"></i> <span data-i18n="gz_play">Play</span></button>
      </div>
    </div>

    <div id="gz-recs-wrap">
      <div class="gz-label"><i data-ic="trophy" data-ic-size="13"></i> <span data-i18n="gz_records">Your records</span></div>
      <div id="gz-recs"></div>
    </div>
  </div>

  <!-- ══════ BUTTON HINTS ══════ -->
  <div id="gz-hints">
    <div class="gz-hint"><span class="gz-key">&#9664;&#9654;</span> <span data-i18n="gz_hBrowse">Browse</span></div>
    <div class="gz-hint"><span class="gz-key">Enter</span> <span data-i18n="gz_play">Play</span></div>
    <div class="gz-hint opt"><span class="gz-key">S</span> <span data-i18n="gz_settings">Settings</span></div>
    <div class="gz-hint right"><span class="gz-key">Esc</span> <span data-i18n="gz_hHold">Hold for the menu</span></div>
  </div>
</div>

<!-- ══════ THE GAME ══════ -->
<div id="gz-play">
  <iframe id="gz-frame" src="" allow="autoplay;fullscreen;gamepad;encrypted-media;picture-in-picture" allowfullscreen></iframe>
  <div id="gz-loading" data-i18n="gz_loading">Loading</div>
</div>

<!-- ══════ GUIDE (hold Esc) ══════ -->
<div id="gz-guide">
  <div class="gz-sheet">
    <h3 id="gz-guide-t">—</h3>
    <button class="gz-item" data-act="resume"><i data-ic="play" data-ic-size="17"></i> <span data-i18n="gz_resume">Back to the game</span></button>
    <button class="gz-item" data-act="restart"><i data-ic="refresh" data-ic-size="17"></i> <span data-i18n="gz_restart">Restart</span></button>
    <button class="gz-item" data-act="fs"><i data-ic="expand" data-ic-size="17"></i> <span data-i18n="gz_fullscreen">Fullscreen</span></button>
    <button class="gz-item" data-act="cfg"><i data-ic="settings" data-ic-size="17"></i> <span data-i18n="gz_settings">Settings</span></button>
    <button class="gz-item danger" data-act="exit"><i data-ic="logout" data-ic-size="17"></i> <span data-i18n="gz_exit">Quit to the console</span></button>
  </div>
</div>

<!-- ══════ SETTINGS ══════ -->
<div id="gz-set">
  <div class="gz-sheet">
    <h3 id="gz-set-t">—</h3>
    <div id="gz-set-body"></div>
    <div id="gz-set-foot">
      <button class="gz-lite danger" id="gz-set-wipe" data-i18n="gz_reset">Clear record and time</button>
      <button class="gz-lite" id="gz-set-x" data-i18n="gz_done">Done</button>
    </div>
  </div>
</div>

<div id="gz-toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   THE LIBRARY — this is the bit to edit

   Adding a game: copy one block, change the six lines, done.
   Removing one: delete its block. Reordering: move the block.
   Nothing else in this file needs touching.

     id      a short private name. Records are filed under it, so
             once a game has been played, don't rename it.
     name    what people see.
     url     where the game lives. Relative paths, so it works the
             same on localhost and on the live site.
     desc    a translation key — the text itself lives in ycz-i18n.js
             in all four languages.
     accent  the colour that tints the console while it's selected.
     art     capsule = the upright cover, hero = the wide banner.
     record  which record to show, and what to call it. Leave it out
             for games that don't keep score.
     keys    false when a game ignores the keyboard entirely — the
             key remapping section then hides itself instead of
             sitting there doing nothing.
   ═══════════════════════════════════════════════════════════════ */
const GAMES = [
  { id:'sffg',  name:'SFFG',            url:'fight.html',
    desc:'g_sffg',   accent:'#e8162a', proto:true,
    art:{capsule:'art/games/sffg-capsule.jpg', hero:'art/games/sffg-hero.jpg'},
    record:{ label:'rec_wins' }, keys:true },

  { id:'suds',  name:'Suds of Doom',    url:'suds.html',
    desc:'g_suds',   accent:'#9b5cff', proto:true,
    art:{capsule:'art/games/suds-capsule.jpg', hero:'art/games/suds-hero.jpg'},
    record:{ label:'rec_wave' }, keys:true },

  { id:'snake', name:'Snake',           url:'snake.html',
    desc:'g_snake',  accent:'#00d4ff',
    art:{capsule:'art/games/snake-capsule.jpg', hero:'art/games/snake-hero.jpg'},
    record:{ label:'rec_score' }, keys:true },

  { id:'doom',  name:'Doom HTML',       url:'doom/Titlescreen.html',
    desc:'g_doom',   accent:'#c0392b',
    art:{capsule:'art/games/doom-capsule.jpg', hero:'art/games/doom-hero.jpg'},
    keys:false },

  { id:'mc',    name:'Minecraft HTML',  url:'minecraft.html',
    desc:'g_mc',     accent:'#5aab3f',
    art:{capsule:'art/games/mc-capsule.jpg',   hero:'art/games/mc-hero.jpg'},
    keys:true },

  { id:'flappy',name:'Flappy Bird',     url:'flappybird/index.html',
    desc:'g_flappy', accent:'#4ec0ca',
    art:{capsule:'art/games/flappy-capsule.jpg', hero:'art/games/flappy-hero.jpg'},
    record:{ label:'rec_score' }, keys:true },

  { id:'subway',name:'Subway Surfers',  url:'subway%20surfying/index.html',
    desc:'g_subway', accent:'#f39c12',
    art:{capsule:'art/games/subway-capsule.jpg', hero:'art/games/subway-hero.jpg'},
    keys:false },
];

/* ══════ small helpers ══════ */
const $ = id => document.getElementById(id);
const GZ = $('gz');
const T = k => (window.t ? t(k) : k);
let sel = 0, playing = null, filtered = GAMES.slice();

function toast(msg){
  const e=$('gz-toast'); e.textContent=msg; e.classList.add('on');
  clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),2200);
}

/* ══════ remembering things ══════
   localStorage is not guaranteed. Embedded in an iframe whose parent has
   an opaque origin, or in a browser set to block third-party storage, the
   very first read throws — and that used to leave the console completely
   blank. Nothing here is important enough to break the page for, so when
   storage is denied we keep it in memory for the session instead. */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){ mem[k]=String(v); } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};

/* ══════ settings, kept per game in this browser ══════ */
const SKEY='ycz-gz-settings';
let SET = (()=>{ try{ return JSON.parse(store.get(SKEY)||'{}')||{}; }catch(e){ return {}; } })();
const DEFAULTS = { remap:{}, zoom:1, pixel:false, mute:false, autoFs:false };
function cfg(id){
  if(!SET[id]) SET[id] = Object.assign({},DEFAULTS,{remap:{}});
  const c = SET[id];
  for(const k in DEFAULTS) if(c[k]===undefined) c[k] = DEFAULTS[k];
  if(!c.remap) c.remap = {};
  return c;
}
function saveCfg(){ store.set(SKEY, JSON.stringify(SET)); }

/* ══════ theme — the console keeps its own, so flipping it here
         doesn't flip the chat app you left open next door ══════ */
function paintTheme(){
  const light = store.get('ycz-gz-theme')==='light';
  GZ.dataset.gz = light ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  const b=$('gz-theme'); if(b) b.innerHTML = icon(light?'moon':'sun',17);
}
$('gz-theme').onclick = ()=>{
  const light = store.get('ycz-gz-theme')==='light';
  store.set('ycz-gz-theme', light?'dark':'light');
  paintTheme();
};

/* ══════ clock ══════ */
function tick(){
  const d=new Date();
  $('gz-clock').textContent = d.toLocaleTimeString(
    (window.yczLang?yczLang():undefined), {hour:'numeric',minute:'2-digit'});
}
setInterval(tick,15000); tick();

/* ══════ time played ══════ */
function fmtTime(ms){
  if(!ms || ms<60000) return '0 ' + T('gz_min');
  const h = ms/3600000;
  if(h >= 1) return h.toFixed(1) + ' ' + T('gz_hrs');
  return Math.round(ms/60000) + ' ' + T('gz_min');
}

/* ══════ paint the rail ══════ */
function railSizes(){
  const stage = $('gz-stage').clientHeight;
  const h = Math.max(190, Math.min(430, Math.round(stage*0.56)));
  const capw = Math.round(h*0.667);                    // 600×900 art
  const herow = Math.round(h*3.1);                     // 1920×620 art
  const room = $('gz-rail-wrap').clientWidth - 40;
  GZ.style.setProperty('--cardh', h+'px');
  GZ.style.setProperty('--capw', capw+'px');
  GZ.style.setProperty('--herow', Math.min(herow, Math.max(280, room))+'px');
}

function drawRail(){
  const rail=$('gz-rail');
  rail.innerHTML = filtered.map((g,i)=>`
    <div class="gz-card${i===sel?' sel':''}" data-i="${i}">
      <div class="art" style="background-image:url('${g.art.capsule}')"></div>
      <div class="fade" style="background-image:url('${g.art.hero}')"></div>
      ${g.proto?`<div class="proto">${T('gz_proto')}</div>`:''}
      <div class="nm">${g.name}</div>
    </div>`).join('');
  rail.querySelectorAll('.gz-card').forEach(c=>{
    c.onclick = ()=>{ const i=+c.dataset.i; if(i===sel) launch(filtered[i]); else select(i); };
  });
  slide();
}

function slide(){
  const rail=$('gz-rail'), cards=[...rail.children];
  if(!cards.length) return;
  let x=0;
  for(let i=0;i<sel;i++) x += cards[i].offsetWidth + 14;
  rail.style.transform = `translateX(${-x}px)`;
}

/* ══════ selection ══════ */
let bgFlip=false;
function select(i, quiet){
  if(!filtered.length) return;
  sel = Math.max(0, Math.min(filtered.length-1, i));
  const g = filtered[sel];

  [...$('gz-rail').children].forEach((c,n)=>c.classList.toggle('sel', n===sel));
  slide();

  document.documentElement.style.setProperty('--gz-accent', g.accent);
  const layer = bgFlip ? $('gz-bg-a') : $('gz-bg-b');
  const other = bgFlip ? $('gz-bg-b') : $('gz-bg-a');
  layer.style.backgroundImage = `url('${g.art.hero}')`;
  layer.classList.add('on'); other.classList.remove('on');
  bgFlip = !bgFlip;

  $('gz-name').textContent = g.name;
  $('gz-desc').textContent = T(g.desc);
  const d = yczData(g.id);
  $('gz-time').innerHTML = icon('timer',13) +
    `<span>${T('gz_playtime')}: ${fmtTime(d.ms)}</span>`;

  [...$('gz-recs').children].forEach(r=>r.classList.toggle('sel', r.dataset.id===g.id));
  if(!quiet) blip(560);
}

/* ══════ records ══════ */
function recordOf(g){
  const d = yczData(g.id);
  if(d.best !== null && d.best !== undefined) return d.best;
  /* Suds kept its own high score long before the console existed —
     read it so old runs still count. */
  if(g.id==='suds'){
    const w = parseInt(store.get('suds-best-wave')||'0',10);
    if(w>0) return w;
  }
  return null;
}
function drawRecords(){
  const list = GAMES.filter(g=>g.record);
  $('gz-recs').innerHTML = list.map(g=>{
    const v = recordOf(g);
    return `<div class="gz-rec${g.id===(filtered[sel]||{}).id?' sel':''}" data-id="${g.id}">
      <div class="g">${g.name}</div>
      <div class="v${v===null?' none':''}">${v===null?T('gz_noRecord'):v}</div>
      <div class="k">${T(g.record.label)}</div>
    </div>`;
  }).join('');
  $('gz-recs').querySelectorAll('.gz-rec').forEach(r=>{
    r.onclick = ()=>{ const i=filtered.findIndex(g=>g.id===r.dataset.id); if(i>=0) select(i); };
  });
}

/* ══════ a short blip when you move ══════ */
let AC=null;
function blip(freq){
  if(store.get('ycz-gz-quiet')==='1') return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(.05,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+.09);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+.1);
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════════
   PLAYING
   The game gets the whole screen and none of our furniture. The
   only way back is the guide, so the guide has to be reachable —
   hold Esc, or hold two fingers on a touch screen.
   ═══════════════════════════════════════════════════════════════ */
let playStart=0, playTimer=null;

function launch(g){
  playing = g;
  const c = cfg(g.id);
  $('gz-play').classList.add('on');
  $('gz-loading').classList.remove('gone');
  $('gz-loading').textContent = T('gz_loading');
  const f = $('gz-frame');
  applyZoom(c.zoom);
  f.src = g.url;
  playStart = Date.now();
  clearInterval(playTimer);
  playTimer = setInterval(bankTime, 30000);      // bank time as you go, not just on exit
  if(c.autoFs) goFullscreen();
}

function bankTime(){
  if(!playing || !playStart) return;
  const spent = Date.now() - playStart;
  if(spent > 1000){ yczPlay(playing.id, spent); playStart = Date.now(); }
}

function quit(){
  bankTime();
  clearInterval(playTimer); playTimer=null; playStart=0;
  $('gz-frame').src = 'about:blank';
  $('gz-play').classList.remove('on');
  $('gz-guide').classList.remove('on');
  playing = null;
  drawRecords();
  select(sel, true);
  window.focus();
}

function applyZoom(z){
  const f=$('gz-frame');
  z = Math.max(0.5, Math.min(3, +z||1));
  f.style.width  = (100/z)+'%';
  f.style.height = (100/z)+'%';
  f.style.transform = z===1 ? 'none' : `scale(${z})`;
}

/* ── everything we do inside the game's own document ────────── */
function gameDoc(){
  try{
    const d = $('gz-frame').contentDocument;
    return (d && d.body) ? d : null;      // null when the game is cross-origin
  }catch(e){ return null; }
}

/* Different games read the keyboard in different ways — some ask for
   e.key, some for e.code, the older ones for keyCode. A remapped press
   therefore has to arrive carrying all four, or it only works in half
   of them. */
const KEYNUM = {
  ArrowUp:38, ArrowDown:40, ArrowLeft:37, ArrowRight:39,
  Enter:13, Escape:27, ' ':32, Space:32, Shift:16, Control:17, Alt:18, Tab:9, Backspace:8
};
function codeFor(k){
  if(k===' '||k==='Space') return 'Space';
  if(/^[a-zA-Z]$/.test(k)) return 'Key'+k.toUpperCase();
  if(/^[0-9]$/.test(k)) return 'Digit'+k;
  return k;
}
function numFor(k){
  if(KEYNUM[k]!==undefined) return KEYNUM[k];
  if(/^[a-zA-Z]$/.test(k)) return k.toUpperCase().charCodeAt(0);
  if(/^[0-9]$/.test(k)) return k.charCodeAt(0);
  return 0;
}

let remapOff=null;
function installRemap(){
  if(remapOff){ remapOff(); remapOff=null; }
  const d = gameDoc(); if(!d || !playing) return;
  const map = cfg(playing.id).remap;
  const win = $('gz-frame').contentWindow;

  const onKey = e => {
    if(e.__ycz) return;                                  // our own synthetic press
    const to = map[e.key] || map[e.key && e.key.toLowerCase()];
    if(!to) return;
    e.preventDefault(); e.stopImmediatePropagation();
    const code = codeFor(to), num = numFor(to);
    const ev = new win.KeyboardEvent(e.type, {
      key:to, code:code, bubbles:true, cancelable:true,
      shiftKey:e.shiftKey, ctrlKey:e.ctrlKey, altKey:e.altKey
    });
    ev.__ycz = true;
    try{
      Object.defineProperty(ev,'keyCode',{get:()=>num});
      Object.defineProperty(ev,'which',  {get:()=>num});
    }catch(err){}
    d.dispatchEvent(ev);
  };

  d.addEventListener('keydown', onKey, true);
  d.addEventListener('keyup',   onKey, true);
  remapOff = ()=>{
    try{ d.removeEventListener('keydown',onKey,true); d.removeEventListener('keyup',onKey,true); }catch(e){}
  };
}

function applyPixel(on){
  const d=gameDoc(); if(!d) return;
  let s = d.getElementById('__ycz_px');
  if(!on){ if(s) s.remove(); return; }
  if(!s){ s = d.createElement('style'); s.id='__ycz_px'; d.head.appendChild(s); }
  s.textContent = 'img,canvas{image-rendering:pixelated;image-rendering:crisp-edges;}';
}

/* Muting a game we didn't write is best-effort. Two things cover most
   of them: stop <audio>/<video> from playing at all, and keep any
   Web Audio context the game opens from now on suspended. A context
   opened before we got here keeps playing — nothing to hold on to. */
function applyMute(on){
  const d=gameDoc(), w=$('gz-frame').contentWindow;
  if(!d||!w) return;
  try{
    if(on){
      if(!w.__yczMuteOn){
        w.__yczMuteOn = true;
        const proto = w.HTMLMediaElement && w.HTMLMediaElement.prototype;
        if(proto && !proto.__yczPlay){
          proto.__yczPlay = proto.play;
          proto.play = function(){ if(w.__yczMuteOn){ this.muted=true; return Promise.resolve(); }
                                   return proto.__yczPlay.apply(this,arguments); };
        }
        ['AudioContext','webkitAudioContext'].forEach(n=>{
          const Real = w[n]; if(!Real || Real.__ycz) return;
          const Wrapped = function(){ const c = new Real(...arguments);
            if(w.__yczMuteOn){ try{ c.suspend(); }catch(e){} }
            (w.__yczCtxs = w.__yczCtxs||[]).push(c); return c; };
          Wrapped.__ycz = true; Wrapped.prototype = Real.prototype; w[n] = Wrapped;
        });
      }
      d.querySelectorAll('audio,video').forEach(m=>{ m.muted=true; try{m.pause();}catch(e){} });
      (w.__yczCtxs||[]).forEach(c=>{ try{ c.suspend(); }catch(e){} });
    } else {
      w.__yczMuteOn = false;
      d.querySelectorAll('audio,video').forEach(m=>m.muted=false);
      (w.__yczCtxs||[]).forEach(c=>{ try{ c.resume(); }catch(e){} });
    }
  }catch(e){}
}

function applyAll(){
  if(!playing) return;
  const c = cfg(playing.id);
  applyZoom(c.zoom);
  applyPixel(c.pixel);
  applyMute(c.mute);
  installRemap();
}

$('gz-frame').addEventListener('load', ()=>{
  $('gz-loading').classList.add('gone');
  if(!playing) return;
  const d = gameDoc();
  if(!d){
    /* A cross-origin game still plays — we just can't reach inside it,
       so remapping and the rest quietly don't apply. */
    toast(T('gz_outside'));
    return;
  }
  applyAll();
  focusGame();
  /* keys only reach a game that holds focus, and a click on the page
     behind would steal it back */
  d.addEventListener('mousedown', focusGame, true);
  d.addEventListener('touchstart', focusGame, true);
  installGuideHooks(d);
});

function focusGame(){
  try{ $('gz-frame').contentWindow.focus(); }catch(e){}
}

/* ── the guide: hold Esc ─────────────────────────────────────── */
let escAt=0, escTimer=null, touchTimer=null;
const HOLD = 600;

function guideOpen(){
  if(!playing || $('gz-guide').classList.contains('on')) return;
  $('gz-guide-t').textContent = playing.name;
  $('gz-guide').classList.add('on');
  gsel = 0; paintGuide();
  blip(700);
}
function guideClose(){
  $('gz-guide').classList.remove('on');
  focusGame();
}

function onEscDown(e){
  if(e.key!=='Escape' || !playing) return;
  if($('gz-guide').classList.contains('on')) return;
  if(escAt) return;                       /* key repeat, not a second press */
  escAt = Date.now();
  escTimer = setTimeout(guideOpen, HOLD);
}
function onEscUp(e){
  if(e.key!=='Escape') return;
  clearTimeout(escTimer); escAt=0;
}
/* two fingers held down does the same thing, since phones have no Esc */
function onTouchStart(e){
  if(!playing || e.touches.length!==2) return;
  clearTimeout(touchTimer);
  touchTimer = setTimeout(guideOpen, HOLD);
}
function onTouchEnd(){ clearTimeout(touchTimer); }

function installGuideHooks(d){
  d.addEventListener('keydown', onEscDown, true);
  d.addEventListener('keyup',   onEscUp,   true);
  d.addEventListener('touchstart', onTouchStart, true);
  d.addEventListener('touchend',   onTouchEnd,   true);
  d.addEventListener('touchcancel',onTouchEnd,   true);
}
document.addEventListener('keydown', onEscDown, true);
document.addEventListener('keyup',   onEscUp,   true);
document.addEventListener('touchstart', onTouchStart, true);
document.addEventListener('touchend',   onTouchEnd,   true);

/* guide keyboard navigation */
let gsel=0;
function guideItems(){ return [...$('gz-guide').querySelectorAll('.gz-item')]; }
function paintGuide(){ guideItems().forEach((b,i)=>b.classList.toggle('sel', i===gsel)); }

$('gz-guide').addEventListener('click', e=>{
  const b = e.target.closest('.gz-item');
  if(!b){ if(e.target.id==='gz-guide') guideClose(); return; }
  doGuide(b.dataset.act);
});
function doGuide(act){
  if(act==='resume') return guideClose();
  if(act==='restart'){ const f=$('gz-frame'); f.src = playing.url; guideClose(); return; }
  if(act==='fs'){ toggleFullscreen(); guideClose(); return; }
  if(act==='cfg'){ $('gz-guide').classList.remove('on'); openSettings(playing); return; }
  if(act==='exit') return quit();
}

/* ── fullscreen ──────────────────────────────────────────────── */
function goFullscreen(){
  const el = document.documentElement;
  const fn = el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  if(fn) { try{ fn.call(el); }catch(e){} }
}
function exitFullscreen(){
  const fn = document.exitFullscreen||document.webkitExitFullscreen||document.msExitFullscreen;
  if(fn && (document.fullscreenElement||document.webkitFullscreenElement)) { try{ fn.call(document); }catch(e){} }
}
function isFull(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
function toggleFullscreen(){ isFull() ? exitFullscreen() : goFullscreen(); }
$('gz-fs').onclick = toggleFullscreen;
document.addEventListener('fullscreenchange', ()=>{
  $('gz-fs').innerHTML = icon(isFull()?'shrink':'expand',17);
});

/* ═══════════════════════════════════════════════════════════════
   SETTINGS
   ═══════════════════════════════════════════════════════════════ */
let setFor=null, catching=null;

function openSettings(g){
  setFor = g || filtered[sel];
  $('gz-set-t').textContent = setFor.name;
  drawSettings();
  $('gz-set').classList.add('on');
}
function closeSettings(){
  $('gz-set').classList.remove('on');
  catching = null;
  if(playing){ applyAll(); focusGame(); }
  drawRecords(); select(sel, true);
}
$('gz-set-x').onclick = closeSettings;
$('gz-set').addEventListener('click', e=>{ if(e.target.id==='gz-set') closeSettings(); });
$('gz-cfg').onclick = ()=>openSettings(filtered[sel]);

function keyName(k){
  if(k===' ') return 'Space';
  if(k.startsWith('Arrow')) return k.slice(5);
  return k.length===1 ? k.toUpperCase() : k;
}

function drawSettings(){
  const g = setFor, c = cfg(g.id);
  const zooms = [1,1.25,1.5,2];
  const pairs = Object.keys(c.remap);

  $('gz-set-body').innerHTML = `
    <div class="gz-row">
      <div class="lb"><b>${T('gz_zoom')}</b><span>${T('gz_zoomHelp')}</span></div>
      <div class="gz-seg" id="gz-zoom">
        ${zooms.map(z=>`<button data-z="${z}" class="${c.zoom===z?'on':''}">${z===1?'1×':z+'×'}</button>`).join('')}
      </div>
    </div>
    <div class="gz-row">
      <div class="lb"><b>${T('gz_sharp')}</b><span>${T('gz_sharpHelp')}</span></div>
      <div class="gz-seg" id="gz-px">
        <button data-p="0" class="${!c.pixel?'on':''}">${T('gz_smooth')}</button>
        <button data-p="1" class="${c.pixel?'on':''}">${T('gz_pixel')}</button>
      </div>
    </div>
    <div class="gz-row">
      <div class="lb"><b>${T('gz_mute')}</b><span>${T('gz_muteHelp')}</span></div>
      <button class="gz-sw${c.mute?' on':''}" id="gz-mute"></button>
    </div>
    <div class="gz-row">
      <div class="lb"><b>${T('gz_autoFs')}</b><span>${T('gz_autoFsHelp')}</span></div>
      <button class="gz-sw${c.autoFs?' on':''}" id="gz-autofs"></button>
    </div>
    ${g.keys===false ? `
      <div class="gz-row"><div class="lb"><b>${T('gz_keys')}</b><span>${T('gz_noKeys')}</span></div></div>
    ` : `
      <div class="gz-row" style="border-bottom:0;padding-bottom:6px;">
        <div class="lb"><b>${T('gz_keys')}</b><span>${T('gz_keysHelp')}</span></div>
        <button class="gz-lite" id="gz-addkey">${T('gz_addKey')}</button>
      </div>
      ${catching ? `<div class="gz-catch">${catching.step===1?T('gz_pressYours'):T('gz_pressGame')}</div>` : ''}
      <div id="gz-keys">
        ${pairs.length ? pairs.map(from=>`
          <div class="gz-kmap">
            <span class="gz-key">${keyName(from)}</span>
            <span class="arrow">&#8594;</span>
            <span class="gz-key">${keyName(c.remap[from])}</span>
            <button class="rm" data-k="${from.replace(/"/g,'&quot;')}">${icon('trash',15)}</button>
          </div>`).join('') : `<div class="gz-cap" style="padding:6px 0 0;">${T('gz_noMaps')}</div>`}
      </div>
      ${pairs.length ? '' : `<div class="gz-cap">${T('gz_keysExample')}</div>`}
    `}
  `;

  const z=$('gz-zoom'); if(z) z.onclick = e=>{
    const b=e.target.closest('button'); if(!b) return;
    cfg(g.id).zoom = +b.dataset.z; saveCfg(); drawSettings();
    if(playing && playing.id===g.id) applyZoom(cfg(g.id).zoom);
  };
  const px=$('gz-px'); if(px) px.onclick = e=>{
    const b=e.target.closest('button'); if(!b) return;
    cfg(g.id).pixel = b.dataset.p==='1'; saveCfg(); drawSettings();
    if(playing && playing.id===g.id) applyPixel(cfg(g.id).pixel);
  };
  const mu=$('gz-mute'); if(mu) mu.onclick = ()=>{
    const c2=cfg(g.id); c2.mute=!c2.mute; saveCfg(); drawSettings();
    if(playing && playing.id===g.id) applyMute(c2.mute);
  };
  const af=$('gz-autofs'); if(af) af.onclick = ()=>{
    const c2=cfg(g.id); c2.autoFs=!c2.autoFs; saveCfg(); drawSettings();
  };
  const ak=$('gz-addkey'); if(ak) ak.onclick = ()=>{ catching={step:1,from:null}; drawSettings(); };
  const kl=$('gz-keys'); if(kl) kl.onclick = e=>{
    const b=e.target.closest('.rm'); if(!b) return;
    delete cfg(g.id).remap[b.dataset.k]; saveCfg(); drawSettings();
    if(playing && playing.id===g.id) installRemap();
  };
}

$('gz-set-wipe').onclick = ()=>{
  if(!setFor) return;
  yczReset(setFor.id);
  if(setFor.id==='suds'){ store.del('suds-best-wave'); store.del('suds-best-kills'); }
  drawRecords(); select(sel, true);
  toast(T('gz_cleared'));
};

/* catching a key pair for the remap */
document.addEventListener('keydown', e=>{
  if(!catching || !$('gz-set').classList.contains('on')) return;
  e.preventDefault(); e.stopPropagation();
  if(e.key==='Escape'){ catching=null; drawSettings(); return; }
  if(catching.step===1){ catching={step:2, from:e.key}; drawSettings(); return; }
  const c = cfg(setFor.id);
  c.remap[catching.from] = e.key;
  catching = null; saveCfg(); drawSettings();
  if(playing && playing.id===setFor.id) installRemap();
}, true);

/* ═══════════════════════════════════════════════════════════════
   NAVIGATION — mouse, keyboard and a real controller
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e=>{
  if($('gz-set').classList.contains('on')){
    if(e.key==='Escape' && !catching) closeSettings();
    return;
  }
  if($('gz-guide').classList.contains('on')){
    const items = guideItems();
    if(e.key==='ArrowDown'){ gsel=(gsel+1)%items.length; paintGuide(); blip(520); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ gsel=(gsel-1+items.length)%items.length; paintGuide(); blip(520); e.preventDefault(); }
    else if(e.key==='Enter'){ doGuide(items[gsel].dataset.act); e.preventDefault(); }
    return;
  }
  if(playing) return;                         /* the game owns the keyboard */

  if(document.activeElement === $('gz-search')){
    if(e.key==='Escape'){ closeSearch(); }
    if(e.key==='Enter' && filtered.length){ closeSearch(); launch(filtered[sel]); }
    return;
  }
  if(e.key==='ArrowRight'){ select(sel+1); e.preventDefault(); }
  else if(e.key==='ArrowLeft'){ select(sel-1); e.preventDefault(); }
  else if(e.key==='Enter'){ if(filtered.length) launch(filtered[sel]); }
  else if(e.key==='s'||e.key==='S'){ openSettings(filtered[sel]); }
  else if(e.key==='f'||e.key==='F'){ toggleFullscreen(); }
  else if(e.key==='/'){ openSearch(); e.preventDefault(); }
});

$('gz-go').onclick = ()=>{ if(filtered.length) launch(filtered[sel]); };

/* ── search ──────────────────────────────────────────────────── */
function openSearch(){ $('gz-search-box').classList.add('on'); $('gz-search-b').classList.add('on'); $('gz-search').focus(); }
function closeSearch(){
  $('gz-search').value=''; applyFilter();
  $('gz-search-box').classList.remove('on'); $('gz-search-b').classList.remove('on');
  $('gz-search').blur();
}
$('gz-search-b').onclick = ()=> $('gz-search-box').classList.contains('on') ? closeSearch() : openSearch();
$('gz-search').oninput = applyFilter;
function applyFilter(){
  const q = $('gz-search').value.trim().toLowerCase();
  const keep = q ? GAMES.filter(g=>g.name.toLowerCase().includes(q)) : GAMES.slice();
  filtered = keep.length ? keep : GAMES.slice();
  sel = 0; drawRail(); select(0, true);
}

/* ── controller ──────────────────────────────────────────────── */
let padPrev={}, padOn=false;
function padLoop(){
  const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
  if(pads.length && !padOn){ padOn=true; }
  for(const p of pads){
    const ax = p.axes[0]||0;
    const right = (p.buttons[15] && p.buttons[15].pressed) || ax > .55;
    const left  = (p.buttons[14] && p.buttons[14].pressed) || ax < -.55;
    const down  = (p.buttons[13] && p.buttons[13].pressed) || (p.axes[1]||0) > .55;
    const up    = (p.buttons[12] && p.buttons[12].pressed) || (p.axes[1]||0) < -.55;
    const A     = p.buttons[0] && p.buttons[0].pressed;
    const B     = p.buttons[1] && p.buttons[1].pressed;
    const Start = p.buttons[9] && p.buttons[9].pressed;
    const prev  = padPrev[p.index] || {};
    const guideUp = $('gz-guide').classList.contains('on');

    if(guideUp){
      const items = guideItems();
      if(down && !prev.down){ gsel=(gsel+1)%items.length; paintGuide(); blip(520); }
      if(up   && !prev.up  ){ gsel=(gsel-1+items.length)%items.length; paintGuide(); blip(520); }
      if(A && !prev.A) doGuide(items[gsel].dataset.act);
      if(B && !prev.B) guideClose();
    } else if(playing){
      if(Start && !prev.Start) guideOpen();
    } else if(!$('gz-set').classList.contains('on')){
      if(right && !prev.right) select(sel+1);
      if(left  && !prev.left ) select(sel-1);
      if(A && !prev.A && filtered.length) launch(filtered[sel]);
      if(Start && !prev.Start) openSettings(filtered[sel]);
    }
    padPrev[p.index] = {right,left,up,down,A,B,Start};
  }
  requestAnimationFrame(padLoop);
}
requestAnimationFrame(padLoop);

/* ═══════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════ */
function boot(){
  paintTheme();
  if(window.self !== window.top){ const h=$('gz-home'); if(h) h.remove(); }
  railSizes();
  drawRail();
  drawRecords();
  select(0, true);
  if(window.paintIcons) paintIcons();
  $('gz-fs').innerHTML = icon(isFull()?'shrink':'expand',17);
  $('gz-theme').innerHTML = icon(store.get('ycz-gz-theme')==='light'?'moon':'sun',17);
}

/* the language picker, filled from the shared dictionary */
(function(){
  const s=$('gz-lang'); if(!s||!window.YCZ_LANGS) return;
  s.innerHTML = Object.keys(YCZ_LANGS).map(c=>`<option value="${c}">${c.toUpperCase()}</option>`).join('');
  s.value = (window.yczLang ? yczLang() : 'en');
  s.onchange = ()=>{ if(window.setLang) setLang(s.value); };
})();

/* when the language changes, the strings we draw ourselves need redrawing */
document.addEventListener('ycz-lang-changed', ()=>{ drawRecords(); select(sel, true); tick(); });

window.addEventListener('resize', ()=>{ railSizes(); slide(); });
window.addEventListener('beforeunload', bankTime);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) bankTime(); });

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
